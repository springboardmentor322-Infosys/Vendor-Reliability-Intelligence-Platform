<!DOCTYPE html>
<html>

<head>
    <title>Login - VRIP</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6fb;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        .login-container h1 {
            text-align: center;
            margin: 0;
            color: #2864e6;
            font-size: 36px;
        }

        .login-container .subtitle {
            text-align: center;
            color: #666;
            margin-top: 10px;
            margin-bottom: 35px;
            font-size: 16px;
        }

        .form-group {
            width: 100%;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #222;
        }

        .form-group input {
            width: 100%;
            height: 45px;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2864e6;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            background: #2864e6;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #1d4fc2;
        }

        .error-message {
            color: red;
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .register-link a {
            color: #2864e6;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="login-container">

    <h1>VRIP</h1>

    <p class="subtitle">
        Vendor Reliability Platform
    </p>

    <form id="loginForm">

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

        </div>

        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>

        <p
            id="errorMessage"
            class="error-message"
        ></p>

    </form>

    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>

</div>


<script>

const API_URL = "http://127.0.0.1:8000";


document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const errorMessage =
                document.getElementById(
                    "errorMessage"
                );


            errorMessage.textContent = "";


            try {

                const response =
                    await fetch(
                        API_URL + "/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",
                                "Accept":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "Login response:",
                    data
                );


                if (!response.ok) {

                    errorMessage.textContent =
                        data.detail ||
                        "Invalid email or password";

                    return;

                }


                // =========================
                // GET TOKEN FROM RESPONSE
                // =========================

                const accessToken =
                    data.access_token ||
                    data.token;


                if (!accessToken) {

                    console.error(
                        "Token not found in login response"
                    );

                    errorMessage.textContent =
                        "Login successful but token was not received.";

                    return;

                }


                // =========================
                // SAVE TOKEN
                // =========================

                localStorage.setItem(
                    "access_token",
                    accessToken
                );


                localStorage.setItem(
                    "token",
                    accessToken
                );


                localStorage.setItem(
                    "logged_in",
                    "true"
                );


                console.log(
                    "Token saved successfully"
                );


                // =========================
                // GO TO DASHBOARD
                // =========================

                window.location.href =
                    "dashboard.html";

            }

            catch (error) {

                console.error(
                    "Login Error:",
                    error
                );


                errorMessage.textContent =
                    "Unable to connect to server.";

            }

        }
    );

</script>

</body>

</html>
