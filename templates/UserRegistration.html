<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VendorIQ - User Registration</title>


    <!-- =====================================================
         GOOGLE FONT
         ===================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         REGISTRATION CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="/static/user_registration.css"
    >

</head>


<body class="user-registration">


<div class="registration-container">


    <!-- =====================================================
         LEFT BRANDING PANEL
         ===================================================== -->

    <div class="registration-left">


        <!-- BRAND -->

        <div class="brand">

            <div class="brand-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <div class="brand-text">

                <h1>VendorIQ</h1>

                <p>
                    Vendor Reliability Intelligence
                </p>

            </div>

        </div>


        <!-- INTRO -->

        <div class="registration-intro">

            <h2>
                User <span>Registration</span>
            </h2>

            <p>
                Create your account to access the
                VendorIQ procurement management platform.
            </p>


            <!-- VISUAL -->

            <div class="registration-visual">

                <i class="fa-solid fa-user-plus"></i>

            </div>

        </div>


        <!-- FOOTER -->

        <div class="registration-left-footer">

            Secure. Intelligent. Reliable.

        </div>


    </div>



    <!-- =====================================================
         RIGHT FORM PANEL
         ===================================================== -->

    <div class="registration-right">


        <!-- HEADER -->

        <div class="registration-header">

            <h1>
                Create Your Account
            </h1>

            <p>
                Enter your details to create your VendorIQ account.
            </p>

        </div>



        <!-- =================================================
             REGISTRATION FORM
             ================================================= -->

        <form
            id="registrationForm"
            class="registration-form"
        >


            <!-- =============================================
                 FULL NAME
                 ============================================= -->

            <div class="form-group">

                <label for="name">
                    Full Name
                    <span class="required">*</span>
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your Name"
                        autocomplete="name"
                        required
                    >

                </div>

            </div>



            <!-- =============================================
                 EMAIL
                 ============================================= -->

            <div class="form-group">

                <label for="email">
                    Email Address
                    <span class="required">*</span>
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter Email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>



            <!-- =============================================
                 MOBILE
                 ============================================= -->

            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                    <span class="required">*</span>
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-phone"></i>

                    <input
                        type="tel"
                        id="mobile"
                        class="form-control"
                        maxlength="10"
                        placeholder="Enter Mobile Number"
                        autocomplete="tel"
                        required
                    >

                </div>

            </div>



            <!-- =============================================
                 GENDER
                 ============================================= -->

            <div class="form-group">

                <label>
                    Gender
                </label>


                <div class="radio-group">


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                        >

                        <span>Male</span>

                    </label>


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >

                        <span>Female</span>

                    </label>


                    <label class="radio-option">

                        <input
                            type="radio"
                            name="gender"
                            value="Other"
                        >

                        <span>Other</span>

                    </label>


                </div>

            </div>



            <!-- =============================================
                 ROLE
                 ============================================= -->

            <div class="form-group">

                <label for="role">

                    Role

                    <span class="required">*</span>

                </label>


                <div class="input-wrapper">

                    <i class="fa-solid fa-briefcase"></i>

                    <select
                        id="role"
                        name="role"
                        class="form-control"
                        required
                    >

                        <option value="">
                            -- Select Role --
                        </option>

                        <option value="Admin">
                            Admin
                        </option>

                        <option value="Procurement Manager">
                            Procurement Manager
                        </option>

                        <option value="Supply Chain Manager">
                            Supply Chain Manager
                        </option>

                        <option value="Finance Officer">
                            Finance Officer
                        </option>

                        <option value="Auditor">
                            Auditor
                        </option>

                    </select>

                </div>

            </div>



            <!-- =============================================
                 PASSWORD
                 ============================================= -->

            <div class="form-group">

                <label for="password">

                    Password

                    <span class="required">*</span>

                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter Password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >


                    <i
                        class="fa-solid fa-eye password-toggle togglePassword"
                        data-target="password"
                    ></i>

                </div>

            </div>



            <!-- =============================================
                 CONFIRM PASSWORD
                 ============================================= -->

            <div class="form-group">

                <label for="confirm_password">

                    Confirm Password

                    <span class="required">*</span>

                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirm_password"
                        class="form-control"
                        placeholder="Confirm Password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >


                    <i
                        class="fa-solid fa-eye password-toggle togglePassword"
                        data-target="confirm_password"
                    ></i>

                </div>

            </div>



            <!-- =============================================
                 ADDRESS
                 ============================================= -->

            <div class="form-group">

                <label for="address">
                    Address
                </label>


                <textarea
                    id="address"
                    class="form-control"
                    rows="3"
                    placeholder="Enter Address"
                ></textarea>

            </div>



            <!-- =============================================
                 TERMS
                 ============================================= -->

            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">

                    I agree to the

                    <a href="#">
                        Terms & Conditions
                    </a>

                </label>

            </div>



            <!-- =============================================
                 REGISTER BUTTON
                 ============================================= -->

            <button
                type="submit"
                class="register-button"
            >

                <i class="fa-solid fa-user-plus"></i>

                &nbsp; Register

            </button>



            <!-- MESSAGE -->

            <p id="message"></p>



            <!-- =============================================
                 LOGIN LINKS
                 ============================================= -->

            <div class="login-link-section">

                <p>
                    Already have an account?
                </p>


                <div class="login-links">

                    <a href="/login">

                        <i class="fa-solid fa-user-shield"></i>

                        Login

                    </a>

                </div>

            </div>


        </form>

    </div>

</div>



<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="/static/user_registration.js"></script>


<!-- =====================================================
     PASSWORD TOGGLE
     ===================================================== -->

<script>

document.querySelectorAll(".togglePassword").forEach(
    function (toggle) {

        toggle.addEventListener(
            "click",
            function () {

                const targetId =
                    this.getAttribute("data-target");

                const password =
                    document.getElementById(targetId);

                if (!password) {
                    return;
                }


                if (password.type === "password") {

                    password.type = "text";

                    this.classList.remove(
                        "fa-eye"
                    );

                    this.classList.add(
                        "fa-eye-slash"
                    );

                }

                else {

                    password.type = "password";

                    this.classList.remove(
                        "fa-eye-slash"
                    );

                    this.classList.add(
                        "fa-eye"
                    );

                }

            }
        );

    }
);

</script>


</body>

</html>
