name: Deploy Angular Frontend to GitHub Pages

on:
  push:
    branches:
      - medidhi-v-naga-sri-surya-santhoshi-vendor-reliability-intelligence-platform
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular
        working-directory: frontend
        run: npm run build -- --base-href /Vendor-Reliability-Intelligence-Platform/

      - name: Prepare GitHub Pages
        run: |
          mkdir -p pages
          if [ -d frontend/dist/*/browser ]; then
            cp -r frontend/dist/*/browser/* pages/
          else
            cp -r frontend/dist/*/* pages/
          fi
          cp pages/index.html pages/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
