<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - VendorIQ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div style="margin-bottom: 24px;">
        <h1 style="font-size: 22px; font-weight: 700; margin-bottom: 6px;">Admin Approval Portal</h1>
        <p style="color: var(--text-secondary);">Manage and approve incoming user registration requests.</p>
    </div>

    <!-- Table Container -->
    <div class="table-card">
        <div class="table-header-bar">
            <div class="table-header-title">
                <h3>Pending Account Approval Queue</h3>
            </div>
        </div>
        <div class="table-container">
            <table id="pendingTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>User Name</th>
                        <th>Email Address</th>
                        <th>Requested Role</th>
                        <th>Approval Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated dynamically by admin_dashboard.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/admin_dashboard.js"></script>
</body>
</html>
