<!DOCTYPE html>
<html>

<head>

    <title>Vendor Reliability Report</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f6fa;
        }

        h1 {
            margin-bottom: 25px;
        }

        .buttons {
            margin-bottom: 20px;
        }

        button {
            padding: 10px 18px;
            margin-right: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #eee;
        }

        .report-header {
            margin-bottom: 20px;
        }

        @media print {

            .buttons {
                display: none;
            }

            body {
                margin: 10px;
                background: white;
            }

        }

    </style>

</head>


<body>

    <div class="report-header">

        <h1>
            Vendor Reliability Report
        </h1>

        <p>
            Vendor performance and reliability analysis
        </p>

    </div>


    <div class="buttons">

        <button onclick="window.print()">
            Print / Save PDF
        </button>

        <button onclick="loadVendorReliabilityReport()">
            Refresh Report
        </button>

    </div>


    <table>

        <thead>

            <tr>

                <th>Rank</th>

                <th>Vendor</th>

                <th>Total Orders</th>

                <th>Completed</th>

                <th>Pending</th>

                <th>Delivered</th>

                <th>Quality Score</th>

                <th>Delivery Rate</th>

                <th>Reliability Score</th>

                <th>Performance</th>

                <th>Risk</th>

                <th>Recommendation</th>

            </tr>

        </thead>


        <tbody id="reportTableBody">

        </tbody>

    </table>


    <br>

    <a href="dashboard.html">
        ← Back To Dashboard
    </a>


<script src="js/auth.js"></script>
<script src="js/vendor-reliability-report.js"></script>


</body>

</html>
