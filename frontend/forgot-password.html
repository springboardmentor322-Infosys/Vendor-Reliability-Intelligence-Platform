<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="VendorIQ password recovery information.">
    <title>Forgot password | VendorIQ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
  </head>
  <body class="auth-page" data-page="forgot-password">
    <main class="auth-shell container py-4 py-lg-5">
      <div class="row justify-content-center g-0 auth-card auth-card-compact overflow-hidden">
        <section class="col-md-8 col-lg-7 bg-white">
          <div class="auth-form-wrap">
            <a class="brand mb-5" href="login.html" aria-label="VendorIQ home">
              <img src="assets/images/vendoriq-mark.svg" width="40" height="40" alt="" aria-hidden="true">
              <span>VendorIQ</span>
            </a>
            <div class="mb-4">
              <p class="eyebrow text-primary mb-2">ACCOUNT ACCESS</p>
              <h1 class="auth-title">Forgot your password?</h1>
              <p class="text-muted mb-0">Enter your work email and we’ll explain the next step.</p>
            </div>

            <div id="forgotPasswordStatus" class="alert d-none" role="alert" aria-live="polite"></div>

            <form id="forgotPasswordForm" novalidate>
              <div class="mb-4">
                <label for="forgotEmail" class="form-label">Work email</label>
                <input id="forgotEmail" name="email" type="email" class="form-control form-control-lg" autocomplete="email" placeholder="you@company.com" required>
                <div class="invalid-feedback">Enter a valid email address.</div>
              </div>
              <button class="btn btn-primary btn-lg w-100" type="submit">Continue</button>
            </form>
            <p class="auth-switch mb-0"><a href="login.html">Back to sign in</a></p>
          </div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
