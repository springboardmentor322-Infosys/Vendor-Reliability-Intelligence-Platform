<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - VendorIQ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Forgot Password</h2>
            <p class="subtitle">Get a password reset link</p>
            
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter email" required>
                </div>
                <button type="submit" style="margin-top: 10px;">Send Reset Link</button>
            </form>
            
            <div id="message" style="display: none; margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center;"></div>
            
            <div class="auth-footer">
                <p><a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
