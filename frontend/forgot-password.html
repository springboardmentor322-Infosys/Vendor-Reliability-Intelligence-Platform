<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VendorIQ | Forgot Password</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Forgot Password</h1>
    <p class="sub">Enter your account email and we'll generate a reset link.</p>

    <form id="forgot-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@company.com">
      </div>
      <button type="submit" class="btn full">Send Reset Link</button>
      <div class="error-msg" id="error"></div>
    </form>

    <div class="hint-box hidden" id="result-box"></div>

    <p style="text-align:center; font-size:13px; margin-top:16px;">
      <a href="index.html" style="color:var(--accent); font-weight:600;">Back to Sign In</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById("forgot-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("error");
  const resultBox = document.getElementById("result-box");
  errorEl.textContent = "";
  resultBox.classList.add("hidden");

  try {
    const data = await api("/auth/forgot-password", {
      method: "POST",
      body: { email: document.getElementById("email").value },
    });

    resultBox.classList.remove("hidden");
    if (data.reset_link) {
      // No real email server in this demo build - show the link directly
      // instead of sending it, so the flow can still be tested end-to-end.
      resultBox.innerHTML = `
        <strong>${data.detail}</strong><br><br>
        <a href="${data.reset_link}" style="color:var(--accent); font-weight:600; word-break:break-all;">
          Click here to reset your password →
        </a>
      `;
    } else {
      resultBox.innerHTML = data.detail;
    }
  } catch (err) {
    errorEl.textContent = err.message;
  }
});
</script>
</body>
</html>
