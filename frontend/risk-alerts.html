<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risk Alert Center | VendorIQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    .alert-card {
      background: #fff;
      border: 1px solid var(--vi-slate-200);
      border-radius: var(--vi-radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.02);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
    }
    .alert-card-left {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }
    .severity-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .severity-critical { background: #7f1d1d; color: #fff; }
    .severity-high { background: #fef2f2; color: #ef4444; border: 1px solid #fee2e2; }
    .severity-warning { background: #fffbeb; color: #d97706; border: 1px solid #fef3c7; }
    .severity-medium { background: #fffbeb; color: #d97706; border: 1px solid #fef3c7; }
  </style>
</head>
<body data-module="riskAlerts">
  <div class="app-shell d-lg-flex">
    <aside id="appSidebar" class="app-sidebar"></aside>

    <main class="app-content">
      <header class="app-topbar d-flex align-items-center gap-3 px-3 px-md-4">
        <button id="menuToggle" class="btn btn-light d-lg-none" aria-label="Open menu">☰</button>
        <div class="me-auto">
          <p id="topRole" class="top-role mb-0">Risk Manager</p>
          <h1 id="pageTitle" class="h4 mb-0">Risk Alert Center</h1>
        </div>
        <div class="text-end d-none d-sm-block">
          <strong id="topUser">Account User</strong>
        </div>
        <button id="logoutButton" class="btn btn-outline-secondary btn-sm">Log out</button>
      </header>

      <section class="p-3 p-md-4">
        <!-- Dashboard Alert Overview -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h2 class="h5 mb-0">Active Intelligence Alerts</h2>
            <p class="text-muted small mb-0">System-triggered warnings requiring review and action planning.</p>
          </div>
        </div>

        <div id="alertsContainer">
          <div class="text-center py-5 text-muted">Loading risk intelligence alerts…</div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script>
    (() => {
      const api = window.VendorIQApi;
      const auth = window.VendorIQAuth;
      const $ = (selector) => document.querySelector(selector);
      
      const state = { user: null, roles: [] };
      const canResolve = () => state.roles.some((role) => ["Administrator", "Procurement Manager", "Supply Chain Manager", "Finance Officer"].includes(role));

      async function loadAlerts() {
        try {
          const alerts = await api.request("/vendors/risk/alerts", { token: auth.getAccessToken() });
          const unreadAlerts = alerts.filter(a => !a.is_read);

          if (!unreadAlerts.length) {
            $("#alertsContainer").innerHTML = `
              <div class="dashboard-card text-center py-5">
                <i class="bi bi-shield-check text-success display-4"></i>
                <h3 class="h5 mt-3">All Clear</h3>
                <p class="text-muted mb-0">No active risk alerts require attention at this time.</p>
              </div>
            `;
            return;
          }

          const cards = unreadAlerts.map(a => {
            const sev = a.severity || "WARNING";
            const sevClass = sev.toLowerCase() === "critical" ? "severity-critical" : (sev.toLowerCase() === "high" ? "severity-high" : "severity-warning");
            
            // Recommended actions logic
            let recAction = "Review supplier performance.";
            if (a.title.includes("High Risk Alert")) recAction = "Begin alternate supplier evaluation & freeze new POs.";
            if (a.title.includes("Compliance")) recAction = "Request updated contract & certification compliance docs.";
            if (a.title.includes("Dependency")) recAction = "Distribute procurement orders to diversify delivery lanes.";

            return `
              <div class="alert-card border-start border-${sev.toLowerCase() === 'critical' ? 'danger' : 'warning'} border-4">
                <div class="alert-card-left">
                  <span class="severity-badge ${sevClass} mt-1">${sev}</span>
                  <div>
                    <h3 class="h6 mb-1 font-weight-bold text-dark">${esc(a.title)}</h3>
                    <p class="mb-1 text-muted small">${esc(a.reason)}</p>
                    <small class="text-primary d-block font-weight-bold mb-1"><i class="bi bi-lightbulb-fill"></i> Recommendation: ${recAction}</small>
                    <small class="text-muted-xs">${new Date(a.created_at).toLocaleString()}</small>
                  </div>
                </div>
                <div class="d-flex gap-2">
                  ${a.related_entity_id ? `<a class="btn btn-sm btn-outline-primary" href="vendor-details.html?id=${a.related_entity_id}">View Vendor</a>` : ""}
                  ${canResolve() ? `<button class="btn btn-sm btn-success" onclick="resolveAlert(${a.id})">Mark Resolved</button>` : ""}
                </div>
              </div>
            `;
          });

          $("#alertsContainer").innerHTML = cards.join("");

        } catch (e) {
          $("#alertsContainer").innerHTML = `<div class="alert alert-danger">Failed to load risk alerts: ${e.message}</div>`;
        }
      }

      window.resolveAlert = async (id) => {
        try {
          await api.request(`/vendors/risk/alerts/${id}/resolve`, { method: "POST", token: auth.getAccessToken() });
          await loadAlerts();
        } catch (e) {
          alert("Failed to resolve alert: " + e.message);
        }
      };

      const esc = (value) => String(value ?? "—").replace(/[&<>'"]/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[character]));

      async function init() {
        if (!auth.requireAuthentication()) return;
        state.user = auth.getUser() || auth.setUser(await api.request("/auth/me", { token: auth.getAccessToken() }));
        const roles = auth.getRoleNames(state.user);
        state.roles = roles;
        $("#topUser").textContent = `${state.user.first_name || "Account"} ${state.user.last_name || ""}`;
        $("#topRole").textContent = roles.join(", ");
        
        await window.VendorIQNavigationReady;
        window.VendorIQNavigation?.render("#appSidebar", state.user, roles);
        await loadAlerts();
        
        $("#logoutButton").addEventListener("click", () => {
          auth.clearSession();
          location.replace("login.html");
        });
      }
      
      init();
    })();
  </script>
</body>
</html>
