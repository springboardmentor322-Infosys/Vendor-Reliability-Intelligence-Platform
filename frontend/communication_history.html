<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Communication History</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/communication_history.css">

</head>

<body>

<div id="sidebar-container"></div>

<div class="main-content">

<div id="navbar"></div>

<div class="page-content">

<div class="page-header">

<h2>Communication History</h2>

<button id="addCommunicationBtn">

+ Add Communication

</button>

</div>

<div class="filters">

<input
type="text"
id="searchCommunication"
placeholder="Search Subject">

<select id="typeFilter">

<option value="">All Types</option>

<option>Email</option>

<option>Phone</option>

<option>Meeting</option>

<option>Chat</option>

</select>

</div>

<table>

<thead>

<tr>

<th>Vendor</th>

<th>Subject</th>

<th>Type</th>

<th>Sender</th>

<th>Receiver</th>

<th>Date</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="communicationTableBody">

</tbody>

</table>

</div>

</div>

<div class="modal" id="communicationModal">

<div class="modal-content">

<h2 id="modalTitle">

Add Communication

</h2>

<form id="communicationForm">

<select id="vendorSelect"></select>


<input
type="text"
id="subject"
placeholder="Subject"
required>

<select id="communicationType">

<option>Email</option>

<option>Phone</option>

<option>Meeting</option>

<option>Chat</option>

</select>

<input
type="text"
id="sender"
placeholder="Sender"
required>

<input
type="text"
id="receiver"
placeholder="Receiver"
required>

<textarea
id="message"
placeholder="Message"
required></textarea>

<div class="modal-buttons">

<button type="submit">

Save

</button>

<button
type="button"
id="cancelCommunication">

Cancel

</button>

</div>

</form>

</div>

</div>

<script src="js/api.js"></script>
<script src="js/roleAccess.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/toast.js"></script>
<script src="js/confirm.js"></script>
<script src="js/communication_history.js"></script>
<script>
  requirePermission("communication");
</script>

</body>

</html>
