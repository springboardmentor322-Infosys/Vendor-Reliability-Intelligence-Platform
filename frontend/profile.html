<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - VendorIQ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div style="margin-bottom: 24px;">
        <h1 style="font-size: 22px; font-weight: 700; margin-bottom: 6px;">User Profile Settings</h1>
        <p style="color: var(--text-secondary);">Manage account identification, personal contact info, and assigned system role permissions.</p>
    </div>

    <!-- Center Card container -->
    <div style="display: flex; justify-content: center; align-items: start; margin-top: 32px;">
        <div class="form-container" style="max-width: 550px; width: 100%;">
            <div class="form-title">Account Profile Ledger</div>
            <form id="profileForm">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="name">Username</label>
                    <input type="text" id="name" required placeholder="Account username">
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" readonly disabled style="background-color: var(--bg-color); cursor: not-allowed;">
                    <span style="font-size: 11px; color: var(--text-secondary); margin-top: 4px; display: inline-block;">Email addresses are managed by administrators and cannot be altered.</span>
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="role">Assigned Platform Role</label>
                    <input type="text" id="role" readonly disabled style="background-color: var(--bg-color); cursor: not-allowed;">
                </div>

                <div class="form-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 16px;">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" placeholder="First name">
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" placeholder="Last name">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" placeholder="Enter contact phone">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px;">Update Account Details</button>
            </form>

            <div id="message" style="display: none; margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 13px; font-weight: 500; text-align: center;"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
