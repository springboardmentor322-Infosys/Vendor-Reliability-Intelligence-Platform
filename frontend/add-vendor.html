<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Supplier - VendorIQ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div style="margin-bottom: 24px;">
        <h1 style="font-size: 22px; font-weight: 700; margin-bottom: 6px;">Register New Supplier</h1>
        <p style="color: var(--text-secondary);">Onboard a new supplier account, category classification, and contact coordinates.</p>
    </div>

    <div style="display: flex; justify-content: center; align-items: start; margin-top: 32px;">
        <div class="form-container" style="max-width: 600px; width: 100%;">
            <div class="form-title">Supplier Registration Credentials</div>
            <form id="vendorForm">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="vendor_name">Vendor Name</label>
                    <input type="text" id="vendor_name" value="AKP Traders" required placeholder="Vendor name or trade identity">
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="company">Company Name</label>
                    <input type="text" id="company" value="AKP Pvt Ltd" required placeholder="Registered company entity name">
                </div>

                <div class="form-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 16px;">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" value="akp@gmail.com" required placeholder="contact@company.com">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" value="9876543210" required placeholder="Contact phone number">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="address">Address Location</label>
                    <textarea id="address" rows="3" required placeholder="Complete corporate headquarters address">Nashik</textarea>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="category">Supplier Procurement Category</label>
                    <select id="category" required>
                        <option value="Raw Material Supplier">Raw Material Supplier</option>
                        <option value="Equipment Vendor">Equipment Vendor</option>
                        <option value="IT Vendor">IT Vendor</option>
                        <option value="Service Provider">Service Provider</option>
                        <option value="Logistics Partner">Logistics Partner</option>
                        <option value="Maintenance Vendor">Maintenance Vendor</option>
                    </select>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='vendors.html'">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Vendor</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/vendor.js"></script>
</body>
</html>
