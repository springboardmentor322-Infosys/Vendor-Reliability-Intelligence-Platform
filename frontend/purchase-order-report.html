<!DOCTYPE html>
<html>

<head>

    <title>Purchase Order Report</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f6fa;
        }

        h1 {
            margin-bottom: 10px;
        }

        .buttons {
            margin: 20px 0;
        }

        button {
            padding: 10px 18px;
            margin-right: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #eee;
        }

        @media print {

            .buttons,
            .back-link {
                display: none;
            }

            body {
                margin: 10px;
                background: white;
            }

        }

    </style>

</head>


<body>

    <h1>Purchase Order Report</h1>

    <p>
        Purchase order and procurement transaction report
    </p>


    <div class="buttons">

        <button onclick="window.print()">
            Print / Save PDF
        </button>

        <button onclick="loadPurchaseOrderReport()">
            Refresh Report
        </button>

    </div>


    <table>

        <thead>

            <tr>

                <th>Order ID</th>

                <th>Vendor</th>

                <th>Product</th>

                <th>Quantity</th>

                <th>Unit Price</th>

                <th>Total Amount</th>

                <th>Order Date</th>

                <th>Expected Delivery</th>

                <th>Status</th>

            </tr>

        </thead>


        <tbody id="purchaseReportBody">

        </tbody>

    </table>


    <br>

    <a
        class="back-link"
        href="dashboard.html"
    >
        ← Back To Dashboard
    </a>


<script src="js/auth.js"></script>
<script src="js/purchase-order-report.js"></script>


</body>

</html>
