<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorIQ | Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =========================================================
           VendorIQ Dashboard
           Clean enterprise dashboard - blue/navy theme
        ========================================================= */

        :root {
            --dash-primary: #1e3a5f;
            --dash-blue: #2563eb;
            --dash-blue-light: #eff6ff;

            --dash-bg: #f4f7fb;
            --dash-card: #ffffff;
            --dash-border: #e2e8f0;

            --dash-text: #172033;
            --dash-muted: #64748b;

            --dash-green: #16a34a;
            --dash-green-light: #ecfdf3;

            --dash-yellow: #d97706;
            --dash-yellow-light: #fff7ed;

            --dash-red: #dc2626;
            --dash-red-light: #fef2f2;

            --dash-purple: #7c3aed;
            --dash-purple-light: #f5f3ff;

            --dash-radius: 12px;
            --dash-shadow: 0 3px 14px rgba(15, 23, 42, 0.07);
        }

        body {
            background: var(--dash-bg);
        }

        #page-content {
            width: 100%;
        }

        /* Header */

        .dashboard-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 22px;
        }

        .dashboard-heading h1 {
            margin: 0 0 6px;
            color: var(--dash-text);
            font-size: 28px;
            font-weight: 700;
        }

        .dashboard-heading p {
            margin: 0;
            color: var(--dash-muted);
            font-size: 14px;
        }

        .dashboard-date {
            text-align: right;
            color: var(--dash-muted);
            font-size: 13px;
        }

        .dashboard-date strong {
            display: block;
            color: var(--dash-text);
            margin-bottom: 4px;
        }

        /* KPI */

        .dashboard-kpis {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 18px;
        }

        .dashboard-kpi {
            background: var(--dash-card);
            border: 1px solid var(--dash-border);
            border-radius: var(--dash-radius);
            padding: 18px;
            min-height: 105px;
            box-shadow: var(--dash-shadow);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .dashboard-kpi-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--dash-blue-light);
            color: var(--dash-blue);
            font-size: 22px;
            flex-shrink: 0;
        }

        .dashboard-kpi.green .dashboard-kpi-icon {
            background: var(--dash-green-light);
            color: var(--dash-green);
        }

        .dashboard-kpi.yellow .dashboard-kpi-icon {
            background: var(--dash-yellow-light);
            color: var(--dash-yellow);
        }

        .dashboard-kpi.red .dashboard-kpi-icon {
            background: var(--dash-red-light);
            color: var(--dash-red);
        }

        .dashboard-kpi.purple .dashboard-kpi-icon {
            background: var(--dash-purple-light);
            color: var(--dash-purple);
        }

        .dashboard-kpi-label {
            color: var(--dash-muted);
            font-size: 13px;
            margin-bottom: 5px;
        }

        .dashboard-kpi-value {
            color: var(--dash-text);
            font-size: 25px;
            font-weight: 700;
            line-height: 1.1;
        }

        .dashboard-kpi-sub {
            color: var(--dash-muted);
            font-size: 11px;
            margin-top: 5px;
        }

        /* Main grid */

        .dashboard-main-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.65fr) minmax(280px, 0.9fr);
            gap: 16px;
            margin-bottom: 16px;
        }

        .dashboard-chart-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .dashboard-panel {
            background: var(--dash-card);
            border: 1px solid var(--dash-border);
            border-radius: var(--dash-radius);
            box-shadow: var(--dash-shadow);
            overflow: hidden;
        }

        .dashboard-panel-header {
            min-height: 58px;
            padding: 15px 17px;
            border-bottom: 1px solid var(--dash-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .dashboard-panel-title {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--dash-text);
            font-size: 15px;
            font-weight: 700;
        }

        .dashboard-panel-title span {
            color: var(--dash-blue);
            font-size: 18px;
        }

        .dashboard-panel-action {
            color: var(--dash-blue);
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .dashboard-panel-body {
            padding: 16px;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 285px;
        }

        .chart-container.small {
            height: 250px;
        }

        /* Table */

        .dashboard-table-wrapper {
            overflow-x: auto;
        }

        .dashboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .dashboard-table th {
            background: #f8fafc;
            color: #64748b;
            font-weight: 600;
            text-align: left;
            padding: 11px 12px;
            border-bottom: 1px solid var(--dash-border);
            white-space: nowrap;
        }

        .dashboard-table td {
            color: #334155;
            padding: 11px 12px;
            border-bottom: 1px solid #edf1f5;
            white-space: nowrap;
        }

        .dashboard-table tr:last-child td {
            border-bottom: none;
        }

        .dashboard-table tr:hover td {
            background: #f8fbff;
        }

        /* Badges */

        .dash-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .dash-badge.success {
            background: var(--dash-green-light);
            color: var(--dash-green);
        }

        .dash-badge.warning {
            background: #fff7ed;
            color: var(--dash-yellow);
        }

        .dash-badge.danger {
            background: var(--dash-red-light);
            color: var(--dash-red);
        }

        .dash-badge.info {
            background: var(--dash-blue-light);
            color: var(--dash-blue);
        }

        /* Activity */

        .activity-list {
            display: flex;
            flex-direction: column;
        }

        .activity-item {
            display: flex;
            gap: 11px;
            padding: 12px 0;
            border-bottom: 1px solid #edf1f5;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--dash-blue-light);
            color: var(--dash-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .activity-content {
            min-width: 0;
            flex: 1;
        }

        .activity-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--dash-text);
        }

        .activity-text {
            font-size: 11px;
            color: var(--dash-muted);
            margin-top: 3px;
        }

        .activity-time {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Quick actions */

        .quick-actions-panel {
            margin-top: 4px;
            margin-bottom: 20px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .quick-action {
            border: 1px solid var(--dash-border);
            border-radius: 10px;
            background: #ffffff;
            padding: 17px 12px;
            text-decoration: none;
            color: var(--dash-text);
            cursor: pointer;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quick-action:hover {
            border-color: var(--dash-blue);
            background: var(--dash-blue-light);
            transform: translateY(-1px);
        }

        .quick-action-icon {
            width: 40px;
            height: 40px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--dash-blue-light);
            color: var(--dash-blue);
            font-size: 18px;
            flex-shrink: 0;
        }

        .quick-action.green .quick-action-icon {
            background: var(--dash-green-light);
            color: var(--dash-green);
        }

        .quick-action.yellow .quick-action-icon {
            background: var(--dash-yellow-light);
            color: var(--dash-yellow);
        }

        .quick-action.purple .quick-action-icon {
            background: var(--dash-purple-light);
            color: var(--dash-purple);
        }

        .quick-action-text strong {
            display: block;
            font-size: 12px;
            margin-bottom: 3px;
        }

        .quick-action-text span {
            color: var(--dash-muted);
            font-size: 10px;
        }

        /* Empty/Error */

        .dashboard-empty {
            padding: 35px 20px;
            text-align: center;
            color: var(--dash-muted);
            font-size: 13px;
        }

        .dashboard-error {
            padding: 20px;
            color: var(--dash-red);
            background: var(--dash-red-light);
            border: 1px solid #fecaca;
            border-radius: 10px;
        }

        /* Insight */

        .dashboard-insight {
            padding: 15px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid var(--dash-border);
            margin-top: 14px;
        }

        .dashboard-insight-title {
            font-weight: 700;
            color: var(--dash-text);
            font-size: 13px;
            margin-bottom: 5px;
        }

        .dashboard-insight-text {
            color: var(--dash-muted);
            font-size: 11px;
            line-height: 1.5;
        }

        /* Responsive */

        @media (max-width: 1200px) {
            .dashboard-kpis {
                grid-template-columns: repeat(2, 1fr);
            }

            .dashboard-main-grid {
                grid-template-columns: 1fr;
            }

            .quick-actions {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 800px) {
            .dashboard-heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .dashboard-date {
                text-align: left;
            }

            .dashboard-chart-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 550px) {
            .dashboard-kpis {
                grid-template-columns: 1fr;
            }

            .quick-actions {
                grid-template-columns: 1fr;
            }

            .dashboard-heading h1 {
                font-size: 23px;
            }

            .chart-container {
                height: 240px;
            }
        }
    </style>
</head>

<body>

<div class="app-shell" id="app-shell"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="./js/api.js"></script>

<script>

requireAuth();
renderShell("dashboard.html", "Dashboard");


/* =========================================================
   Helpers
========================================================= */

function escapeHtml(value) {
    if (value === null || value === undefined) return "-";

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function formatDate(value) {
    if (!value) return "-";

    try {
        return new Date(value).toLocaleDateString("en-IN", {
            day: "2-digit",
            month: "short",
            year: "numeric"
        });
    } catch {
        return value;
    }
}


function money(value) {
    const number = Number(value || 0);

    return "₹" + number.toLocaleString("en-IN", {
        maximumFractionDigits: 0
    });
}


function number(value) {
    return Number(value || 0).toLocaleString("en-IN");
}


function todayText() {
    return new Date().toLocaleDateString("en-IN", {
        weekday: "long",
        day: "numeric",
        month: "short",
        year: "numeric"
    });
}


function getUserName() {
    try {
        const user = JSON.parse(localStorage.getItem("vq_user") || "{}");

        return user.full_name ||
               user.name ||
               user.username ||
               user.email ||
               "User";
    } catch {
        return "User";
    }
}


/*
    Quick Actions intentionally use the existing sidebar links.
    This keeps the current project navigation and routes unchanged.
*/
function goToExistingPage(label) {

    const links = [...document.querySelectorAll(
        ".sidebar a, .sidebar-link, nav a"
    )];

    const target = links.find(link =>
        link.textContent.trim().toLowerCase().includes(
            label.toLowerCase()
        )
    );

    if (target) {
        target.click();
        return;
    }

    console.warn("Navigation item not found:", label);
}


/* =========================================================
   Common dashboard header
========================================================= */

function dashboardHeader(title, subtitle, role) {

    return `
        <div class="dashboard-heading">

            <div>
                <h1>${escapeHtml(title)}</h1>
                <p>${escapeHtml(subtitle)}</p>
            </div>

            <div class="dashboard-date">
                <strong>${todayText()}</strong>
                ${escapeHtml(role || "")}
            </div>

        </div>
    `;
}


/* =========================================================
   KPI card
   NOTE:
   KPI cards are intentionally NOT clickable.
========================================================= */

function kpi(label, value, icon, color = "", sub = "") {

    return `
        <div class="dashboard-kpi ${color}">

            <div class="dashboard-kpi-icon">
                ${icon}
            </div>

            <div>
                <div class="dashboard-kpi-label">
                    ${escapeHtml(label)}
                </div>

                <div class="dashboard-kpi-value">
                    ${escapeHtml(value)}
                </div>

                ${
                    sub
                    ? `<div class="dashboard-kpi-sub">${escapeHtml(sub)}</div>`
                    : ""
                }
            </div>

        </div>
    `;
}


/* =========================================================
   Panel
========================================================= */

function panel(title, content, icon = "▣", action = "") {

    return `
        <div class="dashboard-panel">

            <div class="dashboard-panel-header">

                <div class="dashboard-panel-title">
                    <span>${icon}</span>
                    ${escapeHtml(title)}
                </div>

                ${
                    action
                    ? `<a class="dashboard-panel-action"
                          href="${action.href || "#"}">
                          ${escapeHtml(action.text || "View All")}
                       </a>`
                    : ""
                }

            </div>

            <div class="dashboard-panel-body">
                ${content}
            </div>

        </div>
    `;
}


/* =========================================================
   Quick Actions
========================================================= */

function quickAction(title, description, icon, color, navLabel) {

    return `
        <button
            type="button"
            class="quick-action ${color}"
            onclick="goToExistingPage('${navLabel}')">

            <div class="quick-action-icon">
                ${icon}
            </div>

            <div class="quick-action-text">
                <strong>${escapeHtml(title)}</strong>
                <span>${escapeHtml(description)}</span>
            </div>

        </button>
    `;
}


function quickActions(items) {

    return `
        <div class="dashboard-panel quick-actions-panel">

            <div class="dashboard-panel-header">

                <div class="dashboard-panel-title">
                    <span>⚡</span>
                    Quick Actions
                </div>

            </div>

            <div class="dashboard-panel-body">

                <div class="quick-actions">

                    ${items.map(item =>
                        quickAction(
                            item.title,
                            item.description,
                            item.icon,
                            item.color,
                            item.nav
                        )
                    ).join("")}

                </div>

            </div>

        </div>
    `;
}


/* =========================================================
   Chart helper
========================================================= */

const dashboardCharts = {};


function drawDashboardChart(
    canvasId,
    type,
    labels,
    datasets,
    options = {}
) {

    const canvas = document.getElementById(canvasId);

    if (!canvas || typeof Chart === "undefined") {
        return;
    }

    if (dashboardCharts[canvasId]) {
        dashboardCharts[canvasId].destroy();
    }

    const ctx = canvas.getContext("2d");

    const defaultColors = [
        "#2563eb",
        "#16a34a",
        "#f59e0b",
        "#7c3aed",
        "#dc2626",
        "#0891b2"
    ];

    const processedDatasets = datasets.map((dataset, index) => ({
        ...dataset,
        backgroundColor:
            dataset.backgroundColor ||
            defaultColors[index % defaultColors.length],
        borderColor:
            dataset.borderColor ||
            defaultColors[index % defaultColors.length],
        borderWidth:
            dataset.borderWidth ?? 2,
        borderRadius:
            type === "bar" ? 4 : 0,
        tension:
            type === "line" ? 0.35 : 0,
        fill:
            type === "line" ? false : undefined,
        pointRadius:
            type === "line" ? 3 : undefined,
        pointHoverRadius:
            type === "line" ? 5 : undefined
    }));

    dashboardCharts[canvasId] = new Chart(ctx, {

        type,

        data: {
            labels,
            datasets: processedDatasets
        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            interaction: {
                intersect: false,
                mode: "index"
            },

            plugins: {

                legend: {
                    display: true,
                    position: "top",
                    align: "end",

                    labels: {
                        usePointStyle: true,
                        boxWidth: 8,
                        color: "#475569",
                        font: {
                            size: 11
                        }
                    }
                },

                tooltip: {
                    backgroundColor: "#172033",
                    padding: 10,
                    titleFont: {
                        size: 12
                    },
                    bodyFont: {
                        size: 11
                    }
                }
            },

            scales: type === "doughnut" || type === "pie"
                ? {}
                : {

                    x: {
                        stacked: options.stacked || false,

                        grid: {
                            display: false
                        },

                        ticks: {
                            color: "#64748b",
                            font: {
                                size: 10
                            }
                        }
                    },

                    y: {
                        stacked: options.stacked || false,

                        beginAtZero: true,

                        grid: {
                            color: "#edf1f5"
                        },

                        ticks: {
                            color: "#64748b",
                            font: {
                                size: 10
                            }
                        }
                    }
                },

            ...options.chartOptions
        }
    });
}


/* =========================================================
   PROCUREMENT MANAGER
========================================================= */

function renderProcurementDashboard(data) {

    const overview = data.procurement_overview || {};
    const performance = data.vendor_performance || [];
    const delivery = data.delivery_status || {};

    const byStatus = overview.by_status || {};

    const totalPO =
        overview.total_purchase_orders ??
        overview.total_orders ??
        0;

    const pending =
        overview.pending_approval ??
        byStatus.pending ??
        0;

    const active =
        overview.active_orders ??
        byStatus.active ??
        0;

    const delivered =
        overview.delivered_orders ??
        byStatus.delivered ??
        0;

    const delayed =
        overview.delayed_orders ??
        byStatus.delayed ??
        0;

    const completed =
        overview.completed_orders ??
        byStatus.completed ??
        0;

    const spend =
        overview.total_spend ??
        overview.total_procurement_spend ??
        0;

    document.getElementById("page-content").innerHTML = `

        ${dashboardHeader(
            `Good Morning, ${getUserName()}! `,
            "Here's your procurement intelligence overview for today.",
            "Procurement Manager"
        )}

        <div class="dashboard-kpis">

            ${kpi(
                "Total Purchase Orders",
                number(totalPO),
                "▣",
                "",
                "All purchase orders"
            )}

            ${kpi(
                "Pending Approval",
                number(pending),
                "◷",
                "yellow",
                "Waiting for approval"
            )}

            ${kpi(
                "Active Orders",
                number(active),
                "◈",
                "green",
                "Currently in progress"
            )}

            ${kpi(
                "Total Procurement Spend",
                money(spend),
                "₹",
                "purple",
                "Current procurement value"
            )}

        </div>


        <div class="dashboard-chart-grid">

            ${panel(
                "Procurement Order Trend",
                `
                    <div class="chart-container">
                        <canvas id="procurementLineChart"></canvas>
                    </div>
                `,
                "📈"
            )}

            ${panel(
                "Order Status Distribution",
                `
                    <div class="chart-container">
                        <canvas id="procurementStatusChart"></canvas>
                    </div>
                `,
                "◉"
            )}

        </div>


        <div class="dashboard-chart-grid">

            ${panel(
                "Monthly Order Status",
                `
                    <div class="chart-container">
                        <canvas id="procurementStackedChart"></canvas>
                    </div>
                `,
                "▥"
            )}

            ${panel(
                "Vendor Reliability Performance",
                `
                    <div class="chart-container">
                        <canvas id="procurementVendorChart"></canvas>
                    </div>
                `,
                "▮"
            )}

        </div>


        <div class="dashboard-main-grid">

            ${panel(
                "Vendor Performance",
                `
                    <div class="dashboard-table-wrapper">

                        <table class="dashboard-table">

                            <thead>
                                <tr>
                                    <th>Vendor</th>
                                    <th>Reliability</th>
                                    <th>Risk</th>
                                </tr>
                            </thead>

                            <tbody>

                                ${
                                    performance.length
                                    ? performance.slice(0, 7).map(v => `
                                        <tr>
                                            <td>${escapeHtml(
                                                v.vendor_name ||
                                                v.name ||
                                                "Vendor"
                                            )}</td>

                                            <td>
                                                ${Number(
                                                    v.reliability_score ??
                                                    v.score ??
                                                    0
                                                ).toFixed(1)}%
                                            </td>

                                            <td>
                                                <span class="dash-badge ${
                                                    String(v.risk_level || "")
                                                        .toLowerCase()
                                                        .includes("high")
                                                    ? "danger"
                                                    : String(v.risk_level || "")
                                                        .toLowerCase()
                                                        .includes("medium")
                                                    ? "warning"
                                                    : "success"
                                                }">
                                                    ${escapeHtml(
                                                        v.risk_level || "Low"
                                                    )}
                                                </span>
                                            </td>
                                        </tr>
                                    `).join("")
                                    : `
                                        <tr>
                                            <td colspan="3">
                                                No vendor performance data available.
                                            </td>
                                        </tr>
                                    `
                                }

                            </tbody>

                        </table>

                    </div>
                `,
                "▣"
            )}

            ${panel(
                "Procurement Overview",
                `
                    <div class="activity-list">

                        <div class="activity-item">
                            <div class="activity-icon">✓</div>
                            <div class="activity-content">
                                <div class="activity-title">
                                    Delivered Orders
                                </div>
                                <div class="activity-text">
                                    ${number(delivered)} orders delivered.
                                </div>
                            </div>

/* =========================================================
   Dashboard Loader
========================================================= */

async function loadDashboard() {

    try {

        const data =
            await api("/dashboard/summary");

        const role =
            data.role;

        if (role === "Administrator") {

            renderAdministratorDashboard(data);

        } else if (role === "Procurement Manager") {

            renderProcurementDashboard(data);

        } else if (role === "Supply Chain Manager") {

            renderSupplyChainDashboard(data);

        } else if (role === "Vendor") {

            renderVendorDashboard(data);

        } else if (role === "Finance Officer") {

            renderFinanceDashboard(data);

        } else if (role === "Auditor") {

            await renderAuditorDashboard(data);

        } else {

            renderProcurementDashboard(data);
        }

    } catch (error) {

        console.error("Dashboard error:", error);

        const page =
            document.getElementById("page-content");

        if (page) {

            page.innerHTML = `

                <div class="dashboard-error">

                    <strong>
                        Unable to load dashboard
                    </strong>

                    <p>
                        Please make sure the backend server is running
                        and try again.
                    </p>

                </div>

            `;
        }
    }
}


loadDashboard();
