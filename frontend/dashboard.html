<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VendorIQ Intelligence</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body class="intelligence-page">
  <div class="intelligence-shell">
    <aside id="roleSidebar" class="intelligence-sidebar" aria-label="Workspace navigation"></aside>
    <main class="intelligence-main">
      <header class="intelligence-topbar">
        <button id="sidebarToggle" class="btn btn-light d-lg-none" aria-label="Toggle navigation"><i class="bi bi-list"></i></button>
        <div><p id="roleEyebrow" class="eyebrow mb-1">VENDORIQ INTELLIGENCE</p><h1 id="dashboardTitle" class="h4 mb-0">Loading workspace</h1></div>
        <div class="ms-auto d-flex align-items-center gap-3"><span id="updatedAt" class="small text-muted d-none d-md-inline"></span><div class="top-account"><span id="navInitials" class="avatar">U</span><span id="navUserName">Account</span></div><button id="logoutButton" class="btn btn-outline-secondary btn-sm">Log out</button></div>
      </header>
      <section class="p-3 p-md-4" aria-live="polite">
        <div id="dashboardError" class="alert alert-danger d-none"></div>
        <div id="heroPanel" class="intelligence-hero mb-4 dashboard-loading"><div><p class="eyebrow">PREPARING YOUR WORKSPACE</p><div class="loading-line loading-line-title"></div><div class="loading-line loading-line-copy mt-3"></div></div></div>
        <div id="welcomeBar" class="d-none mb-4"></div>
        <div id="kpiGrid" class="row g-3 mb-4"><div class="col-sm-6 col-xl-3"><div class="loading-card"></div></div><div class="col-sm-6 col-xl-3"><div class="loading-card"></div></div><div class="col-sm-6 col-xl-3"><div class="loading-card"></div></div><div class="col-sm-6 col-xl-3"><div class="loading-card"></div></div></div>
        <div id="quickActions" class="quick-actions mb-4"></div>
        <div id="chartGrid" class="row g-4 mb-4"></div>
        <div class="row g-4"><div class="col-xl-8"><article class="intelligence-card h-100"><div class="card-title-row"><div><p id="primaryTableEyebrow" class="eyebrow mb-1">PRIORITY QUEUE</p><h2 id="primaryTableTitle" class="h5 mb-0">Live records</h2></div><a id="primaryTableLink" class="btn btn-sm btn-outline-primary" href="#">Open workspace</a></div><div class="table-responsive"><table class="table intelligence-table align-middle mb-0"><thead id="primaryTableHead"></thead><tbody id="primaryTableRows"><tr><td class="py-4 text-muted">Loading live records…</td></tr></tbody></table></div></article></div><div class="col-xl-4"><article class="intelligence-card h-100"><p class="eyebrow mb-1">ACTION CENTER</p><h2 class="h5 mb-3">Recommendations</h2><div id="insightList" class="insight-list"><div class="insight text-muted">Loading operational recommendations…</div></div></article></div></div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
