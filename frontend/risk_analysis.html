<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Risk Analysis | VendorIntel</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    body { background-color: #f1f5f9; color: #0f172a; font-family: 'Inter', sans-serif; }
    .glass-panel {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(20px);
        border: 1px solid #cbd5e1;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
    }

        /* Premium Light Theme Override */
        .light body { 
            background-color: #f8fafc; /* Soft slate-50 */
            color: #0f172a; 
        }
        .light .glass-panel, .light .glass-widget {
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7)) !important;
            backdrop-filter: blur(24px) !important;
            -webkit-backdrop-filter: blur(24px) !important;
            border-top: 1px solid rgba(255, 255, 255, 1) !important;
            border-left: 1px solid rgba(255, 255, 255, 1) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.4) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4) !important;
            box-shadow: 0 20px 40px -12px rgba(100, 116, 139, 0.15), inset 0 2px 4px rgba(255, 255, 255, 0.8) !important;
        }
        .light h1, .light h2, .light h3, .light .text-white { color: #0f172a !important; }
        .light p, .light .text-tertiary-fixed-dim { color: #475569 !important; }
        .light .bg-\[\#1e293b\] { 
            background-color: #ffffff !important; 
            color: #0f172a !important; 
            border-color: #cbd5e1 !important;
        }
        .light table th, .light table td {
            border-color: #e2e8f0 !important;
        }
        .light .border-white\/5, .light .border-white\/10, .light .border-white\/20 {
            border-color: #cbd5e1 !important;
        }
        .light .bg-white\/5 {
            background-color: rgba(241, 245, 249, 0.8) !important;
        }
        .light .text-slate-400 {
            color: #64748b !important;
        }

</style>
</head>
<body class="min-h-screen flex flex-col p-6 max-w-7xl mx-auto space-y-6">

    <header class="flex justify-between items-center pb-4 border-b border-slate-300">
        <div>
            <h1 class="text-3xl font-black text-slate-900 tracking-tight">Risk Analysis</h1>
            <p class="text-sm text-slate-600">Global vendor risk distribution and critical alerts.</p>
        </div>
        <a href="dashboard.html" class="flex items-center gap-2 text-sm font-bold text-blue-600 hover:underline">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Back to Dashboard
        </a>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- KPI Cards -->
        <div class="glass-panel p-6 rounded-2xl flex flex-col justify-between">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">High Risk Vendors</h3>
            <p class="text-4xl font-black text-rose-600" id="kpi-high-risk">0</p>
        </div>
        <div class="glass-panel p-6 rounded-2xl flex flex-col justify-between">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Medium Risk Vendors</h3>
            <p class="text-4xl font-black text-amber-500" id="kpi-med-risk">0</p>
        </div>
        <div class="glass-panel p-6 rounded-2xl flex flex-col justify-between">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Low Risk Vendors</h3>
            <p class="text-4xl font-black text-emerald-500" id="kpi-low-risk">0</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Chart -->
        <div class="glass-panel p-6 rounded-2xl flex flex-col items-center">
            <h3 class="font-bold text-slate-800 mb-6 text-sm uppercase tracking-wider self-start">Risk Distribution</h3>
            <div class="w-full max-w-xs aspect-square">
                <canvas id="riskChart"></canvas>
            </div>
        </div>

        <!-- High Risk Alerts -->
        <div class="glass-panel p-6 rounded-2xl">
            <h3 class="font-bold text-slate-800 mb-6 text-sm uppercase tracking-wider">Critical Alerts Feed</h3>
            <div class="overflow-y-auto max-h-[300px] pr-2 space-y-3" id="alerts-container">
                <p class="text-sm text-slate-500">Loading alerts...</p>
            </div>
        </div>
    </div>

    <script>
        async function loadRiskData() {
            try {
                const res = await fetch('http://localhost:8000/api/vendors');
                const vendors = await res.json();
                
                let high = 0, med = 0, low = 0;
                const highRiskVendors = [];

                vendors.forEach(v => {
                    if (v.risk_level === 'High') { high++; highRiskVendors.push(v); }
                    else if (v.risk_level === 'Medium') med++;
                    else low++;
                });

                document.getElementById('kpi-high-risk').innerText = high;
                document.getElementById('kpi-med-risk').innerText = med;
                document.getElementById('kpi-low-risk').innerText = low;

                // Render Chart
                const ctx = document.getElementById('riskChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['High Risk', 'Medium Risk', 'Low Risk'],
                        datasets: [{
                            data: [high, med, low],
                            backgroundColor: ['#e11d48', '#f59e0b', '#10b981'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        cutout: '75%',
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });

                // Render Alerts
                const alertsContainer = document.getElementById('alerts-container');
                alertsContainer.innerHTML = '';
                if (highRiskVendors.length === 0) {
                    alertsContainer.innerHTML = `<p class="text-sm text-emerald-600 font-bold bg-emerald-50 p-3 rounded-lg border border-emerald-200">No critical alerts at this time.</p>`;
                } else {
                    highRiskVendors.forEach(v => {
                        alertsContainer.innerHTML += `
                            <div class="p-3 bg-rose-50 border border-rose-200 rounded-lg flex justify-between items-center">
                                <div>
                                    <h4 class="text-sm font-bold text-rose-900">${v.company_name}</h4>
                                    <p class="text-xs text-rose-700 mt-1">Quality Score: ${v.quality_score}% | Delivery: ${v.delivery_rate}%</p>
                                </div>
                                <span class="material-symbols-outlined text-rose-600">warning</span>
                            </div>
                        `;
                    });
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.addEventListener('DOMContentLoaded', loadRiskData);
    </script>
</body>
</html>
