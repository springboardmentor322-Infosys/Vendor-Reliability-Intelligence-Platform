<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vendor Management</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/vendors.css" />
  </head>

  <body>
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Navbar -->
      <div id="navbar"></div>

      <!-- Page -->
      <div class="page-content">
        <div class="page-header">
          <h2>Vendor Management</h2>

          <button id="addVendorBtn">+ Add Vendor</button>
        </div>

        <!-- Filters -->

        <div class="filters">
          <input type="text" id="searchVendor" placeholder="Search Vendor..." />

          <select id="statusFilter">
            <option value="">All Status</option>

            <option value="Pending">Pending</option>

            <option value="Under Review">Under Review</option>

            <option value="Approved">Approved</option>

            <option value="Rejected">Rejected</option>
          </select>
        </div>

        <!-- Vendor Table -->

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>

                <th>Vendor Name</th>

                <th>Category</th>

                <th>Email</th>

                <th>Phone</th>

                <th>Status</th>

                <th>Reliability</th>

                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="vendorTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- ===========================
       Add Vendor Modal
      =========================== -->

      <div class="modal" id="vendorModal">
        <div class="modal-content">
          <h2>Add Vendor</h2>

          <form id="vendorForm">
            <input
              type="text"
              id="vendorName"
              placeholder="Vendor Name"
              required
            />

            <input type="text" id="category" placeholder="Category" required />

            <input type="email" id="email" placeholder="Email" required />

            <input type="text" id="phone" placeholder="Phone" required />

            <textarea id="address" placeholder="Address"></textarea>

            <input
              type="number"
              id="reliability"
              placeholder="Reliability Score"
              value=""
            />

            <input
              type="number"
              id="compliance"
              placeholder="Compliance Score"
              value=""
            />

            <select id="status">
              <option value="Pending">Pending</option>

              <option value="Under Review">Under Review</option>

              <option value="Approved">Approved</option>

              <option value="Rejected">Rejected</option>
            </select>

            <div class="modal-buttons">
              <button type="submit">Save Vendor</button>

              <button type="button" id="closeModal">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Footer -->

      <div id="footer"></div>
    </div>

    <!-- Scripts -->

    <script src="js/api.js"></script>
    <script src="js/roleAccess.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>

    <script src="js/vendors.js"></script>

    <script>
      requirePermission("vendors");
    </script>
  </body>
</html>
