<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<title>VendorIQ | Vendor Management</title>

<link rel="stylesheet" href="css/style.css">

<style>

  .cat-chip-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .cat-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .cat-chip:hover {
    border-color: var(--accent);
  }

  .cat-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .cat-chip .count {
    font-family: monospace;
    opacity: 0.75;
  }

</style>

</head>


<body>

<div class="app-shell" id="app-shell"></div>


<script src="js/api.js"></script>


<script>

requireAuth();

renderShell("vendors.html", "Vendor Management");


/*
 * Vendor categories used in the filters
 */
const CATEGORIES = [
  "Raw Material Suppliers",
  "Equipment Vendors",
  "IT Vendors",
  "Service Providers",
  "Logistics Partners",
  "Maintenance Vendors"
];


let activeCategory = "";


/*
 * Get the logged-in user.
 *
 * Auditors should only be able to view vendors.
 */
const user = getUser();


/*
 * These roles are allowed to register new vendors.
 */
const canCreateVendor =
  user &&
  [
    "Administrator",
    "Procurement Manager",
    "Supply Chain Manager"
  ].includes(user.role);


/*
 * These roles can approve or reject vendors.
 */
const canReviewVendor =
  user &&
  [
    "Administrator",
    "Procurement Manager",
    "Supply Chain Manager"
  ].includes(user.role);



async function load() {

  const content =
    document.getElementById("page-content");


  /*
   * Build the page.
   *
   * The Register Vendor button is only shown
   * to users who have permission.
   */
  content.innerHTML = `

    <div
      class="cat-chip-row"
      id="cat-chips">
    </div>


    <div class="table-toolbar">

      <div>

        <select
          id="filter-status"
          onchange="load()">

          <option value="">
            All Statuses
          </option>

          <option>
            Pending Approval
          </option>

          <option>
            Approved
          </option>

          <option>
            Rejected
          </option>

          <option>
            Suspended
          </option>

        </select>

      </div>


      ${
        canCreateVendor
          ? `
            ${hasRole("Administrator", "Procurement Manager") ? `
  <button class="btn" onclick="openModal()">+ Register Vendor</button>
` : ""}
          `
          : ""
      }

    </div>


    <table>

      <thead>

        <tr>

          <th>Name</th>

          <th>Category</th>

          <th>Contact</th>

          <th>Status</th>

          <th>Reliability</th>

          <th>Risk</th>

          <th>Actions</th>

        </tr>

      </thead>


      <tbody id="vendor-rows">

        <tr>

          <td
            colspan="7"
            class="text-muted">

            Loading...

          </td>

        </tr>

      </tbody>

    </table>


    ${
      canCreateVendor
        ? `

        <div
          class="modal-backdrop hidden"
          id="modal">

          <div class="modal">

            <h3>
              Register New Vendor
            </h3>


            <div class="field">

              <label>
                Vendor Name
              </label>

              <input
                id="v-name"
                type="text">

            </div>


            <div class="field">

              <label>
                Category
              </label>

              <select id="v-category">

                ${CATEGORIES
                  .map(
                    category =>
                      `<option>${category}</option>`
                  )
                  .join("")}

              </select>

            </div>


            <div class="field">

              <label>
                Contact Person
              </label>

              <input
                id="v-contact"
                type="text">

            </div>


            <div class="field">

              <label>
                Email
              </label>

              <input
                id="v-email"
                type="email">

            </div>


            <div class="field">

              <label>
                Phone
              </label>

              <input
                id="v-phone"
                type="text">

            </div>


            <div class="field">

              <label>
                Address
              </label>

              <textarea
                id="v-address"
                rows="2">
              </textarea>

            </div>


            <div
              class="error-msg"
              id="v-error">
            </div>


            <div class="modal-actions">

              <button
                class="btn secondary"
                onclick="closeModal()">

                Cancel

              </button>


              <button
                class="btn"
                onclick="submitVendor()">

                Save

              </button>

            </div>

          </div>

        </div>

        `
        : ""
    }

  `;


  try {

    /*
     * Get all vendors first.
     *
     * This is used for the category counts.
     */
    const allVendors =
      await api("/vendors");


    const counts = {};


    CATEGORIES.forEach(category => {
      counts[category] = 0;
    });


    allVendors.forEach(vendor => {

      counts[vendor.category] =
        (counts[vendor.category] || 0) + 1;

    });


    /*
     * Display the category filter buttons.
     */
    const chipsEl =
      document.getElementById("cat-chips");


    chipsEl.innerHTML = `

      <div
        class="cat-chip ${
          activeCategory === ""
            ? "active"
            : ""
        }"
        onclick="setCategory('')">

        All Categories

        <span class="count">
          ${allVendors.length}
        </span>

      </div>


      ${CATEGORIES
        .map(
          category => `

            <div
              class="cat-chip ${
                activeCategory === category
                  ? "active"
                  : ""
              }"
              onclick="setCategory('${category}')">

              ${category}

              <span class="count">
                ${counts[category]}
              </span>

            </div>

          `
        )
        .join("")}

    `;


    /*
     * Build the filters for the vendor API.
     */
    const status =
      document.getElementById(
        "filter-status"
      ).value;


    const params =
      new URLSearchParams();


    if (status) {
      params.set("status", status);
    }


    if (activeCategory) {
      params.set(
        "category",
        activeCategory
      );
    }


    const query =
      params.toString()
        ? `?${params.toString()}`
        : "";


    /*
     * Get the vendors using the selected filters.
     */
    const vendors =
      await api(`/vendors${query}`);


    const rows =
      document.getElementById(
        "vendor-rows"
      );


    if (!vendors.length) {

      rows.innerHTML = `

        <tr>

          <td
            colspan="7"
            class="text-muted">

            No vendors found.

          </td>

        </tr>

      `;

      return;
    }


    /*
     * Show the vendors in the table.
     */
    rows.innerHTML = vendors
      .map(vendor => `

        <tr>

          <td>
            <strong>
              ${vendor.name}
            </strong>
          </td>


          <td>
            ${vendor.category}
          </td>


          <td>

            ${vendor.contact_person || "-"}

            <br>

            <span class="text-muted">
              ${vendor.email || ""}
            </span>

          </td>


          <td>
            ${statusBadge(vendor.status)}
          </td>


          <td>
            ${vendor.reliability_score}
          </td>


          <td>
            ${statusBadge(vendor.risk_level)}
          </td>


          <td>

            ${
              vendor.status === "Pending Approval" &&
              canReviewVendor

                ? `

                  <button
                    class="btn small success"
                    onclick="approve(${vendor.id})">

                    Approve

                  </button>


                  <button
                    class="btn small danger"
                    onclick="reject(${vendor.id})">

                    Reject

                  </button>

                `

                : `

                  <a
                    href="performance.html?vendor_id=${vendor.id}"
                    class="btn small secondary">

                    View

                  </a>

                `
            }

          </td>

        </tr>

      `)
      .join("");


  } catch (err) {

    console.error(
      "VENDOR LOAD ERROR:",
      err
    );


    const rows =
      document.getElementById(
        "vendor-rows"
      );


    if (rows) {

      rows.innerHTML = `

        <tr>

          <td
            colspan="7"
            class="error-msg">

            ${err.message}

          </td>

        </tr>

      `;

    }

  }

}


/*
 * Change the selected category.
 */
function setCategory(category) {

  activeCategory = category;

  load();

}


/*
 * Open the registration popup.
 *
 * Extra permission check is kept here
 * even though the button is already hidden.
 */
function openModal() {

  if (!canCreateVendor) {

    alert(
      "You do not have permission to register vendors."
    );

    return;
  }


  const modal =
    document.getElementById("modal");


  if (modal) {

    modal.classList.remove("hidden");

  }

}


/*
 * Close the registration popup.
 */
function closeModal() {

  const modal =
    document.getElementById("modal");


  if (modal) {

    modal.classList.add("hidden");

  }

}


/*
 * Send the new vendor to the backend.
 */
async function submitVendor() {

  if (!canCreateVendor) {

    alert(
      "You do not have permission to register vendors."
    );

    return;
  }


  const errorEl =
    document.getElementById("v-error");


  errorEl.textContent = "";


  try {

    await api(
      "/vendors",
      {
        method: "POST",

        body: {

          name:
            document.getElementById(
              "v-name"
            ).value,

          category:
            document.getElementById(
              "v-category"
            ).value,

          contact_person:
            document.getElementById(
              "v-contact"
            ).value,

          email:
            document.getElementById(
              "v-email"
            ).value,

          phone:
            document.getElementById(
              "v-phone"
            ).value,

          address:
            document.getElementById(
              "v-address"
            ).value

        }

      }
    );


    closeModal();

    await load();


  } catch (err) {

    errorEl.textContent =
      err.message;

  }

}


/*
 * Approve a pending vendor.
 */
async function approve(id) {

  if (!canReviewVendor) {

    alert(
      "You do not have permission to approve vendors."
    );

    return;
  }


  try {

    await api(
      `/vendors/${id}/approve`,
      {
        method: "POST"
      }
    );


    await load();


  } catch (err) {

    alert(err.message);

  }

}


/*
 * Reject a pending vendor.
 */
async function reject(id) {

  if (!canReviewVendor) {

    alert(
      "You do not have permission to reject vendors."
    );

    return;
  }


  try {

    await api(
      `/vendors/${id}/reject`,
      {
        method: "POST"
      }
    );


    await load();


  } catch (err) {

    alert(err.message);

  }

}


/* Start loading the page */
load();

</script>

</body>
</html>
