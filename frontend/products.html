<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Products</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/products.css" />
  </head>

  <body>
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="navbar"></div>

      <div class="page-content">
        <div class="page-header">
          <h2>Products</h2>

          <button id="addProductBtn">+ Add Product</button>
        </div>

        <div class="filters">
          <input type="text" id="searchProduct" placeholder="Search Product" />
        </div>

        <table>
          <thead>
            <tr>
              <th>ID</th>

              <th>Product</th>

              <th>Category</th>

              <th>Vendor</th>

              <th>Price</th>

              <th>Stock</th>

              <th>Lead Time</th>

              <th>Warranty</th>

              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="productTableBody"></tbody>
        </table>
      </div>

      <div id="footer"></div>
    </div>

    <div class="modal" id="productModal">
      <div class="modal-content">
        <h2 id="modalTitle">Add Product</h2>

        <div class="form-group">
          <label for="vendorId"> Vendor </label>

          <select id="vendorId">
            <option value="">Select Vendor</option>
          </select>
        </div>

        <input id="productName" type="text" placeholder="Product Name" />

        <input id="category" type="text" placeholder="Category" />

        <input id="price" type="number" placeholder="Unit Price" />

        <input id="stock" type="number" placeholder="Stock" />

        <input id="leadTime" type="number" placeholder="Lead Time (Days)" />

        <input id="warranty" type="number" placeholder="Warranty (Months)" />

        <div class="modal-buttons">
          <button id="saveProduct">Save</button>

          <button id="cancelProduct">Cancel</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <div id="confirmModal" class="confirm-modal">
      <div class="confirm-box">
        <h3>Confirmation</h3>

        <p id="confirmMessage"></p>

        <div class="confirm-buttons">
          <button id="confirmYes">Yes</button>

          <button id="confirmNo">Cancel</button>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/roleAccess.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>

    <script src="js/toast.js"></script>

    <script src="js/confirm.js"></script>

    <script src="js/products.js"></script>

    <script>
      requirePermission("products");
    </script>
  </body>
</html>
