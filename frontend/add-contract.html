<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Contract - VendorIQ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div style="margin-bottom: 24px;">
        <h1 style="font-size: 22px; font-weight: 700; margin-bottom: 6px;">Register New Contract</h1>
        <p style="color: var(--text-secondary);">Define SLA thresholds, dates, and assign contract status to an active vendor.</p>
    </div>

    <!-- Center Card -->
    <div style="max-width: 600px; margin: 0 auto;">
        <div class="form-container">
            <div class="form-title">Contract Agreement Details</div>
            
            <form id="contractForm">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="vendor_id">Supplier Partner</label>
                    <select id="vendor_id" required>
                        <option value="">Select Vendor</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="contract_name">Contract Reference Name</label>
                    <input type="text" id="contract_name" placeholder="e.g. FY26 Logistics SLA" required>
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="start_date">Start Effective Date</label>
                    <input type="date" id="start_date" required>
                </div>

                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="end_date">End Expiration Date</label>
                    <input type="date" id="end_date" required>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="status">Status</label>
                    <select id="status" required>
                        <option value="Active">Active</option>
                        <option value="Pending">Pending</option>
                        <option value="Expired">Expired</option>
                    </select>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='contracts.html'">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Contract</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/add-contract.js"></script>
</body>
</html>
