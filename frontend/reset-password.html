<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VendorIQ | Reset Password</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Reset Password</h1>
    <p class="sub" id="sub-text">Choose a new password for your account.</p>

    <form id="reset-form">
      <div class="field">
        <label>New Password</label>
        <input type="password" id="new_password" required minlength="6">
      </div>
      <div class="field">
        <label>Confirm New Password</label>
        <input type="password" id="confirm_password" required minlength="6">
      </div>
      <button type="submit" class="btn full">Reset Password</button>
      <div class="error-msg" id="error"></div>
    </form>

    <div class="hint-box hidden" id="success-box"></div>

    <p style="text-align:center; font-size:13px; margin-top:16px;">
      <a href="index.html" style="color:var(--accent); font-weight:600;">Back to Sign In</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

if (!token) {
  document.getElementById("sub-text").textContent = "This reset link is missing its token.";
  document.getElementById("reset-form").classList.add("hidden");
}

document.getElementById("reset-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("error");
  errorEl.textContent = "";

  const newPassword = document.getElementById("new_password").value;
  const confirmPassword = document.getElementById("confirm_password").value;

  if (newPassword !== confirmPassword) {
    errorEl.textContent = "Passwords don't match.";
    return;
  }

  try {
    const data = await api("/auth/reset-password", {
      method: "POST",
      body: { token, new_password: newPassword },
    });
    document.getElementById("reset-form").classList.add("hidden");
    const box = document.getElementById("success-box");
    box.classList.remove("hidden");
    box.innerHTML = `${data.detail} <br><br><a href="index.html" style="color:var(--accent); font-weight:600;">Go to Sign In →</a>`;
  } catch (err) {
    errorEl.textContent = err.message;
  }
});
</script>
</body>
</html>
