<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - VendorIQ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Reset Password</h2>
            <p class="subtitle">Set your new password</p>
            
            <form id="resetPasswordForm">
                <input type="hidden" id="token">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" placeholder="New Password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required minlength="6">
                </div>
                <button type="submit" style="margin-top: 10px;">Reset Password</button>
            </form>
            
            <div id="message" style="display: none; margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center;"></div>
            
            <div class="auth-footer">
                <p><a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
