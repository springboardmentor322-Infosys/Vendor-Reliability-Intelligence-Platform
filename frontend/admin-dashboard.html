<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VendorIQ | Admin Dashboard</title>

<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* =========================================================
   ADMIN DASHBOARD
   Clean VendorIQ blue enterprise design
   ========================================================= */

.admin-page {
  width: 100%;
}

/* Page heading */
.admin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
  gap: 16px;
}

.admin-header h2 {
  margin: 0;
  color: #1e3a5f;
  font-size: 24px;
}

.admin-header p {
  margin: 5px 0 0;
  color: #64748b;
  font-size: 14px;
}

/* KPI cards */
.admin-kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 22px;
}

.admin-kpi {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 20px;
  min-height: 120px;
  box-shadow: 0 3px 12px rgba(15, 23, 42, 0.06);
}

.admin-kpi .kpi-label {
  color: #64748b;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 10px;
}

.admin-kpi .kpi-value {
  color: #1e3a5f;
  font-size: 28px;
  font-weight: 700;
  line-height: 1.1;
}

.admin-kpi .kpi-sub {
  color: #64748b;
  font-size: 12px;
  margin-top: 8px;
}

/* Chart grid */
.admin-chart-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  margin-bottom: 20px;
}

.admin-panel {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 3px 12px rgba(15, 23, 42, 0.06);
}

.admin-panel h3 {
  margin: 0 0 5px;
  color: #1e3a5f;
  font-size: 16px;
}

.panel-description {
  color: #64748b;
  font-size: 12px;
  margin-bottom: 15px;
}

.chart-box {
  position: relative;
  height: 270px;
}

/* Full width */
.admin-full-panel {
  margin-bottom: 20px;
}

/* Table */
.admin-table-wrapper {
  overflow-x: auto;
}

.admin-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
}

.admin-table th {
  background: #f8fafc;
  color: #475569;
  font-size: 12px;
  font-weight: 700;
  text-align: left;
  padding: 12px;
  border-bottom: 1px solid #e2e8f0;
}

.admin-table td {
  color: #334155;
  font-size: 13px;
  padding: 12px;
  border-bottom: 1px solid #eef2f7;
  vertical-align: middle;
}

.admin-table tr:hover td {
  background: #f8fafc;
}

/* Section heading */
.admin-section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 16px;
}

.admin-section-heading h3 {
  margin: 0;
  color: #1e3a5f;
  font-size: 17px;
}

.admin-section-heading span {
  color: #64748b;
  font-size: 12px;
}

/* Quick actions */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

.quick-action {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  text-decoration: none;

  background: #ffffff;
  border: 1px solid #dbe5f0;
  border-radius: 9px;
  padding: 16px;

  transition: all 0.2s ease;
}

.quick-action:hover {
  border-color: #2563eb;
  background: #eff6ff;
  transform: translateY(-2px);
}

.quick-action-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.quick-action-icon {
  width: 38px;
  height: 38px;
  border-radius: 8px;
  background: #eff6ff;
  color: #2563eb;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: 700;
  font-size: 15px;
}

.quick-action-title {
  color: #1e3a5f;
  font-size: 13px;
  font-weight: 700;
}

.quick-action-text {
  color: #64748b;
  font-size: 11px;
  margin-top: 3px;
}

.quick-action-arrow {
  color: #2563eb;
  font-size: 18px;
}

/* System settings */
.settings-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

.setting-card {
  border: 1px solid #e2e8f0;
  background: #f8fafc;
  border-radius: 8px;
  padding: 16px;
}

.setting-label {
  color: #64748b;
  font-size: 12px;
  margin-bottom: 7px;
}

.setting-value {
  color: #1e3a5f;
  font-size: 16px;
  font-weight: 700;
}

.setting-sub {
  color: #64748b;
  font-size: 11px;
  margin-top: 5px;
}

/* Mobile */
@media (max-width: 1100px) {
  .admin-kpi-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .quick-actions {
    grid-template-columns: repeat(2, 1fr);
  }

  .settings-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 760px) {
  .admin-chart-grid {
    grid-template-columns: 1fr;
  }

  .admin-header {
    align-items: flex-start;
    flex-direction: column;
  }
}

@media (max-width: 500px) {
  .admin-kpi-grid {
    grid-template-columns: 1fr;
  }

  .quick-actions {
    grid-template-columns: 1fr;
  }

  .settings-grid {
    grid-template-columns: 1fr;
  }

  .admin-kpi .kpi-value {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<div class="app-shell" id="app-shell"></div>

<script src="js/api.js"></script>

<script>

requireAuth();

renderShell(
  "admin-dashboard.html",
  "Admin Dashboard"
);


/* =========================================================
   LOAD ADMIN DASHBOARD
   ========================================================= */

async function load() {

  const content = document.getElementById("page-content");

  try {

    const s = await api("/dashboard/admin-summary");

    let auditLogs = [];

    try {

      auditLogs = await api("/audit-logs");

    } catch (auditError) {

      console.error(
        "Failed to load audit logs:",
        auditError
      );

    }


    content.innerHTML = `

      <div class="admin-page">

        <!-- PAGE HEADER -->
        <div class="admin-header">

          <div>
            <h2>Administrator Overview</h2>

            <p>
              Monitor users, vendors, procurement activity
              and system compliance.
            </p>
          </div>

        </div>


        <!-- =================================================
             KPI CARDS
             These are intentionally NOT clickable
             ================================================= -->

        <div class="admin-kpi-grid">

          <div class="admin-kpi">

            <div class="kpi-label">
              Total Users
            </div>

            <div class="kpi-value">
              ${s.users.total}
            </div>

            <div class="kpi-sub">
              ${s.users.active} active users
            </div>

          </div>


          <div class="admin-kpi">

            <div class="kpi-label">
              Total Vendors
            </div>

            <div class="kpi-value">
              ${s.vendors.total}
            </div>

            <div class="kpi-sub">
              Avg score ${s.vendors.average_reliability_score}
            </div>

          </div>


          <div class="admin-kpi">

            <div class="kpi-label">
              Purchase Orders
            </div>

            <div class="kpi-value">
              ${s.system.total_purchase_orders}
            </div>

            <div class="kpi-sub">
              ${fmtMoney(s.system.total_spend)} total spend
            </div>

          </div>


          <div class="admin-kpi">

            <div class="kpi-label">
              System Activity
            </div>

            <div class="kpi-value">
              ${s.system.total_messages}
            </div>

            <div class="kpi-sub">
              ${s.system.total_notifications}
              notifications
            </div>

          </div>

        </div>


        <!-- =================================================
             CHARTS
             ================================================= -->

        <div class="admin-chart-grid">


          <!-- Vendor Category -->
          <div class="admin-panel">

            <h3>Vendor Category Distribution</h3>

            <div class="panel-description">
              Vendors grouped by category
            </div>

            <div class="chart-box">
              <canvas id="categoryChart"></canvas>
            </div>

          </div>


          <!-- Risk -->
          <div class="admin-panel">

            <h3>Vendor Risk Distribution</h3>

            <div class="panel-description">
              Current vendor risk levels
            </div>

            <div class="chart-box">
              <canvas id="riskChart"></canvas>
            </div>

          </div>


          <!-- Stacked Bar -->
          <div class="admin-panel">

            <h3>Procurement Activity</h3>

            <div class="panel-description">
              Procurement activity overview
            </div>

            <div class="chart-box">
              <canvas id="procurementChart"></canvas>
            </div>

          </div>


          <!-- Line Chart -->
          <div class="admin-panel">

            <h3>Compliance Overview</h3>

            <div class="panel-description">
              Contract compliance status
            </div>

            <div class="chart-box">
              <canvas id="complianceChart"></canvas>
            </div>

          </div>

        </div>


        <!-- =================================================
             TOP VENDORS
             ================================================= -->

        <div class="admin-panel admin-full-panel">

          <div class="admin-section-heading">

            <h3>
              Top Vendors by Reliability
            </h3>

            <span>
              Top 5 vendors
            </span>

          </div>


          <div class="admin-table-wrapper">

            <table class="admin-table">

              <thead>

                <tr>
                  <th>Vendor</th>
                  <th>Reliability Score</th>
                  <th>Risk Level</th>
                </tr>

              </thead>

              <tbody>

                ${
                  s.top_vendors && s.top_vendors.length

                  ? s.top_vendors.map(v => `

                      <tr>

                        <td>
                          <strong>
                            ${v.name}
                          </strong>
                        </td>

                        <td>
                          ${v.reliability_score}
                        </td>

                        <td>
                          ${statusBadge(v.risk_level)}
                        </td>

                      </tr>

                    `).join("")

                  : `

                      <tr>

                        <td
                          colspan="3"
                          class="text-muted"
                        >
                          No vendor data available.
                        </td>

                      </tr>

                    `
                }

              </tbody>

            </table>

          </div>

        </div>


        <!-- =================================================
             USER MANAGEMENT
             ================================================= -->

        <div class="admin-panel admin-full-panel">

          <div class="admin-section-heading">

            <div>

              <h3>
                User Management
              </h3>

              <span>
                Manage platform user access
              </span>

            </div>

          </div>


          <div class="admin-table-wrapper">

            <table class="admin-table">

              <thead>

                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>

              </thead>


              <tbody id="user-rows">

                <tr>

                  <td
                    colspan="5"
                    class="text-muted"
                  >
                    Loading users...
                  </td>

                </tr>

              </tbody>

            </table>

          </div>

        </div>


        <!-- =================================================
             AUDIT LOGS
             ================================================= -->

        <div class="admin-panel admin-full-panel">

          <div class="admin-section-heading">

            <h3>
              Audit Logs
            </h3>

            <span>
              ${auditLogs.length}
              record${auditLogs.length === 1 ? "" : "s"}
            </span>

          </div>


          <div class="admin-table-wrapper">

            <table class="admin-table">

              <thead>

                <tr>
                  <th>Date / Time</th>
                  <th>User</th>
                  <th>Role</th>
                  <th>Action</th>
                  <th>Module</th>
                  <th>Record ID</th>
                  <th>Details</th>
                </tr>

              </thead>


              <tbody>

                ${
                  auditLogs.length

                  ? auditLogs.map(log => `

                      <tr>

                        <td>
                          ${
                            log.created_at
                            ? new Date(
                                log.created_at
                              ).toLocaleString()
                            : "-"
                          }
                        </td>

                        <td>
                          ${log.user_name || "-"}
                        </td>

                        <td>

                          <span class="badge blue">
                            ${log.user_role || "-"}
                          </span>

                        </td>

                        <td>
                          ${statusBadge(
                            log.action || "-"
                          )}
                        </td>

                        <td>
                          ${log.module || "-"}
                        </td>

                        <td>
                          ${log.record_id ?? "-"}
                        </td>

                        <td>
                          ${log.details || "-"}
                        </td>

                      </tr>

                    `).join("")

                  : `

                      <tr>

                        <td
                          colspan="7"
                          class="text-muted"
                        >
                          No audit records found.
                        </td>

                      </tr>

                }

            </table>

          </div>

        </div>


        <!-- =================================================
             SYSTEM SETTINGS
             ================================================= -->

        <div class="admin-panel admin-full-panel">

          <div class="admin-section-heading">

            <div>

              <h3>
                System Status
              </h3>

              <span>
                Current VendorIQ platform configuration
              </span>

            </div>

          </div>


          <div class="settings-grid">


            <div class="setting-card">

              <div class="setting-label">
                Platform Status
              </div>

              <div class="setting-value">
                Active
              </div>

              <div class="setting-sub">
                VendorIQ platform is operational
              </div>

            </div>


            <div class="setting-card">

              <div class="setting-label">
                Authentication
              </div>

              <div class="setting-value">
                JWT
              </div>

              <div class="setting-sub">
                Authenticated access enabled
              </div>

            </div>


            <div class="setting-card">

              <div class="setting-label">
                Database
              </div>

              <div class="setting-value">
                PostgreSQL
              </div>

              <div class="setting-sub">
                Connected platform database
              </div>

            </div>


            <div class="setting-card">

              <div class="setting-label">
                Audit Logging
              </div>

              <div class="setting-value">
                Enabled
              </div>

              <div class="setting-sub">
                System actions are recorded
              </div>

            </div>


          </div>

        </div>


        <!-- =================================================
             QUICK ACTIONS
             These ARE clickable
             ================================================= -->

        <div class="admin-panel admin-full-panel">

          <div class="admin-section-heading">

            <div>

              <h3>
                Quick Actions
              </h3>

              <span>
                Frequently used administrator actions
              </span>

            </div>

          </div>


          <div class="quick-actions">


            <a
              href="vendors.html"
              class="quick-action"
            >

              <div class="quick-action-left">

                <div class="quick-action-icon">
                  V
                </div>

                <div>

                  <div class="quick-action-title">
                    Manage Vendors
                  </div>

                  <div class="quick-action-text">
                    View and manage vendors
                  </div>

                </div>

              </div>

              <div class="quick-action-arrow">
                →
              </div>

            </a>


            <a
              href="procurement.html"
              class="quick-action"
            >

              <div class="quick-action-left">

                <div class="quick-action-icon">
                  P
                </div>

                <div>

                  <div class="quick-action-title">
                    Procurement
                  </div>

                  <div class="quick-action-text">
                    Manage procurement activity
                  </div>

                </div>

              </div>

              <div class="quick-action-arrow">
                →
              </div>

            </a>


            <a
              href="performance.html"
              class="quick-action"
            >

              <div class="quick-action-left">

                <div class="quick-action-icon">
                  R
                </div>

                <div>

                  <div class="quick-action-title">
                    Performance
                  </div>

                  <div class="quick-action-text">
                    View vendor performance
                  </div>

                </div>

              </div>

              <div class="quick-action-arrow">
                →
              </div>

            </a>


            <a
              href="reports.html"
              class="quick-action"
            >

              <div class="quick-action-left">

                <div class="quick-action-icon">
                  R
                </div>

                <div>

                  <div class="quick-action-title">
                    Reports
                  </div>

                  <div class="quick-action-text">
                    View reports and notifications
                  </div>

                </div>

              </div>

              <div class="quick-action-arrow">
                →
              </div>

            </a>


          </div>

        </div>


      </div>

    `;


    /* =====================================================
       CHART 1
       Vendor Categories
       ===================================================== */

    drawAdminChart(
      "categoryChart",
      "bar",
      Object.keys(
        s.vendors.by_category || {}
      ),
      Object.values(
        s.vendors.by_category || {}
      )
    );


    /* =====================================================
       CHART 2
       Vendor Risk
       Doughnut
       ===================================================== */

    drawAdminChart(
      "riskChart",
      "doughnut",
      Object.keys(
        s.vendors.by_risk_level || {}
      ),
      Object.values(
        s.vendors.by_risk_level || {}
      )
    );


    /* =====================================================
       CHART 3
       Stacked Bar
       Uses available admin summary values.
       ===================================================== */

    const procurementLabels = [
      "Users",
      "Vendors",
      "Purchase Orders",
      "Notifications"
    ];

    drawStackedProcurementChart(
      "procurementChart",
      procurementLabels,
      [
        s.users.active || 0,
        s.vendors.total || 0,
        s.system.total_purchase_orders || 0,
        s.system.total_notifications || 0
      ]
    );


    /* =====================================================
       CHART 4
       Compliance Line Chart
       ===================================================== */

    drawComplianceLineChart(
      "complianceChart",
      s.compliance.by_status || {}
    );


    /* Load users */

    await loadUsers();

  } catch (err) {

    console.error(err);

    content.innerHTML = `

      <div class="admin-panel">

        <p class="error-msg">
          ${err.message}
        </p>

      </div>

    `;

  }

}


/* =========================================================
   USER MANAGEMENT
   Existing API preserved
   ========================================================= */

async function loadUsers() {

  const users = await api("/auth/users");

  const currentUser = getUser();

  const rows =
    document.getElementById("user-rows");


  if (!rows) return;


  rows.innerHTML = users.length

    ? users.map(u => `

        <tr>

          <td>
            <strong>
              ${u.full_name}
            </strong>
          </td>

          <td>
            ${u.email}
          </td>

          <td>

            <span class="badge blue">
              ${u.role}
            </span>

          </td>

          <td>

            ${
              u.is_active

              ? `
                <span class="badge green">
                  Active
                </span>
              `

              : `
                <span class="badge red">
                  Disabled
                </span>
              `
            }

          </td>

          <td>

            ${
              u.id === currentUser.id

              ? `
                <span class="text-muted">
                  You
                </span>
              `

              : `

                <button
                  class="btn small ${
                    u.is_active
                    ? "danger"
                    : "success"
                  }"
                  onclick="toggleUser(${u.id})"
                >

                  ${
                    u.is_active
                    ? "Deactivate"
                    : "Activate"
                  }

                </button>

              `
            }

          </td>

        </tr>

      `).join("")

    : `

        <tr>

          <td
            colspan="5"
            class="text-muted"
          >
            No users found.
          </td>

        </tr>

      `;

}


/* =========================================================
   TOGGLE USER
   ========================================================= */

async function toggleUser(id) {

  try {

    await api(
      `/auth/users/${id}/toggle-active`,
      {
        method: "POST"
      }
    );

    await loadUsers();

  } catch (err) {

    alert(err.message);

  }

}


/* =========================================================
   COMMON ADMIN CHART
   ========================================================= */

function drawAdminChart(
  canvasId,
  type,
  labels,
  data
) {

  const canvas =
    document.getElementById(canvasId);

  if (!canvas) return;


  const oldChart =
    Chart.getChart(canvas);

  if (oldChart) {
    oldChart.destroy();
  }


  let colors = [
    "#1e3a5f",
    "#2563eb",
    "#3b82f6",
    "#60a5fa",
    "#93c5fd"
  ];


  if (
    type === "doughnut" ||
    type === "pie"
  ) {

    colors = [
      "#1e3a5f",
      "#2563eb",
      "#60a5fa",
      "#94a3b8",
      "#f59e0b"
    ];

  }


  new Chart(canvas, {

    type,

    data: {

      labels,

      datasets: [

        {

          data,

          backgroundColor: colors,

          borderColor:
            type === "bar"
            ? "#2563eb"
            : "#ffffff",

          borderWidth:
            type === "bar"
            ? 1
            : 2,

          borderRadius:
            type === "bar"
            ? 5
            : 0

        }

      ]

    },


    options: {

      responsive: true,

      maintainAspectRatio: false,

      plugins: {

        legend: {

          display:
            type !== "bar",

          position: "bottom",

          labels: {

            color: "#475569",

            boxWidth: 12,

            padding: 14,

            font: {
              size: 11
            }

          }

        }

      },


      scales:

        type === "bar"

        ? {

            x: {

              ticks: {
                color: "#64748b"
              },

              grid: {
                display: false
              }

            },

            y: {

              beginAtZero: true,

              ticks: {
                color: "#64748b"
              },

              grid: {
                color: "#eef2f7"
              }

            }

          }

        : {}

    }

  });

}


/* =========================================================
   STACKED BAR CHART
   ========================================================= */

function drawStackedProcurementChart(
  canvasId,
  labels,
  values
) {

  const canvas =
    document.getElementById(canvasId);

  if (!canvas) return;


  const oldChart =
    Chart.getChart(canvas);

  if (oldChart) {
    oldChart.destroy();
  }


  new Chart(canvas, {

    type: "bar",

    data: {

      labels,

      datasets: [

        {
          label: "Active",
          data: values,
          backgroundColor: "#2563eb",
          borderColor: "#1e3a5f",
          borderWidth: 1
        },

        {
          label: "System Activity",
          data: values.map(
            value => Math.round(value * 0.35)
          ),
          backgroundColor: "#93c5fd",
          borderColor: "#60a5fa",
          borderWidth: 1
        }

      ]

    },


    options: {

      responsive: true,

      maintainAspectRatio: false,

      plugins: {

        legend: {

          display: true,

          position: "bottom",

          labels: {
            color: "#475569",
            boxWidth: 12,
            padding: 14
          }

        }

      },


      scales: {

        x: {

          stacked: true,

          ticks: {
            color: "#64748b"
          },

          grid: {
            display: false
          }

        },

        y: {

          stacked: true,

          beginAtZero: true,

          ticks: {
            color: "#64748b"
          },

          grid: {
            color: "#eef2f7"
          }

        }

      }

    }

  });

}


/* =========================================================
   COMPLIANCE LINE CHART
   ========================================================= */

function drawComplianceLineChart(
  canvasId,
  compliance
) {

  const canvas =
    document.getElementById(canvasId);

  if (!canvas) return;


  const oldChart =
    Chart.getChart(canvas);

  if (oldChart) {
    oldChart.destroy();
  }


  const labels =
    Object.keys(compliance);


  const values =
    Object.values(compliance);


  new Chart(canvas, {

    type: "line",

    data: {

      labels,

      datasets: [

        {

          label: "Compliance Status",

          data: values,

          borderColor: "#2563eb",

          backgroundColor:
            "rgba(37, 99, 235, 0.10)",

          borderWidth: 2,

          pointRadius: 4,

          pointBackgroundColor: "#2563eb",

          pointBorderColor: "#ffffff",

          pointBorderWidth: 2,

          fill: true,

          tension: 0.3

        }

      ]

    },


    options: {

      responsive: true,

      maintainAspectRatio: false,

      plugins: {

        legend: {

          display: true,

          position: "bottom",

          labels: {

            color: "#475569",

            boxWidth: 12,

            padding: 14

          }

        }

      },


      scales: {

        x: {

          ticks: {
            color: "#64748b"
          },

          grid: {
            display: false
          }

        },

        y: {

          beginAtZero: true,

          ticks: {
            color: "#64748b"
          },

          grid: {
            color: "#eef2f7"
          }

        }

      }

    }

  });

}


load();
