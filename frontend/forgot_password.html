<body class="bg-on-tertiary-fixed text-white font-sans min-h-screen flex items-center justify-center relative p-6">

    <div class="w-full max-w-md glass-panel p-8 sm:p-10 rounded-2xl border border-white/10 shadow-2xl relative">
        <header class="mb-6">
            <h2 class="text-2xl font-black text-white tracking-tight mb-1">Forgot Password</h2>
            <p class="text-xs text-tertiary-fixed-dim">Enter your corporate email to receive a reset link.</p>
        </header>

        <form action="#" class="space-y-4" method="POST" id="forgotForm" onsubmit="handleForgotSubmit(event)">
            <div class="space-y-1 group">
                <label class="font-mono-data text-[11px] font-bold text-tertiary-fixed-dim" for="email">Corporate Email</label>
                <div class="relative">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 material-symbols-outlined text-tertiary-fixed-dim text-[18px]">alternate_email</span>
                    <input class="w-full pl-10 pr-4 py-2.5 bg-white/5 border border-white/10 rounded-xl text-xs text-white placeholder:text-white/20 focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-400" id="email" name="email" required type="email"/>
                </div>
            </div>

            <div class="pt-2">
                <button class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3 px-6 rounded-xl text-xs font-bold uppercase tracking-widest hover:brightness-110 active:scale-[0.99] transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30" type="submit" id="submitBtn">
                    Send Reset Link
                </button>
            </div>
        </form>

        <div class="mt-4 text-center">
            <a href="login.html" class="text-xs text-blue-400 hover:underline">Back to Login</a>
        </div>
        
        <div id="resetLinkMessage" class="hidden mt-4 p-3 bg-emerald-500/20 text-emerald-400 text-xs rounded-xl border border-emerald-500/30 font-mono-data break-all">
        </div>
    </div>

<script>
    async function handleForgotSubmit(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = 'Sending...';

        try {
            const response = await fetch('http://127.0.0.1:8000/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });
            const data = await response.json();
            
            // Show the token/link for demo purposes
            const msgBox = document.getElementById('resetLinkMessage');
            msgBox.classList.remove('hidden');
            if (data.reset_token) {
                msgBox.innerHTML = `Demo link: <a href="reset_password.html?token=${data.reset_token}" class="underline hover:text-white">Click here to reset password</a>`;
            } else {
                msgBox.innerText = data.message;
            }
        } catch (err) {
            alert("Error sending reset link");
        } finally {
            btn.disabled = false;
            btn.innerText = 'Send Reset Link';
        }
    }
</script>

<script>
let lastNotifId = null;

function showToast(title, message, severity, type) {
    const toast = document.createElement('div');
    const borderClass = severity === 'Critical' ? 'border-rose-500' : 'border-blue-500';
    const iconClass = severity === 'Critical' ? 'text-rose-500' : 'text-blue-500';
    
    
    let onClickAttr = "";
    let cursorClass = "";
    if (type && type.startsWith("ChatMessage:")) {
        const parts = type.split(":");
        if(parts.length === 3 && typeof openChatModal === "function") {
            onClickAttr = `onclick="openChatModal('${parts[1]}', ${parts[2]})"`;
            cursorClass = "cursor-pointer hover:bg-slate-800/90 hover:scale-105";
        }
    }

    toast.className = `fixed bottom-4 right-4 max-w-sm w-full bg-slate-900/90 backdrop-blur-md shadow-2xl rounded-xl border-l-4 p-4 z-50 transform transition-all duration-300 translate-y-full opacity-0 ${borderClass} ${cursorClass}`;
    toast.innerHTML = `
        <div class="flex justify-between items-start" ${onClickAttr}>
            <div class="flex gap-3">
                <span class="material-symbols-outlined ${iconClass}">notifications_active</span>
                <div>
                    <h4 class="text-sm font-bold text-white">${title}</h4>
                    <p class="text-xs text-slate-300 mt-1">${message}</p>
                </div>
            </div>
            <button onclick="this.parentElement.parentElement.remove()" class="text-slate-400 hover:text-white"><span class="material-symbols-outlined text-sm">close</span></button>
        </div>
    `;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.classList.remove('translate-y-full', 'opacity-0');
    }, 100);
    
    setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-full');
        setTimeout(() => toast.remove(), 300);
    }, 5000);
}

async function fetchUnreadCount() {
    try {
        const token = localStorage.getItem('token') || localStorage.getItem('accessToken');
        if(!token) return;
        const res = await fetch('http://127.0.0.1:8000/api/intelligence/notifications', { headers: { 'Authorization': 'Bearer ' + token }});
        if(res.ok) {
            const notifs = await res.json();
            const unread = notifs.filter(n => !n.is_read).length;
            const badge = document.getElementById('global-notif-badge');
            if(badge && unread > 0) {
                badge.textContent = unread;
                badge.classList.remove('hidden');
            }
            
            if (notifs.length > 0) {
                const latestId = Math.max(...notifs.map(n => n.id));
                if (lastNotifId === null) {
                    lastNotifId = latestId; // Initialize on first fetch
                } else if (latestId > lastNotifId) {
                    const newNotifs = notifs.filter(n => n.id > lastNotifId);
                    newNotifs.forEach(n => showToast(n.title, n.message, n.severity, n.type));
                    lastNotifId = latestId;
                }
            }
        }
    } catch(e) {}
}
document.addEventListener('DOMContentLoaded', () => {
    fetchUnreadCount();
    setInterval(fetchUnreadCount, 10000);
});
</script>
