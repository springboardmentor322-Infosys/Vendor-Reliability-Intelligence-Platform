<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-container">

    <h2>Create Account</h2>

    <form id="registerForm">

        <label>Full Name</label>
        <input type="text" placeholder="Enter Full Name" placeholder="Enter Full Name">

        <label>Email</label>
        <input type="email" placeholder="Enter Email" placeholder="Enter Email">

        <label>Password</label>
        <input type="password" placeholder="Enter Password" placeholder="Enter Password">

        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm Password" placeholder="Confirm Password">

        <button type="submit">Register</button>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </form>

</div>

<script src="js/script.js"></script>

</body>
</html>
