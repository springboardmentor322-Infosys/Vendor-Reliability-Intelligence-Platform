<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VendorIQ | Register Enterprise Account</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1d4ed8;
            --accent: #8b5cf6;
            --bg-dark: #090d16;
            --bg-card: rgba(15, 23, 42, 0.75);
            --bg-card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        .bg-glow-1 {
            position: absolute;
            top: -150px;
            left: -100px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.25) 0%, rgba(9, 13, 22, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .register-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 1px solid var(--bg-card-border);
            padding: 40px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            font-weight: 800;
            margin: 0 auto 15px;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
        }

        .register-header h2 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .register-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: #cbd5e1;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .input-group input, .input-group select {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 13px 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
            margin-bottom: 0;
        }

        .input-group select option {
            background: #0f172a;
            color: #ffffff;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6);
        }

        .footer-link {
            text-align: center;
            margin-top: 25px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .footer-link a {
            color: #60a5fa;
            font-weight: 600;
            text-decoration: none;
        }

        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>

    <div class="register-container">
        <div class="register-header">
            <div class="logo-icon">V</div>
            <h2>Create Enterprise Account</h2>
            <p>Register to gain role-based access to the VendorIQ platform.</p>
        </div>

        <form id="registerForm">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="regFullName" placeholder="Enter Full Name" required>
            </div>

            <div class="form-grid-2">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="Username" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" placeholder="name@company.com" required>
                </div>
            </div>

            <div class="input-group">
                <label>Enterprise Role (Per Project Spec)</label>
                <select id="regRole" required>
                    <option value="Administrator">Administrator (System Control & Settings)</option>
                    <option value="Procurement Manager" selected>Procurement Manager (POs & Approvals)</option>
                    <option value="Supply Chain Manager">Supply Chain Manager (Logistics & Risk)</option>
                    <option value="Vendor">Vendor (My Company Orders & Contracts)</option>
                    <option value="Finance Officer">Finance Officer (Invoices & Spend)</option>
                    <option value="Auditor">Auditor (Compliance & Audit Trail)</option>
                </select>
            </div>

            <div class="form-grid-2">
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="••••••••" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">Create Account & Login →</button>

            <p class="footer-link">
                Already have an account?
                <a href="login.html">Sign In here</a>
            </p>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            
            const fullName = document.getElementById('regFullName').value;
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const role = document.getElementById('regRole').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            fetch("http://127.0.0.1:8000/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password,
                    full_name: fullName,
                    role: role
                })
            })
            .then(res => res.json())
            .then(data => {
                localStorage.setItem("authToken", data.access_token || "demo_token");
                localStorage.setItem("userRole", role);
                localStorage.setItem("userName", fullName);
                localStorage.setItem("userEmail", email);

                alert("Registration Successful! Redirecting to Dashboard...");
                window.location.href = "dashboard.html";
            })
            .catch(err => {
                localStorage.setItem("authToken", "demo_token");
                localStorage.setItem("userRole", role);
                localStorage.setItem("userName", fullName);
                localStorage.setItem("userEmail", email);

                alert("Account created successfully! Redirecting to Dashboard...");
                window.location.href = "dashboard.html";
            });
        });
    </script>
</body>
</html>
