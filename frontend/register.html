<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - VendorIQ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p class="subtitle">Join VendorIQ Platform</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <div class="form-group">
                    <label for="role">Requested Account Role</label>
                    <select id="role" name="role" required>
                        <option value="">Select Role</option>
                        <option value="Vendor">Vendor</option>
                        <option value="Procurement Manager">Procurement Manager</option>
                        <option value="Supply Chain Manager">Supply Chain Manager</option>
                        <option value="Finance Officer">Finance Officer</option>
                        <option value="Auditor">Auditor</option>
                    </select>
                </div>
                <button type="submit" style="margin-top: 10px;">Register</button>
            </form>
            
            <div class="auth-footer">
                <p><a href="login.html">Already have an account? Log In</a></p>
            </div>
        </div>
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
