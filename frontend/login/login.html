<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vendor Reliability Platform</title>
    <link rel="stylesheet" href="login_style.css">
</head>
<body>

    <div class="login-card">
        <a href="index.html" class="home">x</a>
            
        <div class="brand-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <h2>Sign In</h2>
        <p class="subtitle">Access your vendor risk management dashboard</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="role">Role</label>
                <div class="select-wrapper">
                    <select id="role" required>
                        <option value="" disabled selected hidden>Role</option>
                        <option value="admin">Admin</option>
                        <option value="procurement_manager">Procurement Manager</option>
                        <option value="finance_officer">Finance Officer</option>
                        <option value="supply_chain_manager">Supply Chain Manager</option>
                        <option value="vendor">Vendor</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="email">Username / Email</label>
                <input type="email" id="email" placeholder="name@company.com" required autocomplete="off">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="signup-link">
            New to the platform? <a href="new_user.html">Create an account</a>
        </div>
    </div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const role = document.getElementById('role').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!role) {
            alert("Please select a role!");
            return;
        }

        const payload = {
            email: email,
            password: password,
            role: role
        };

        try {
            const response = await fetch('http://127.0.0.1:8000/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                const userObj = data.user || data;
                
                // 1. Save user session details
                sessionStorage.setItem("user_id", userObj.id);
                sessionStorage.setItem("user_role", userObj.role);
                
                // 2. Capture and store the vendor/user's name
                const userName = userObj.fullname || userObj.username || email.split('@')[0];
                sessionStorage.setItem("vendor_name", userName);
                localStorage.setItem("vendor_name", userName);

                alert("Login Successful!");

                // 3. Redirect based on role
                const userRole = (userObj.role || '').toLowerCase();

                if (userRole === 'admin') {
                    window.location.href = "../dashboard/admin_dash.html";
                } else if (userRole === 'procurement_manager' || userRole === 'procurement manager') {
                    window.location.href = "../dashboard/manager_dash.html";
                } else if (userRole === 'finance_officer' || userRole === 'finance officer') {
                    window.location.href = "../dashboard/finance_dash.html";
                } else if (userRole === 'supply_chain_manager' || userRole === 'supply chain manager') {
                    window.location.href = "../dashboard/supply_dash.html";
                } else if (userRole === 'vendor') {
                    window.location.href = "../dashboard/vendor_dash.html";
                } else {
                    alert("Unrecognized role: " + userRole);
                }
            } else {
                alert(data.detail || "Login failed");
            }
        } catch (error) {
            alert("Cannot connect to server. Make sure FastAPI is running!");
        }
    });
</script>

</body>
</html>
