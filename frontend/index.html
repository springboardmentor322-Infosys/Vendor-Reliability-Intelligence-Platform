<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VendorIQ | Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>VendorIQ</h1>
    <p class="sub">Vendor Reliability Intelligence &amp; Procurement Risk Management</p>

    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@company.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn full">Sign In</button>
      <div class="error-msg" id="error"></div>
    </form>

    <p style="text-align:center; font-size:13px; margin-top:10px;">
      <a href="forgot-password.html" style="color:var(--accent); font-weight:600;">Forgot password?</a>
    </p>

    <p style="text-align:center; font-size:13px; margin-top:6px;">
      No account? <a href="register.html" style="color:var(--accent); font-weight:600;">Register here</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>

<script>
document.getElementById("login-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const errorEl = document.getElementById("error");
    errorEl.textContent = "";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const formData = new URLSearchParams();

        formData.append("username", email);
        formData.append("password", password);

        const response = await fetch("http://localhost:8000/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail
                    ? (typeof data.detail === "string"
                        ? data.detail
                        : JSON.stringify(data.detail))
                    : "Login failed"
            );
        }

        setSession(data.access_token, data.user);

        window.location.href = landingPageForRole(data.user.role);

    } catch (err) {
        console.error("LOGIN ERROR:", err);
        errorEl.textContent = err.message;
    }
});
</script>
</body>
</html>
