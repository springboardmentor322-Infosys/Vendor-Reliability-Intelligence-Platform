<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VendorIQ | Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <h1>VendorIQ</h1>
    <p class="sub">Vendor Reliability Intelligence &amp; Procurement Risk Management</p>

    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required placeholder="you@company.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn full">Sign In</button>
      <div class="error-msg" id="error"></div>
    </form>

    <p style="text-align:center; font-size:13px; margin-top:10px;">
      <a href="forgot-password.html" style="color:var(--accent); font-weight:600;">Forgot password?</a>
    </p>

    <p style="text-align:center; font-size:13px; margin-top:6px;">
      No account? <a href="register.html" style="color:var(--accent); font-weight:600;">Register here</a>
    </p>

    <div class="hint-box">
      <strong>Demo credentials</strong> (run <code>python seed.py</code> first):<br>
      admin@vendoriq.com / Admin@123<br>
      procurement@vendoriq.com / Proc@123<br>
      supplychain@vendoriq.com / Supply@123
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("error");
  errorEl.textContent = "";
  try {
    const data = await api("/auth/login", {
      method: "POST",
      body: {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      },
    });
    setSession(data.access_token, data.user);
    window.location.href = landingPageForRole(data.user.role);
  } catch (err) {
    errorEl.textContent = err.message;
  }
});
</script>
</body>
</html>
