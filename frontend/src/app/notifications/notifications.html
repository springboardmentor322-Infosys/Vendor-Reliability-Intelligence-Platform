<div class="notifications-page">

  <div class="page-heading">
    <div>
      <h2>Notifications</h2>
      <p>View the latest vendor and procurement alerts.</p>
    </div>

    <button class="refresh-btn">
      ↻ Refresh Notifications
    </button>
  </div>

  <section class="notification-panel">

    <div class="panel-header">
      <div>
        <h3>Recent Notifications</h3>
        <p>Latest system and procurement updates.</p>
      </div>

      <span class="notification-count">
        {{ notifications.length }} Notifications
      </span>
    </div>

    <div class="notification-list">

      <div class="notification-row" *ngFor="let notification of notifications">

        <div class="notification-icon">
          !
        </div>

       <div class="notification-content">
  <strong>{{ notification.notification_type }}</strong>
  <p>{{ notification.message }}</p>
</div>

        <span class="notification-status">
          {{ notification.status }}
        </span>

      </div>

      <div class="empty-state" *ngIf="notifications.length === 0">
        No notifications available.
      </div>

    </div>

  </section>

</div>
