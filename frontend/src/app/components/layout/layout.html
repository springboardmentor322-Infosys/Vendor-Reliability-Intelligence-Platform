<div class="app-layout">

  <aside class="sidebar">

    <div class="sidebar-header">
      <div class="logo">
        VR
      </div>

      <div>
        <h2>Vendor Reliability</h2>
        <span>Procurement Platform</span>
      </div>
    </div>


    <nav class="navigation">

      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">

        <span class="nav-icon">D</span>
        <span>Dashboard</span>

      </a>


      <a
        routerLink="/vendors"
        routerLinkActive="active">

        <span class="nav-icon">V</span>
        <span>Vendors</span>

      </a>


      <a
        routerLink="/procurement"
        routerLinkActive="active">

        <span class="nav-icon">P</span>
        <span>Procurement</span>

      </a>


      <a
        routerLink="/purchase-orders"
        routerLinkActive="active">

        <span class="nav-icon">O</span>
        <span>Purchase Orders</span>

      </a>


      <a
        routerLink="/reports"
        routerLinkActive="active">

        <span class="nav-icon">R</span>
        <span>Reports</span>

      </a>


      <a
        routerLink="/analytics"
        routerLinkActive="active">

        <span class="nav-icon">A</span>
        <span>Analytics</span>

      </a>


      <a
        routerLink="/notifications"
        routerLinkActive="active">

        <span class="nav-icon">N</span>
        <span>Notifications</span>

      </a>


      <a
        routerLink="/audit-logs"
        routerLinkActive="active">

        <span class="nav-icon">L</span>
        <span>Audit Logs</span>

      </a>

    </nav>


    <div class="sidebar-footer">

      <a
        routerLink="/login"
        class="logout-link">

        <span class="nav-icon">↪</span>
        <span>Logout</span>

      </a>

    </div>

  </aside>


  <main class="main-content">

    <header class="topbar">

      <div>
        <span class="topbar-label">
          VENDOR RELIABILITY INTELLIGENCE
        </span>
      </div>

    </header>


    <section class="page-content">

      <router-outlet></router-outlet>

    </section>

  </main>

</div>
