
<div class="charts">

  <!-- Row 1 -->
  <div class="chart-card">
    <h2>Vendor Risk Distribution</h2>
    <div class="canvas-container">
      <canvas id="riskChart"></canvas>
    </div>
  </div>

  <div class="chart-card">
    <h2>Order Status</h2>
    <div class="canvas-container">
      <canvas id="orderStatusChart"></canvas>
    </div>
  </div>

  <!-- Row 2 -->
  <div class="chart-card">
    <h2>Orders by Supplier</h2>
    <div class="canvas-container large-chart">
      <canvas id="supplierChart"></canvas>
    </div>
  </div>

  <div class="chart-card">
    <h2>Orders by Category</h2>
    <div class="canvas-container large-chart">
      <canvas id="categoryChart"></canvas>
    </div>
  </div>

  <!-- Row 3 -->
  <div class="chart-card">
    <h2>Compliance</h2>
    <div class="canvas-container">
      <canvas id="complianceChart"></canvas>
    </div>
  </div>

  <div class="chart-card">
    <h2>Defective Units by Supplier</h2>
    <div class="canvas-container large-chart">
      <canvas id="defectiveChart"></canvas>
    </div>
  </div>

</div>

<!-- Navigation Buttons -->

<button
  class="purchase-order-button"
  (click)="goToPurchaseOrders()">
  View Purchase Orders
</button>
