<div class="container">


<h1>
  Edit Vendor Performance
</h1>


<p>
  Update performance record
</p>



<div class="form-card">


<form (ngSubmit)="updatePerformance()">



<label>
Vendor Name
</label>

<input

type="text"

name="vendor_name"

[(ngModel)]="performance.vendor_name"

readonly

>





<label>
Delivery Score
</label>

<input

type="number"

name="delivery_score"

[(ngModel)]="performance.delivery_score"

(min)="0"

(max)="100"

(ngModelChange)="calculateScore()"

>







<label>
Quality Score
</label>

<input

type="number"

name="quality_score"

[(ngModel)]="performance.quality_score"

(min)="0"

(max)="100"

(ngModelChange)="calculateScore()"

>







<label>
Reliability Score
</label>

<input

type="number"

name="reliability_score"

[(ngModel)]="performance.reliability_score"

(min)="0"

(max)="100"

(ngModelChange)="calculateScore()"

>







<label>
Overall Score
</label>

<input

type="number"

name="overall_score"

[(ngModel)]="performance.overall_score"

readonly

>







<button type="submit">

Update Performance

</button>



</form>


</div>


</div>
