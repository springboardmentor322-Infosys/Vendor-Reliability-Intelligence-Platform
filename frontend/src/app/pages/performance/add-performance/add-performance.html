<div class="container">

  <h1>
    Add Vendor Performance
  </h1>


  <div class="form-card">


    <label>
      Vendor Name
    </label>

    <input
      type="text"
      name="vendor_name"
      [(ngModel)]="performance.vendor_name"
      placeholder="Enter vendor name"
      required
    >



    <label>
      Delivery Score
    </label>

    <input
      type="number"
      name="delivery_score"
      [(ngModel)]="performance.delivery_score"
      min="0"
      max="100"
      (ngModelChange)="calculateScore()"
      required
    >



    <label>
      Quality Score
    </label>

    <input
      type="number"
      name="quality_score"
      [(ngModel)]="performance.quality_score"
      min="0"
      max="100"
      (ngModelChange)="calculateScore()"
      required
    >



    <label>
      Reliability Score
    </label>

    <input
      type="number"
      name="reliability_score"
      [(ngModel)]="performance.reliability_score"
      min="0"
      max="100"
      (ngModelChange)="calculateScore()"
      required
    >



    <label>On-Time Deliveries</label>
    <input type="number" name="on_time_deliveries" [(ngModel)]="performance.on_time_deliveries" min="0">

    <label>Delayed Deliveries</label>
    <input type="number" name="delayed_deliveries" [(ngModel)]="performance.delayed_deliveries" min="0">

    <label>Response Time (hours)</label>
    <input type="number" name="response_time_hours" [(ngModel)]="performance.response_time_hours" min="0">

    <label>Issue Resolution Time (hours)</label>
    <input type="number" name="issue_resolution_time_hours" [(ngModel)]="performance.issue_resolution_time_hours" min="0">

    <label>Service Rating (0-100)</label>
    <input type="number" name="service_rating" [(ngModel)]="performance.service_rating" min="0" max="100">

    <label>Order Completion Rate (0-100)</label>
    <input type="number" name="order_completion_rate" [(ngModel)]="performance.order_completion_rate" min="0" max="100">

    <label>Performance Period</label>
    <input type="text" name="performance_period" [(ngModel)]="performance.performance_period">

    <label>
      Overall Score
    </label>

    <input
      type="number"
      name="overall_score"
      [(ngModel)]="performance.overall_score"
      readonly
    >



    <button
      (click)="addPerformance()">

      Add Performance

    </button>


  </div>


</div>
