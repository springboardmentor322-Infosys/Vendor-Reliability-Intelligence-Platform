<div class="container">

  <h2>Edit Vendor</h2>

  <form (ngSubmit)="updateVendor()">

    <div class="form-group">
      <label>Vendor Name</label>
      <input
        type="text"
        [(ngModel)]="vendor.vendor_name"
        name="vendor_name"
        required>
    </div>

    <div class="form-group">
      <label>Vendor Category</label>
      <select
        [(ngModel)]="vendor.category"
        name="category"
        required>
        <option value="" disabled>Select Vendor Category</option>
        <option value="Raw Material Suppliers">Raw Material Suppliers</option>
        <option value="Equipment Vendors">Equipment Vendors</option>
        <option value="IT Vendors">IT Vendors</option>
        <option value="Service Providers">Service Providers</option>
        <option value="Logistics Partners">Logistics Partners</option>
        <option value="Maintenance Vendors">Maintenance Vendors</option>
      </select>
    </div>

    <div class="form-group">
      <label>Contact Person</label>
      <input
        type="text"
        [(ngModel)]="vendor.contact_person"
        name="contact_person"
        required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        [(ngModel)]="vendor.email"
        name="email"
        required>
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input
        type="text"
        [(ngModel)]="vendor.phone"
        name="phone"
        required>
    </div>

    <div class="form-group">
      <label>Address</label>
      <textarea
        [(ngModel)]="vendor.address"
        name="address"
        rows="3">
      </textarea>
    </div>

    <div class="form-group">
      <label>Status</label>

      <select
        [(ngModel)]="vendor.status"
        name="status">

        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>

      </select>

    </div>

    <button class="save-btn" type="submit">
      Update Vendor
    </button>

  </form>

</div>
