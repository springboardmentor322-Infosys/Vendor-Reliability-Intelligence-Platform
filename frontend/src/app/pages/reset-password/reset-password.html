<div class="container">

  <div class="reset-card">

    <h1>
      VendorIQ
    </h1>

    <p>
      Create a new password
    </p>


    <label>
      Reset Token
    </label>

    <input
      type="text"
      placeholder="Enter reset token"
      [(ngModel)]="token">


    <label>
      New Password
    </label>

    <input
      type="password"
      placeholder="Enter new password"
      [(ngModel)]="newPassword">


    <label>
      Confirm Password
    </label>

    <input
      type="password"
      placeholder="Confirm new password"
      [(ngModel)]="confirmPassword">


    @if (errorMessage) {

      <div class="error-message">

        {{ errorMessage }}

      </div>

    }


    @if (message) {

      <div class="success-message">

        {{ message }}

      </div>

    }


    <button
      type="button"
      [disabled]="loading"
      (click)="resetPassword()">

      {{ loading
        ? 'Resetting...'
        : 'Reset Password'
      }}

    </button>


    <div class="back-link">

      <button
        type="button"
        (click)="backToLogin()">

        ← Back to Login

      </button>

    </div>

  </div>

</div>
