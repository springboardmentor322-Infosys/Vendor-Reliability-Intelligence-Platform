<div class="page"><div class="header"><h1>Invoice Management</h1><p>Track invoices, payment status and finance activity.</p></div><mat-card><table mat-table [dataSource]="invoices" class="full"><ng-container matColumnDef="invoice"><th mat-header-cell *matHeaderCellDef>Invoice</th><td mat-cell *matCellDef="let i">{{i.invoice_number}}</td></ng-container><ng-container matColumnDef="vendor"><th mat-header-cell *matHeaderCellDef>Vendor</th><td mat-cell *matCellDef="let i">{{i.vendor_name}}</td></ng-container><ng-container matColumnDef="amount"><th mat-header-cell *matHeaderCellDef>Amount</th><td mat-cell *matCellDef="let i">₹{{i.amount}}</td></ng-container><ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Status</th><td mat-cell *matCellDef="let i"><span class="status">{{i.status}}</span></td></ng-container><ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Actions</th><td mat-cell *matCellDef="let i"><button mat-button (click)="update(i.id,'Paid')">Mark Paid</button><button mat-button (click)="update(i.id,'Approved')">Approve</button></td></ng-container><tr mat-header-row *matHeaderRowDef="['invoice','vendor','amount','status','actions']"></tr><tr mat-row *matRowDef="let row;columns:['invoice','vendor','amount','status','actions']"></tr></table><p *ngIf="!invoices.length">No invoices yet.</p></mat-card></div>
