<div class="form-container">

    <h2>
        {{ orderId !== null
            ? 'Edit Order'
            : 'Add Order'
        }}
    </h2>


    <!-- ================================ -->
    <!-- VENDOR -->
    <!-- ================================ -->

    <label>
        Vendor
    </label>

    <select
        [(ngModel)]="vendor_id">

        <option
            [ngValue]="null">

            Select Vendor

        </option>


        <option
            *ngFor="let vendor of vendors"
            [ngValue]="vendor.id">

            {{ vendor.vendor_name }}

        </option>

    </select>


    <!-- ================================ -->
    <!-- PRODUCT -->
    <!-- ================================ -->

    <label>
        Product Name
    </label>

    <input
        type="text"
        placeholder="Product Name"
        [(ngModel)]="product_name">


    <!-- ================================ -->
    <!-- QUANTITY -->
    <!-- ================================ -->

    <label>
        Quantity
    </label>

    <input
        type="number"
        min="1"
        [(ngModel)]="quantity">


    <!-- ================================ -->
    <!-- AMOUNT -->
    <!-- ================================ -->

    <label>
        Amount
    </label>

    <input
        type="number"
        min="0"
        placeholder="Amount"
        [(ngModel)]="amount">


    <!-- ================================ -->
    <!-- EXPECTED DELIVERY DATE -->
    <!-- ================================ -->

    <label>
        Expected Delivery Date
    </label>

    <input
        type="date"
        [(ngModel)]="expected_delivery_date">


    <!-- ================================ -->
    <!-- STATUS -->
    <!-- ================================ -->

    <label>
        Status
    </label>

    <select
        [(ngModel)]="status">

        <option value="Pending">
            Pending
        </option>

        <option value="Approved">
            Approved
        </option>

        <option value="Ordered">
            Ordered
        </option>

        <option value="Delivered">
            Delivered
        </option>

        <option value="Completed">
            Completed
        </option>

        <option value="Cancelled">
            Cancelled
        </option>

    </select>


    <!-- ================================ -->
    <!-- BUTTONS -->
    <!-- ================================ -->

    <div class="buttons">

        <button
            type="button"
            class="cancel"
            (click)="cancel()">

            Cancel

        </button>


        <button
            type="button"
            class="save"
            (click)="saveOrder()">

            {{ orderId !== null
                ? 'Update Order'
                : 'Save Order'
            }}

        </button>

    </div>

</div>
