<div class="container">

  <div class="forgot-card">

    <h1>
      VendorIQ
    </h1>

    <p>
      Reset your password
    </p>


    <label>
      Email
    </label>

    <input
      type="email"
      placeholder="Enter your email"
      [(ngModel)]="email">


    @if (errorMessage) {

      <div class="error-message">

        {{ errorMessage }}

      </div>

    }


    @if (message) {

      <div class="success-message">

        {{ message }}

      </div>

    }


    <button
      type="button"
      [disabled]="loading"
      (click)="forgotPassword()">

      {{ loading
        ? 'Processing...'
        : 'Send Reset Request'
      }}

    </button>


    <div class="back-link">

      <button
        type="button"
        (click)="backToLogin()">

        ← Back to Login

      </button>

    </div>

  </div>

</div>
