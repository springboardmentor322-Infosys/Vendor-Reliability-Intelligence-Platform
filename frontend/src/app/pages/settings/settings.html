<div class="settings-page">


    <!-- ============================= -->
    <!-- HEADER -->
    <!-- ============================= -->

    <div class="settings-header">

        <h1>
            Settings
        </h1>

        <p>
            Manage your VendorIQ account and preferences
        </p>

    </div>


    <!-- ============================= -->
    <!-- PROFILE SETTINGS -->
    <!-- ============================= -->

    <section class="settings-card">

        <div class="card-header">

            <div class="card-icon">
                👤
            </div>

            <div>

                <h2>
                    Profile Settings
                </h2>

                <p>
                    Manage your personal information
                </p>

            </div>

        </div>


        <div class="form-grid">

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    [(ngModel)]="name"
                    placeholder="Enter your name">

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    [(ngModel)]="email"
                    placeholder="Enter your email">

            </div>

        </div>


        <button
            class="primary-btn"
            type="button"
            (click)="saveProfile()">

            Save Profile

        </button>

    </section>


    <!-- ============================= -->
    <!-- SECURITY -->
    <!-- ============================= -->

    <section class="settings-card">

        <div class="card-header">

            <div class="card-icon">
                🔐
            </div>

            <div>

                <h2>
                    Security
                </h2>

                <p>
                    Change your account password
                </p>

            </div>

        </div>


        <div class="form-grid">

            <div class="form-group">

                <label>
                    Current Password
                </label>

                <input
                    type="password"
                    [(ngModel)]="currentPassword"
                    placeholder="Current password">

            </div>


            <div class="form-group">

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    [(ngModel)]="newPassword"
                    placeholder="New password">

            </div>


            <div class="form-group">

                <label>
                    Confirm New Password
                </label>

                <input
                    type="password"
                    [(ngModel)]="confirmPassword"
                    placeholder="Confirm new password">

            </div>

        </div>


        <button
            class="primary-btn"
            type="button"
            (click)="changePassword()">

            Change Password

        </button>

    </section>


    <!-- ============================= -->
    <!-- NOTIFICATIONS -->
    <!-- ============================= -->

    <section class="settings-card">

        <div class="setting-row">

            <div class="setting-info">

                <div class="card-icon">
                    🔔
                </div>

                <div>

                    <h2>
                        Notifications
                    </h2>

                    <p>
                        Receive application notifications
                    </p>

                </div>

            </div>


            <label class="switch">

                <input
                    type="checkbox"
                    [checked]="notificationsEnabled"
                    (change)="toggleNotifications()">

                <span class="slider"></span>

            </label>

        </div>

    </section>


    <!-- ============================= -->
    <!-- ACCOUNT -->
    <!-- ============================= -->

    <section class="settings-card danger-card">

        <div class="setting-row">

            <div class="setting-info">

                <div class="card-icon danger-icon">
                    🚪
                </div>

                <div>

                    <h2>
                        Account
                    </h2>

                    <p>
                        Sign out of your VendorIQ account
                    </p>

                </div>

            </div>


            <button
                type="button"
                class="logout-btn"
                (click)="logout()">

                Logout

            </button>

        </div>

    </section>

</div>
