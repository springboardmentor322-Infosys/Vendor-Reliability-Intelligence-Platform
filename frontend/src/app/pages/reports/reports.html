<div class="page"><div class="header"><div><h1>Reports & Export</h1><p>Generate vendor, procurement, purchase-order, compliance and contract reports.</p></div></div><div class="grid"><mat-card *ngFor="let r of reports"><mat-icon>assessment</mat-icon><h2>{{r.name}}</h2><p>Export this report in the required formats.</p><div class="actions"><button mat-raised-button color="primary" (click)="export(r.key,'pdf')">PDF</button><button mat-stroked-button (click)="export(r.key,'xlsx')">Excel</button><button mat-stroked-button (click)="export(r.key,'csv')">CSV</button></div></mat-card></div></div>
