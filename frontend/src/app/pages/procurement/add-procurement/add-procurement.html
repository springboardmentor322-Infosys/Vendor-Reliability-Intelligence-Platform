<div class="container">

  <div class="header">
    <h2>Add Procurement Request</h2>
  </div>


  <form (ngSubmit)="addProcurement()">

    <label>Product Name</label>
    <input 
      type="text"
      [(ngModel)]="procurement.product_name"
      name="product_name"
      required>


    <label>Quantity</label>
    <input 
      type="number"
      [(ngModel)]="procurement.quantity"
      name="quantity"
      required>


    <label>Department</label>
    <input 
      type="text"
      [(ngModel)]="procurement.department"
      name="department"
      required>


    <label>Requested By</label>
    <input 
      type="text"
      [(ngModel)]="procurement.requested_by"
      name="requested_by"
      required>


    <label>Priority</label>
    <select
      [(ngModel)]="procurement.priority"
      name="priority">

      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>

    </select>


    <label>Status</label>
    <select
      [(ngModel)]="procurement.status"
      name="status">

      <option value="Pending">Pending</option>
      <option value="Approved">Approved</option>

    </select>


    <button type="submit">
      Save Request
    </button>

  </form>

</div>
