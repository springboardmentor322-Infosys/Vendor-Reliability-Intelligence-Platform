<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>VRIP</mat-card-title>
      <mat-card-subtitle>Vendor Reliability Intelligence Platform</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <h2>Create Account</h2>
      <p class="subtitle">Register to continue</p>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Full Name</mat-label>
        <input matInput [(ngModel)]="name" name="name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email Address</mat-label>
        <input matInput type="email" [(ngModel)]="email" name="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Role</mat-label>
        <mat-select [(ngModel)]="role" name="role">
          @for (r of roles; track r) {
            <mat-option [value]="r">{{ r }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="password" name="password" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirm Password</mat-label>
        <input matInput type="password" [(ngModel)]="confirmPassword" name="confirmPassword" />
      </mat-form-field>

      <button mat-raised-button color="primary" class="full-width" (click)="register()">
        Create Account
      </button>

      <p class="footer-text">
        Already have an account?
        <a routerLink="/login">Login</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
