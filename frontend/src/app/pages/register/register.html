<div class="register-page">

    <div class="register-card">

        <div class="register-header">

            <h1>
                VendorIQ
            </h1>

            <p>
                Create your account
            </p>

        </div>


        <!-- ERROR -->

        @if (errorMessage) {

            <div class="error-message">

                {{ errorMessage }}

            </div>

        }


        <!-- SUCCESS -->

        @if (successMessage) {

            <div class="success-message">

                {{ successMessage }}

            </div>

        }


        <!-- FULL NAME -->

        <label>
            Full Name
        </label>

        <input
            type="text"
            placeholder="Enter your full name"
            [(ngModel)]="full_name"
        >


        <!-- EMAIL -->

        <label>
            Email
        </label>

        <input
            type="email"
            placeholder="Enter your email"
            [(ngModel)]="email"
        >


        <!-- ROLE -->

        <label>
            Role
        </label>

        <select
            [(ngModel)]="role">

            <option value="Vendor">
                Vendor
            </option>

            <option value="Procurement Manager">
                Procurement Manager
            </option>

            <option value="Supply Chain Manager">
                Supply Chain Manager
            </option>

            <option value="Finance Officer">
                Finance Officer
            </option>

            <option value="Auditor">
                Auditor
            </option>

        </select>


        <!-- PASSWORD -->

        <label>
            Password
        </label>

        <input
            type="password"
            placeholder="Minimum 8 characters"
            [(ngModel)]="password"
        >


        <!-- CONFIRM PASSWORD -->

        <label>
            Confirm Password
        </label>

        <input
            type="password"
            placeholder="Confirm your password"
            [(ngModel)]="confirmPassword"
        >


        <!-- REGISTER -->

        <button
            type="button"
            [disabled]="loading"
            (click)="register()">

            {{ loading
                ? 'Creating Account...'
                : 'Create Account'
            }}

        </button>


        <!-- LOGIN -->

        <div class="login-link">

            Already have an account?

            <button
                type="button"
                (click)="goToLogin()">

                Login

            </button>

        </div>

    </div>

</div>
