<div class="container">

  <div class="login-card">

    <h1>VendorIQ</h1>

    <p>Vendor Management System</p>

    <label>Email</label>

    <input
      type="email"
      placeholder="Enter Email"
      [(ngModel)]="email">

    <label>Password</label>

    <input
      type="password"
      placeholder="Enter Password"
      [(ngModel)]="password">

    <button (click)="login()">
      Login
    </button>

    <div class="forgot-link">

      <button
        type="button"
        (click)="router.navigate(['/forgot-password'])">

        Forgot Password?

      </button>

    </div>


    <div class="register-link">

        Don't have an account?

        <button
            type="button"
            (click)="router.navigate(['/register'])">

            Create Account

        </button>

    </div>

  </div>

</div>
