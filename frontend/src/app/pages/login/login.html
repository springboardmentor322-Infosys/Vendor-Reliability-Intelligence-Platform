<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>VRIP</mat-card-title>
      <mat-card-subtitle>Vendor Reliability Intelligence Platform</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to continue</p>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email Address</mat-label>
        <input matInput type="email" [(ngModel)]="email" name="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="password" name="password" />
      </mat-form-field>

      <button mat-raised-button color="primary" class="full-width" (click)="login()">
        Login
      </button>

      <p class="footer-text">
        Don't have an account?
        <a routerLink="/register">Register</a> · <a routerLink="/password-reset">Forgot password?</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
