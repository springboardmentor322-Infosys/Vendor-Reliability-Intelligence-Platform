<div class="container">

  <!-- =====================================================
       ANIMATED BACKGROUND OBJECTS
       ===================================================== -->

  <div class="floating-bg" aria-hidden="true">

    <!-- Glass Cubes -->
    <span class="float-object glass-cube cube-1"></span>
    <span class="float-object glass-cube cube-2"></span>

    <!-- Glowing Orbs -->
    <span class="float-object glow-orb orb-1"></span>
    <span class="float-object glow-orb orb-2"></span>

    <!-- Rotating Rings -->
    <span class="float-object ring ring-1"></span>
    <span class="float-object ring ring-2"></span>

    <!-- Small Floating Orbs -->
    <span class="float-object small-orb small-orb-1"></span>
    <span class="float-object small-orb small-orb-2"></span>

  </div>


  <!-- =====================================================
       BACKGROUND DECORATIVE CIRCLES
       ===================================================== -->

  <div class="bg-circle circle-top-left"></div>

  <div class="bg-circle circle-top-right"></div>

  <div class="bg-circle circle-bottom-left"></div>

  <div class="bg-circle circle-bottom-right"></div>


  <!-- =====================================================
       LOGIN CARD
       ===================================================== -->

  <div class="login-card">

    <!-- Logo -->
    <div class="logo-box">
      <span>✓</span>
    </div>


    <!-- Title -->
    <h1>
      VendorIQ
    </h1>


    <!-- Subtitle -->
    <p class="subtitle">
      Vendor Management System
    </p>


    <!-- =================================================
         EMAIL
         ================================================= -->

    <div class="form-group">

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="Enter Email"
        [(ngModel)]="email">

    </div>


    <!-- =================================================
         PASSWORD
         ================================================= -->

    <div class="form-group">

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Enter Password"
        [(ngModel)]="password">

    </div>


    <!-- =================================================
         LOGIN BUTTON
         ================================================= -->

    <button
      type="button"
      class="login-btn"
      (click)="login()">

      Login

    </button>


    <!-- =================================================
         FORGOT PASSWORD
         ================================================= -->

    <div class="forgot-link">

      <button
        type="button"
        (click)="router.navigate(['/forgot-password'])">

        Forgot Password?

      </button>

    </div>


    <!-- =================================================
         REGISTER
         ================================================= -->

    <div class="register-link">

      <p>
        Don't have an account?
      </p>

      <button
        type="button"
        (click)="router.navigate(['/register'])">

        Create Account

      </button>

    </div>

  </div>

</div>
