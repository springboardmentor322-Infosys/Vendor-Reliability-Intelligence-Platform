<div class="container">

  <div class="header">
    <h2>Edit Purchase Order</h2>
  </div>


  <form (ngSubmit)="updateOrder()">


    <label>Vendor Name</label>

    <input
      type="text"
      [(ngModel)]="order.vendor_name"
      name="vendor_name"
      required>



    <label>Product Name</label>

    <input
      type="text"
      [(ngModel)]="order.product_name"
      name="product_name"
      required>



    <label>Quantity</label>

    <input
      type="number"
      [(ngModel)]="order.quantity"
      name="quantity"
      required>



    <label>Total Amount</label>

    <input
      type="number"
      [(ngModel)]="order.total_amount"
      name="total_amount"
      required>



    <label>Status</label>

    <select
      [(ngModel)]="order.status"
      name="status">


      <option value="Pending">
        Pending
      </option>


      <option value="Approved">
        Approved
      </option>


      <option value="Completed">
        Completed
      </option>


    </select>



    <button type="submit">
      Update Purchase Order
    </button>


  </form>

</div>
