<div class="min-h-screen bg-[#132436] flex items-center justify-center p-10 font-sans">
  <div class="bg-white rounded-xl max-w-[480px] w-full p-10 shadow-[0_30px_60px_rgba(0,0,0,0.35)] relative">
    
    <a routerLink="/login" class="absolute top-6 left-6 text-[13px] font-semibold text-[#8FA3AC] hover:text-[#00B386] flex items-center gap-1 transition-colors">
      ← Back to Login
    </a>

    <div class="mt-8">
      <h2 class="m-0 mb-1 text-[22px] font-semibold text-[#132436]">Set New Password</h2>
      <div class="text-[#5C7280] text-[13.5px] mb-6">Please enter your reset token and new password below.</div>
      
      <div *ngIf="message" class="bg-green-50 text-green-700 p-3 rounded-md text-sm mb-4">
        {{ message }}
      </div>

      <div class="mb-3.5">
        <label class="block text-[12.5px] font-semibold mb-1.5 text-[#132436]">Reset Token</label>
        <input type="text" [(ngModel)]="token" class="w-full p-2.5 border border-[#E1E8EC] rounded-md text-[14px] bg-[#F9FAFA] focus:outline-none focus:border-[#00F0B5]" placeholder="Paste token here">
      </div>
      
      <div class="mb-3.5">
        <label class="block text-[12.5px] font-semibold mb-1.5 text-[#132436]">New Password</label>
        <input type="password" [(ngModel)]="password" class="w-full p-2.5 border border-[#E1E8EC] rounded-md text-[14px] bg-[#F9FAFA] focus:outline-none focus:border-[#00F0B5]" placeholder="••••••••••">
      </div>

      <button (click)="onSubmit()" class="w-full bg-[#00B386] hover:bg-[#00F0B5] text-white p-3 rounded-md font-semibold text-[14.5px] mt-4 transition-colors">
        Update Password
      </button>
    </div>
    
  </div>
</div>
