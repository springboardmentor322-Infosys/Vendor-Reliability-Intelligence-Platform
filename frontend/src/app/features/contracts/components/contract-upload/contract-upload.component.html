<div class="card">
  <div class="card-head">
    <h3>Upload Contract</h3>
  </div>
  <div class="card-body">
    <form [formGroup]="contractForm" class="form-grid">
      
      <div class="form-group full-width">
        <label>Title</label>
        <input type="text" formControlName="title" class="form-control" required>
      </div>

      <div class="form-group">
        <label>Vendor ID</label>
        <input type="number" formControlName="vendor_id" class="form-control" required>
      </div>

      <div class="form-group">
        <label>Purchase Order ID</label>
        <input type="number" formControlName="purchase_order_id" class="form-control">
      </div>

      <div class="form-group">
        <label>Start Date</label>
        <input type="date" formControlName="start_date" class="form-control" required>
      </div>

      <div class="form-group">
        <label>End Date</label>
        <input type="date" formControlName="end_date" class="form-control" required>
      </div>

      <div class="form-group">
        <label>Contract Value</label>
        <input type="number" formControlName="contract_value" class="form-control">
      </div>

      <div class="form-group">
        <label>Contract Type</label>
        <input type="text" formControlName="contract_type" class="form-control">
      </div>

      <div class="form-group full-width">
        <label>Compliance Flags</label>
        <select multiple class="form-control" (change)="onComplianceChange($event)" style="height: 100px;">
          <option *ngFor="let flag of complianceFlags" [value]="flag">{{flag}}</option>
        </select>
      </div>

      <div class="form-group">
        <label>
          <input type="checkbox" formControlName="renewal_required"> Renewal Required
        </label>
      </div>

      <div class="form-group">
        <label>
          <input type="checkbox" formControlName="auto_renew"> Auto Renew
        </label>
      </div>

      <div class="form-group full-width">
        <label>Upload Contract PDF (Max 10MB)</label>
        <input type="file" (change)="onFileSelected($event)" accept="application/pdf" class="form-control">
      </div>
      
    </form>
  </div>
  <div class="card-footer text-right p-4" style="border-top: 1px solid #eee;">
    <button class="btn btn-secondary mr-2" (click)="onCancel()">Cancel</button>
    <button class="btn btn-primary" [disabled]="!contractForm.valid || !selectedFile" (click)="onSubmit()">Submit</button>
  </div>
</div>
