<div class="p-6 bg-slate-50 min-h-screen text-slate-800">
  <div class="mb-8 flex justify-between items-center">
    <h2 class="text-2xl font-bold text-slate-900">Risk & Controls</h2>
  </div>
  
  <div *ngIf="loading" class="flex flex-col items-center justify-center p-20 space-y-4">
    <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <div *ngIf="!loading && data">

        <div class="mb-6 p-4 border border-red-200 bg-red-50 text-red-800 rounded-xl flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center text-xl">⚠️</div>
                <div class="text-sm font-bold">Primary Control Failures ({{data?.length || 0}})</div>
            </div>
        </div>
        <table class="w-full text-left text-xs bg-white rounded-xl shadow-sm border-t-2 border-red-500">
            <thead class="bg-slate-50 text-slate-500 border-b">
                <tr><th class="p-4">Risk Level</th><th class="p-4">Entity Type</th><th class="p-4">Target Entity</th><th class="p-4 border-l">Triggering Control Reason</th></tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr *ngFor="let r of data" class="hover:bg-red-50 transition">
                    <td class="p-4"><span class="px-2 py-1 rounded bg-red-100 text-red-800 font-bold block w-min">{{r.risk_level}}</span></td>
                    <td class="p-4 font-medium">{{r.entity}}</td>
                    <td class="p-4 text-indigo-600 hover:underline cursor-pointer" routerLink="/vendor-audit">{{r.vendor}}</td>
                    <td class="p-4 font-medium border-l border-slate-100 text-red-900 bg-red-50/10">{{r.reason}}</td>
                </tr>
                <tr *ngIf="!data?.length"><td colspan="4" class="p-12 text-center text-slate-500 font-medium">All controls operating normally. No high risks identified.</td></tr>
            </tbody>
        </table>
        
  </div>
</div>
