<div class="p-6 bg-slate-50 min-h-screen text-slate-800">
  <div class="mb-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <h2 class="text-2xl font-bold text-slate-900">Platform Audit Logs</h2>
    <div class="flex gap-2">
      <input type="text" [(ngModel)]="filters.action" placeholder="Filter by action..."
        class="border border-slate-200 rounded px-3 py-1.5 text-sm outline-none focus:border-indigo-500">
      <button (click)="load()"
        class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded font-medium text-sm transition shadow-sm">Search</button>
    </div>
  </div>

  <div *ngIf="loading" class="flex justify-center p-20">
    <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <div *ngIf="!loading">

    <!-- DYNAMIC KPIs PORTED FROM DASHBOARD FOR VISUAL PADDING -->
    <div class="grid grid-cols-6 gap-4 mb-6" *ngIf="dashboard">
      <div *ngFor="let kpi of kpis"
        class="bg-white rounded-xl shadow-sm border border-slate-100 p-4 flex flex-col justify-between hover:shadow-md transition">
        <div class="flex flex-col items-start gap-1">
          <p class="text-xs text-slate-500 font-medium truncate w-full">{{kpi.label}}</p>
        </div>
        <div class="mt-2 flex flex-col">
          <h3 class="text-2xl font-bold text-slate-900 mb-1">{{kpi.value}}</h3>
          <span class="text-[10px] text-green-600 font-medium flex items-center gap-1">↑ {{kpi.sub}}</span>
        </div>
      </div>
    </div>

    <!-- AUDIT LOGS TABLE -->
    <div class="bg-white shadow-sm border border-slate-100 rounded-xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm whitespace-nowrap">
          <thead class="bg-slate-50 text-slate-400 uppercase font-bold text-[10px] border-b border-slate-100">
            <tr>
              <th class="px-6 py-4">Timestamp</th>
              <th class="px-6 py-4">Action</th>
              <th class="px-6 py-4">Log Origin</th>
              <th class="px-6 py-4">Details</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-50">
            <tr *ngFor="let audit of data" class="hover:bg-slate-50/50 transition truncate">
              <td class="px-6 py-4 text-xs font-medium text-slate-700">{{audit.timestamp | date:'short'}}</td>
              <td
                class="px-6 py-4 text-xs font-bold text-slate-900 border border-slate-100 bg-slate-50/50 rounded inline-block mt-2 ml-4">
                <span
                  [ngClass]="audit.action.includes('violation') ? 'text-red-500' : 'text-slate-800'">{{audit.action}}</span>
              </td>
              <td class="px-6 py-4 text-xs text-indigo-600 font-medium">User ID: {{audit.user_id}}</td>
              <td class="px-6 py-4 text-[10.5px] text-slate-500 truncate max-w-md">{{audit.details}}</td>
            </tr>
            <tr *ngIf="!data.length">
              <td colspan="4" class="p-12 text-center text-slate-400 font-medium">No audit logs matching this search
                criteria were found in the decentralized ledger.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
