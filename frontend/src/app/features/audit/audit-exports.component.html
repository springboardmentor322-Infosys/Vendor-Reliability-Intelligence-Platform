<div class="p-6 bg-slate-50 min-h-screen text-slate-800">
  <div class="mb-8 flex justify-between items-center">
    <h2 class="text-2xl font-bold text-slate-900">Raw Database Export Builder</h2>
  </div>
  
  <div *ngIf="loading" class="flex flex-col items-center justify-center p-20 space-y-4">
    <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <div *ngIf="!loading && data">

        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-100 max-w-2xl text-sm">
            <p class="text-slate-600 mb-6 border-l-4 border-indigo-500 pl-4 py-1">Auditors may extract sanitized raw JSON or CSV bundles of operational records based on PostgreSQL sources available. Only Read-Only queries are dispatched.</p>
            <div class="space-y-4">
                <div>
                   <label class="block text-xs font-bold text-slate-700 mb-1">Select Target Database Table</label>
                   <select class="w-full border rounded p-2 text-xs"><option>Purchase Orders (tbl_po)</option><option>Audit Logs (tbl_audit)</option><option>Vendors (tbl_vendor)</option></select>
                </div>
                <button class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded text-xs flex gap-2 items-center">
                    Initiate CSV Data Dump Pipeline
                </button>
            </div>
        </div>
        
  </div>
</div>
