<div class="p-6 bg-slate-50 min-h-screen text-slate-800">
  <div class="mb-8 flex justify-between items-center">
    <h2 class="text-2xl font-bold text-slate-900">Contract & Compliance</h2>
  </div>
  
  <div *ngIf="loading" class="flex flex-col items-center justify-center p-20 space-y-4">
    <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <div *ngIf="!loading && data">

        <div class="flex gap-4 mb-6">
            <input type="text" [(ngModel)]="filters.vendor" placeholder="Vendor" class="px-3 py-2 border rounded text-xs w-48">
            <button (click)="load()" class="text-xs bg-indigo-600 text-white px-4 rounded">Verify Contracts</button>
        </div>
        <div class="grid grid-cols-4 gap-6">
            <div *ngFor="let c of data" class="bg-white p-5 rounded-xl shadow-sm border" [ngClass]="c.days_remaining <= 30 ? 'border-amber-300' : 'border-slate-100'">
                <div class="flex justify-between items-start mb-2">
                    <h4 class="font-bold text-slate-800">{{c.contract}}</h4>
                    <span *ngIf="c.days_remaining <= 30" class="text-[10px] bg-amber-100 text-amber-800 px-1 rounded font-bold">Expiring Soon</span>
                </div>
                <a routerLink="/vendor-audit" class="text-xs text-indigo-600 hover:underline mb-4 block">{{c.vendor}}</a>
                <div class="text-xs text-slate-500 mb-3 px-2 py-1 bg-slate-50 rounded">
                    <div>Ends: {{c.expiry | date:'shortDate'}}</div>
                    <div><b>{{c.days_remaining}} Days Left</b></div>
                </div>
                <button class="w-full text-xs font-medium bg-slate-100 text-slate-600 py-1 rounded hover:bg-slate-200">View Document</button>
            </div>
            <div *ngIf="!data?.length" class="col-span-4 text-center p-12 bg-white rounded-xl text-slate-400 border border-slate-100">No contract records match.</div>
        </div>
        
  </div>
</div>
