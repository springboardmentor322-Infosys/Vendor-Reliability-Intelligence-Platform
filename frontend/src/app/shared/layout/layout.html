<mat-sidenav-container class="layout-container">
  <mat-sidenav [mode]="isMobile() ? 'over' : 'side'" [opened]="sidenavOpened()" class="layout-sidenav">
    <div class="sidenav-brand"><div class="brand-icon"><mat-icon>verified_user</mat-icon></div><div class="brand-text"><h2>VendorIQ</h2><p>Vendor Reliability Intelligence Platform</p></div></div>
    <div class="menu-label">MAIN MENU</div>
    <mat-nav-list>@for(item of navItems; track item.route){<a mat-list-item [routerLink]="item.route" routerLinkActive="active-link"><mat-icon matListItemIcon>{{item.icon}}</mat-icon><span matListItemTitle>{{item.label}}</span></a>}</mat-nav-list>
    <div class="menu-label secondary">ACCOUNT</div>
    <div class="sidebar-footer"><div class="profile"><mat-icon>account_circle</mat-icon><div><strong>{{auth.currentUser()?.full_name || 'User'}}</strong><small>{{roleLabel}}</small></div></div><button mat-stroked-button class="logout-btn" (click)="logout()"><mat-icon>logout</mat-icon> Logout</button></div>
  </mat-sidenav>
  <mat-sidenav-content><mat-toolbar class="layout-toolbar">@if(isMobile()){<button mat-icon-button (click)="toggleSidenav()"><mat-icon>menu</mat-icon></button>}<span class="toolbar-title">{{pageTitle}}</span><span class="spacer"></span><button mat-icon-button><mat-icon>notifications_none</mat-icon></button><span class="top-avatar"><mat-icon>account_circle</mat-icon></span></mat-toolbar><main class="layout-content"><router-outlet /></main></mat-sidenav-content>
</mat-sidenav-container>
