<div class="container">

  <h2>Add Contract</h2>


  <form (ngSubmit)="saveContract()">


    <input
    type="text"
    placeholder="Vendor Name"
    [(ngModel)]="contract.vendor_name"
    name="vendor_name"
    required>



    <input
    type="text"
    placeholder="Contract Title"
    [(ngModel)]="contract.contract_title"
    name="contract_title"
    required>



    <label>Start Date</label>
    <input
    type="date"
    [(ngModel)]="contract.start_date"
    name="start_date">



    <label>Expiry Date</label>
    <input
    type="date"
    [(ngModel)]="contract.expiry_date"
    name="expiry_date">



    <input
    type="number"
    placeholder="Renewal Notice Period"
    [(ngModel)]="contract.renewal_notice_period"
    name="renewal_notice_period">



    <textarea
    placeholder="Terms"
    [(ngModel)]="contract.terms"
    name="terms">
    </textarea>



    <select
    [(ngModel)]="contract.compliance_flag"
    name="compliance_flag">

      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>

    </select>



    <button type="submit">
      Save Contract
    </button>


    <button 
    type="button"
    class="cancel"
    (click)="cancel()">

      Cancel

    </button>


  </form>


</div>
