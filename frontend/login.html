<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Vendor Reliability Platform</title>

    <link rel="stylesheet"
          href="css/auth.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Left -->

    <div class="left-panel">

        <h1>Vendor Reliability Platform</h1>

        <p>

            Securely manage vendors,
            contracts and procurement
            using one intelligent platform.

        </p>

    </div>

    <!-- Right -->

    <div class="right-panel">

        <form id="loginForm">

            <h2>Welcome Back</h2>

            <p class="subtitle">

                Login to continue

            </p>

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email"
                    required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required>

                    <i
                        class="fa-solid fa-eye"
                        id="togglePassword"></i>

                </div>

            </div>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">

                    Forgot Password?

                </a>

            </div>

            <div id="message"></div>

            <button
                id="loginBtn"
                type="submit">

                Login

            </button>

            <p class="register-link">

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </p>

        </form>

    </div>

</div>

<script src="js/api.js"></script>

<script src="js/login.js"></script>

</body>

</html>
