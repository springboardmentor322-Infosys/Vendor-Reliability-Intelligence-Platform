<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor comparison | VendorIQ</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/dashboard.css"></head><body class="intelligence-page"><main class="container-fluid p-3 p-md-4"><header class="d-flex gap-3 align-items-center mb-4"><a href="dashboard.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Dashboard</a><div><p class="eyebrow mb-1">PROCUREMENT INTELLIGENCE</p><h1 class="h3 mb-0">Vendor comparison</h1></div><button id="logout" class="btn btn-outline-secondary ms-auto">Log out</button></header><div id="error" class="alert alert-danger d-none"></div><section id="workspace"><article class="intelligence-card mb-4"><div class="row g-3 align-items-end"><div class="col-md-8"><label for="vendorSelect" class="form-label fw-semibold">Select two or more approved vendors</label><select id="vendorSelect" multiple class="form-select" size="5"></select></div><div class="col-md-4"><button id="compare" class="btn btn-primary w-100">Compare selected vendors</button></div></div></article><div id="best" class="intelligence-hero mb-4"><div><p class="eyebrow">BEST OPTION</p><h2>Select vendors to compare their live risk profile</h2><p>The recommendation weighs reliability against operational, compliance, financial, cyber, and dependency risk.</p></div></div><div class="row g-4"><div class="col-lg-7"><article class="intelligence-card chart-card"><canvas id="comparisonChart"></canvas></article></div><div class="col-lg-5"><article class="intelligence-card h-100"><p class="eyebrow">DECISION MATRIX</p><div class="table-responsive"><table class="table intelligence-table"><thead><tr><th>Vendor</th><th>Reliability</th><th>Risk</th><th>Delivery</th></tr></thead><tbody id="matrix"></tbody></table></div></article></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script src="assets/js/api.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/notifications.js"></script><script>(()=>{"use strict";const api=window.VendorIQApi,auth=window.VendorIQAuth,$=s=>document.querySelector(s);let vendors=[],chart;const esc=v=>String(v??"—").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));const request=(path,options={})=>api.request(path,{token:auth.getAccessToken(),...options});function render(){const selected=[...$("#vendorSelect").selectedOptions].map(o=>vendors.find(v=>v.id===Number(o.value))).filter(Boolean);if(selected.length<2){$("#matrix").innerHTML='<tr><td colspan="4" class="text-muted">Choose at least two vendors.</td></tr>';return}const best=[...selected].sort((a,b)=>(Number(b.reliability_score||0)-Number(b.overall_risk_score||0))-(Number(a.reliability_score||0)-Number(a.overall_risk_score||0)))[0];$("#best").innerHTML=`<div><p class="eyebrow">BEST OPTION</p><h2>${esc(best.company_name)}</h2><p>Highest combined reliability-to-risk position among the selected suppliers. Reliability ${Number(best.reliability_score||0).toFixed(1)} · overall risk ${Number(best.overall_risk_score||0).toFixed(1)}.</p></div>`;$("#matrix").innerHTML=selected.map(v=>`<tr><td><a href="vendor-details.html?id=${v.id}">${esc(v.company_name)}</a></td><td>${Number(v.reliability_score||0).toFixed(1)}</td><td>${Number(v.overall_risk_score||0).toFixed(1)}</td><td>${(100-Number(v.operational_risk_score||0)).toFixed(1)}%</td></tr>`).join("");chart?.destroy();chart=new Chart($("#comparisonChart"),{type:"bar",data:{labels:["Reliability","Overall risk","Operational","Compliance","Financial","Cyber","Dependency"],datasets:selected.map((v,i)=>({label:v.company_name,data:[v.reliability_score,v.overall_risk_score,v.operational_risk_score,v.compliance_risk_score,v.financial_risk_score,v.cyber_risk_score,v.dependency_risk_score].map(Number),backgroundColor:["#2563eb","#22c55e","#f59e0b","#7c3aed"][i%4]}))},options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:"Live risk dimension comparison"},legend:{position:"bottom"}},scales:{y:{beginAtZero:true,max:100,title:{display:true,text:"Score"}}}}})}async function init(){if(!auth.requireAuthentication())return;try{await window.VendorIQNavigationReady;const user=auth.getUser()||auth.setUser(await api.me(auth.getAccessToken()));if(auth.getRoleNames(user).includes("Vendor")){$("#workspace").hidden=true;$("#error").textContent="Access denied. Vendor accounts cannot compare other suppliers.";$("#error").classList.remove("d-none");return}const data=await request("/vendors?page_size=100");vendors=(data.items||[]).filter(v=>v.approval_status==="Approved");$("#vendorSelect").innerHTML=vendors.map((v,i)=>`<option value="${v.id}" ${i<2?"selected":""}>${esc(v.company_name)} — ${v.risk_level||v.risk_category||"LOW"}</option>`).join("");$("#compare").onclick=render;$("#logout").onclick=()=>{auth.clearSession();location.replace("login.html")};render()}catch(e){$("#error").textContent=e.message;$("#error").classList.remove("d-none")}}init()})();</script></body></html>
