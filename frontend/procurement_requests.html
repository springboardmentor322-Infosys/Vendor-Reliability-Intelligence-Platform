<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Procurement Requests</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/procurement_requests.css">

</head>

<body>

<div id="sidebar-container"></div>

<div class="main-content">

    <div id="navbar"></div>

    <div class="page-content">

        <div class="page-header">

            <h2>Procurement Requests</h2>

            <button id="addRequestBtn">

                + New Request

            </button>

        </div>

        <div class="filters">

            <input
                type="text"
                id="searchRequest"
                placeholder="Search Request..."
            >

            <select id="statusFilter">

                <option value="">All Status</option>

                <option>Pending</option>

                <option>Approved</option>

                <option>Rejected</option>

            </select>

        </div>

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Request No</th>

                    <th>Department</th>

                    <th>Requested By</th>

                    <th>Item</th>

                    <th>Quantity</th>

                    <th>Cost</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="requestTableBody">

            </tbody>

        </table>

    </div>

    <div id="footer"></div>

</div>

<script src="js/api.js"></script>
<script src="js/roleAccess.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/procurement_requests.js"></script>

    <script>
      requirePermission("procurementRequests");
    </script>

</body>

</html>
