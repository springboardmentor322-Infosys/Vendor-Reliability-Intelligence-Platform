<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VendorIQ | My Dashboard</title>

<link rel="stylesheet" href="css/style.css">

<style>
/* =========================================================
   VENDOR DASHBOARD
   ========================================================= */

:root {
  --vd-primary: #2563eb;
  --vd-primary-light: #eff6ff;

  --vd-success: #16a34a;
  --vd-warning: #d97706;
  --vd-danger: #dc2626;

  --vd-bg: #f5f7fb;
  --vd-card: #ffffff;

  --vd-border: #e5e7eb;

  --vd-text: #111827;
  --vd-muted: #64748b;

  --vd-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
  --vd-shadow-hover: 0 8px 24px rgba(15, 23, 42, 0.10);

  --vd-radius: 14px;
}

body {
  background: var(--vd-bg);
}

/* =========================================================
   PAGE
   ========================================================= */

#page-content {
  padding: 24px;
  background: var(--vd-bg);
}

/* =========================================================
   WELCOME HEADER
   ========================================================= */

.vendor-welcome {
  background: linear-gradient(
    135deg,
    #ffffff 0%,
    #f7faff 100%
  );

  border: 1px solid var(--vd-border);
  border-radius: var(--vd-radius);

  padding: 20px 22px;
  margin-bottom: 20px;

  box-shadow: var(--vd-shadow);

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 20px;
}

.vendor-welcome-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

.vendor-avatar {
  width: 52px;
  height: 52px;

  border-radius: 14px;

  background: var(--vd-primary-light);
  color: var(--vd-primary);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 22px;
  font-weight: 700;
}

.vendor-welcome h2 {
  margin: 0 0 4px;

  font-size: 21px;
  font-weight: 750;

  color: var(--vd-text);
}

.vendor-welcome p {
  margin: 0;

  color: var(--vd-muted);
  font-size: 13px;
}

.vendor-id-chip {
  padding: 8px 12px;

  background: #f8fafc;
  border: 1px solid var(--vd-border);

  border-radius: 9px;

  font-size: 12px;
  color: var(--vd-muted);

  white-space: nowrap;
}

/* =========================================================
   KPI CARDS
   ========================================================= */

.stat-grid {
  display: grid;

  grid-template-columns:
    repeat(4, minmax(0, 1fr));

  gap: 16px;

  margin-bottom: 20px;
}

.stat-card {
  background: var(--vd-card);

  border: 1px solid var(--vd-border);

  border-radius: var(--vd-radius);

  padding: 18px;

  min-height: 112px;

  box-shadow: var(--vd-shadow);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.stat-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--vd-shadow-hover);
}

.stat-card .label {
  color: var(--vd-muted);

  font-size: 11px;
  font-weight: 700;

  text-transform: uppercase;

  letter-spacing: 0.5px;

  margin-bottom: 9px;
}

.stat-card .value {
  color: var(--vd-text);

  font-size: 27px;

  line-height: 1.15;

  font-weight: 750;

  margin-bottom: 7px;
}

.stat-card .sub {
  color: var(--vd-muted);

  font-size: 12px;
}

/* =========================================================
   CHART GRID
   ========================================================= */

.vendor-chart-grid {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 18px;

  margin-bottom: 18px;
}

/* =========================================================
   CHART CARD
   ========================================================= */

.chart-card {
  background: var(--vd-card);

  border: 1px solid var(--vd-border);

  border-radius: var(--vd-radius);

  box-shadow: var(--vd-shadow);

  height: 300px;

  overflow: hidden;
}

.chart-header {
  height: 58px;

  padding: 0 18px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom: 1px solid var(--vd-border);
}

.chart-header h3 {
  margin: 0;

  font-size: 15px;

  font-weight: 700;

  color: var(--vd-text);
}

.chart-header span {
  font-size: 11px;

  color: var(--vd-muted);
}

.chart-body {
  height: 240px;

  padding: 10px 18px 15px;

  box-sizing: border-box;

  position: relative;
}

.chart-body canvas {
  width: 100% !important;
  height: 220px !important;
}

/* =========================================================
   TABLE / PANEL GRID
   ========================================================= */

.panel-grid {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 18px;

  margin-bottom: 18px;
}

/* =========================================================
   PANELS
   ========================================================= */

.panel {
  background: var(--vd-card);

  border: 1px solid var(--vd-border);

  border-radius: var(--vd-radius);

  box-shadow: var(--vd-shadow);

  overflow: hidden;
}

.panel h3 {
  margin: 0;

  padding: 17px 18px;

  font-size: 15px;

  font-weight: 700;

  color: var(--vd-text);

  border-bottom: 1px solid var(--vd-border);
}

/* =========================================================
   TABLES
   ========================================================= */

.panel table {
  width: 100%;

  border-collapse: collapse;

  font-size: 12px;
}

.panel th {
  background: #f8fafc;

  color: #64748b;

  font-size: 10px;

  font-weight: 700;

  text-transform: uppercase;

  letter-spacing: 0.45px;

  padding: 10px 12px;

  text-align: left;

  border-bottom: 1px solid var(--vd-border);

  white-space: nowrap;
}

.panel td {
  padding: 11px 12px;

  color: #374151;

  border-bottom: 1px solid #f1f5f9;

  vertical-align: middle;
}

.panel tbody tr:last-child td {
  border-bottom: none;
}

.panel tbody tr:hover {
  background: #f8fbff;
}

.panel td:first-child {
  color: var(--vd-text);

  font-weight: 600;
}

/* =========================================================
   COMMUNICATION
   ========================================================= */

.communication-panel {
  min-height: 250px;
}

.communication-header {
  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 17px 18px;

  border-bottom: 1px solid var(--vd-border);
}

.communication-header h3 {
  margin: 0;

  padding: 0;

  border: 0;
}

#comm-activity {
  padding: 5px 18px 12px;
}

#comm-activity > div {
  padding: 12px 0;

  border-bottom: 1px solid #eef2f7;

  font-size: 12px;

  line-height: 1.5;
}

#comm-activity > div:last-child {
  border-bottom: none;
}

#comm-activity strong {
  color: var(--vd-text);
}

/* =========================================================
   BUTTON
   ========================================================= */

.btn.small.secondary {
  border-radius: 8px;

  padding: 7px 11px;

  font-size: 11px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 1100px) {

  .stat-grid {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .vendor-chart-grid,
  .panel-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 700px) {

  #page-content {
    padding: 15px;
  }

  .stat-grid {
    grid-template-columns: 1fr;
  }

  .vendor-welcome {
    flex-direction: column;

    align-items: flex-start;
  }

  .vendor-id-chip {
    width: 100%;

    box-sizing: border-box;
  }

  .panel {
    overflow-x: auto;
  }

  .panel table {
    min-width: 600px;
  }
}
</style>
</head>

<body>

<div class="app-shell" id="app-shell"></div>

<!-- =========================================================
     API
     ========================================================= -->

<script src="js/api.js"></script>

<!-- =========================================================
     CHART.JS
     IMPORTANT: LOCAL FILE
     ========================================================= -->

<script src="js/chart.umd.min.js"></script>

<script>

/* =========================================================
   AUTH + SHELL
   ========================================================= */

requireAuth();

renderShell(
  "vendor-dashboard.html",
  "My Vendor Dashboard"
);


/* =========================================================
   CHART INSTANCES
   ========================================================= */

let deliveryChart = null;
let orderChart = null;


/* =========================================================
   MAIN LOAD FUNCTION
   ========================================================= */

async function load() {

  const content =
    document.getElementById("page-content");


  /* =======================================================
     LOAD VENDOR
     ======================================================= */

  let vendor;

  try {

    vendor = await api("/vendors/me");

  } catch (err) {

    content.innerHTML = `

      <div
        class="panel"
        style="
          max-width:520px;
          margin:40px auto;
          padding:22px;
        "
      >

        <h3
          style="
            padding:0 0 10px;
            border:0;
          "
        >
          No Vendor Profile Linked
        </h3>

        <p
          class="text-muted"
          style="
            font-size:14px;
            line-height:1.6;
          "
        >
          ${err.message}
        </p>

        <p
          class="text-muted"
          style="
            font-size:13px;
            margin-top:10px;
            line-height:1.6;
          "
        >
          Vendor accounts are matched automatically
          at registration by email address.
          If your company was already registered by
          a procurement manager, make sure you sign up
          using that exact same email.
        </p>

      </div>

    `;

    return;
  }


  /* =======================================================
     VENDOR ID
     ======================================================= */

  const vendorCode =
    `VDR-${String(vendor.id).padStart(4, "0")}`;


  /* =======================================================
     VENDOR INITIAL
     ======================================================= */

  const vendorInitial =
    (vendor.name || "V").charAt(0).toUpperCase();


  /* =======================================================
     DASHBOARD HTML
     ======================================================= */

  content.innerHTML = `

    <!-- =====================================================
         WELCOME
         ===================================================== -->

    <div class="vendor-welcome">

      <div class="vendor-welcome-left">

        <div class="vendor-avatar">
          ${vendorInitial}
        </div>

        <div>

          <h2>
            ${vendor.name || "Vendor Dashboard"}
          </h2>

          <p>
            Welcome back. Here's an overview of your
            vendor performance and activity.
          </p>

        </div>

      </div>

      <div class="vendor-id-chip">
        ${vendorCode}
      </div>

    </div>


    <!-- =====================================================
         KPI CARDS
         ===================================================== -->

    <div class="stat-grid">

      <!-- KPI 1 -->

      <div class="stat-card">

        <div class="label">
          Reliability Score
        </div>

        <div class="value">
          ${vendor.reliability_score}
        </div>

        <div class="sub">
          ${statusBadge(vendor.risk_level)}
        </div>

      </div>


      <!-- KPI 2 -->

      <div class="stat-card">

        <div class="label">
          Account Status
        </div>

        <div
          class="value"
          style="font-size:18px;"
        >
          ${statusBadge(vendor.status)}
        </div>

        <div class="sub">
          ${vendor.category}
        </div>

      </div>


      <!-- KPI 3 -->

      <div class="stat-card">

        <div class="label">
          Vendor ID
        </div>

        <div
          class="value"
          style="font-size:20px;"
        >
          ${vendorCode}
        </div>

        <div class="sub">
          ${vendor.email || "No email available"}
        </div>

      </div>


      <!-- KPI 4 -->

      <div class="stat-card">

        <div class="label">
          Vendor Category
        </div>

        <div
          class="value"
          style="
            font-size:17px;
            line-height:1.35;
          "
        >
          ${vendor.category}
        </div>

        <div class="sub">
          Registered Vendor
        </div>

      </div>

    </div>


    <!-- =====================================================
         CHARTS
         ===================================================== -->

    <div class="vendor-chart-grid">


      <!-- DELIVERY PERFORMANCE CHART -->

      <div class="chart-card">

        <div class="chart-header">

          <h3>
            Delivery Performance
          </h3>

          <span>
            On-Time vs Delayed
          </span>

        </div>

        <div class="chart-body">

          <canvas
            id="delivery-chart"
          ></canvas>

        </div>

      </div>


      <!-- ORDER STATUS CHART -->

      <div class="chart-card">

        <div class="chart-header">

          <h3>
            Order Status
          </h3>

          <span>
            Purchase Orders
          </span>

        </div>

        <div class="chart-body">

          <canvas
            id="order-chart"
          ></canvas>

        </div>

      </div>

    </div>


    <!-- =====================================================
         PERFORMANCE + CONTRACTS
         ===================================================== -->

    <div class="panel-grid">


      <!-- PERFORMANCE HISTORY -->

      <div class="panel">

        <h3>
          Performance History
        </h3>

        <table id="perf-table">

          <thead>

            <tr>

              <th>Date</th>

              <th>On-Time</th>

              <th>Delayed</th>

              <th>Quality</th>

              <th>Completion</th>

            </tr>

          </thead>

          <tbody>

            <tr>

              <td
                colspan="5"
                class="text-muted"
              >
                Loading...
              </td>

            </tr>

          </tbody>

        </table>

      </div>


      <!-- CONTRACT STATUS -->

      <div class="panel">

        <h3>
          Contract Status
        </h3>

        <table id="contract-table">

          <thead>

            <tr>

              <th>Title</th>

              <th>End Date</th>

              <th>Compliance</th>

            </tr>

          </thead>

          <tbody>

            <tr>

              <td
                colspan="3"
                class="text-muted"
              >
                Loading...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>


    <!-- =====================================================
         ORDERS + COMMUNICATION
         ===================================================== -->

    <div class="panel-grid">


      <!-- ORDER HISTORY -->

      <div class="panel">

        <h3>
          Order History
        </h3>

        <table id="order-table">

          <thead>

            <tr>

              <th>PO Number</th>

              <th>Item</th>

              <th>Total</th>

              <th>Status</th>

            </tr>

          </thead>

          <tbody>

            <tr>

              <td
                colspan="4"
                class="text-muted"
              >
                Loading...
              </td>

            </tr>

          </tbody>

        </table>

      </div>


      <!-- COMMUNICATION -->

      <div
        class="panel communication-panel"
      >

        <div class="communication-header">

          <h3>
            Communication Activity
          </h3>

          <a
            href="messages.html"
            class="btn small secondary"
          >
            Open Inbox
          </a>

        </div>

        <div id="comm-activity">

          <p class="text-muted">
            Loading...
          </p>

        </div>

      </div>

    </div>

  `;


  /* =======================================================
     LOAD ALL DATA
     ======================================================= */

  const [
    performance,
    contracts,
    orders,
    messages
  ] = await Promise.all([

    api(
      `/performance/vendor/${vendor.id}`
    ),

    api(
      `/contracts?vendor_id=${vendor.id}`
    ),

    api(
      `/procurement?vendor_id=${vendor.id}`
    ),

    api(
      `/messages/vendor/${vendor.id}`
    )

  ]);


  /* =======================================================
     PERFORMANCE TABLE
     ======================================================= */

  document.querySelector(
    "#perf-table tbody"
  ).innerHTML = performance.length

    ? performance.map(r => `

        <tr>

          <td>
            ${fmtDate(r.recorded_at)}
          </td>

          <td>
            ${r.on_time_deliveries}
          </td>

          <td>
            ${r.delayed_deliveries}
          </td>

          <td>
            ${r.quality_rating} / 5
          </td>

          <td>
            ${r.order_completion_rate}%
          </td>

        </tr>

      `).join("")

    : `

        <tr>

          <td
            colspan="5"
            class="text-muted"
          >
            No performance data logged yet.
          </td>

        </tr>

      `;


  /* =======================================================
     CONTRACT TABLE
     ======================================================= */

  document.querySelector(
    "#contract-table tbody"
  ).innerHTML = contracts.length

    ? contracts.map(c => `

        <tr>

          <td>
            ${c.contract_title}
          </td>

          <td>
            ${fmtDate(c.end_date)}
          </td>

          <td>
            ${statusBadge(
              c.compliance_status
            )}
          </td>

        </tr>

      `).join("")

    : `

        <tr>

          <td
            colspan="3"
            class="text-muted"
          >
            No contracts on file.
          </td>

        </tr>

      `;


  /* =======================================================
     ORDER TABLE
     ======================================================= */

  document.querySelector(
    "#order-table tbody"
  ).innerHTML = orders.length

    ? orders.map(po => `

        <tr>

          <td>
            ${po.po_number}
          </td>

          <td>
            ${po.item_description}
          </td>

          <td>
            ${fmtMoney(po.total_amount)}
          </td>

          <td>
            ${statusBadge(po.status)}
          </td>

        </tr>

      `).join("")

    : `

        <tr>

          <td
            colspan="4"
            class="text-muted"
          >
            No purchase orders yet.
          </td>

        </tr>

      `;


  /* =======================================================
     COMMUNICATION
     ======================================================= */

  const recentMessages =
    messages.slice(-4).reverse();


  document.getElementById(
    "comm-activity"
  ).innerHTML = recentMessages.length

    ? recentMessages.map(m => `

        <div>

          <strong>
            ${m.sender}
          </strong>

          <span class="text-muted">
            · ${fmtDate(m.sent_at)}
          </span>

          <br>

          <span class="text-muted">
            ${m.content}
          </span>

        </div>

      `).join("")

    : `

        <p class="text-muted">
          No messages yet.
        </p>

      `;


  /* =======================================================
     DRAW CHARTS
     ======================================================= */

  drawDeliveryChart(performance);

  drawOrderChart(orders);

}


/* =========================================================
   DELIVERY PERFORMANCE CHART
   ========================================================= */

function drawDeliveryChart(performance) {

  const canvas =
    document.getElementById(
      "delivery-chart"
    );

  if (!canvas) {
    return;
  }


  /* -------------------------------------------------------
     Destroy old chart if it exists
     ------------------------------------------------------- */

  if (deliveryChart) {

    deliveryChart.destroy();

    deliveryChart = null;

  }


  /* -------------------------------------------------------
     Calculate totals from performance records
     ------------------------------------------------------- */

  let onTime = 0;

  let delayed = 0;


  performance.forEach(record => {

    onTime +=
      Number(record.on_time_deliveries || 0);

    delayed +=
      Number(record.delayed_deliveries || 0);

  });


  /* -------------------------------------------------------
     Create chart
     ------------------------------------------------------- */

  deliveryChart = new Chart(
    canvas,
    {

      type: "doughnut",

      data: {

        labels: [
          "On-Time",
          "Delayed"
        ],

        datasets: [

          {

            data: [
              onTime,
              delayed
            ],

            backgroundColor: [
              "#16a34a",
              "#dc2626"
            ],

            borderWidth: 0,

            hoverOffset: 5

          }

        ]

      },

      options: {

        responsive: true,

        maintainAspectRatio: false,

        cutout: "68%",

        plugins: {

          legend: {

            position: "bottom",

            labels: {

              usePointStyle: true,

              pointStyle: "circle",

              padding: 18,

              font: {
                size: 11
              }

            }

          },

          tooltip: {

            callbacks: {

              label: function(context) {

                return (
                  " " +
                  context.label +
                  ": " +
                  context.raw
                );

              }

            }

          }

        }

      }

    }
  );

}


/* =========================================================
   ORDER STATUS CHART
   ========================================================= */

function drawOrderChart(orders) {

  const canvas =
    document.getElementById(
      "order-chart"
    );

  if (!canvas) {
    return;
  }


  /* -------------------------------------------------------
     Destroy previous chart
     ------------------------------------------------------- */

  if (orderChart) {

    orderChart.destroy();

    orderChart = null;

  }


  /* -------------------------------------------------------
     Count order statuses dynamically
     ------------------------------------------------------- */

  const statusCounts = {};


  orders.forEach(order => {

    const status =
      order.status || "Unknown";

    statusCounts[status] =
      (statusCounts[status] || 0) + 1;

  });


  const labels =
    Object.keys(statusCounts);


  const values =
    Object.values(statusCounts);


  /* -------------------------------------------------------
     Empty state
     ------------------------------------------------------- */

  if (!labels.length) {

    labels.push("No Orders");

    values.push(1);

  }


  /* -------------------------------------------------------
     Create chart
     ------------------------------------------------------- */

  orderChart = new Chart(
    canvas,
    {

      type: "doughnut",

      data: {

        labels: labels,

        datasets: [

          {

            data: values,

            backgroundColor: [

              "#2563eb",
              "#16a34a",
              "#d97706",
              "#dc2626",
              "#7c3aed",
              "#64748b"
            ],

            borderWidth: 0,

            hoverOffset: 5

          }

        ]

      },

      options: {

        responsive: true,

        maintainAspectRatio: false,

        cutout: "68%",

        plugins: {

          legend: {

            position: "bottom",

            labels: {

              usePointStyle: true,

              pointStyle: "circle",

              padding: 14,

              font: {
                size: 10
              }

            }

          },

          tooltip: {

            callbacks: {

              label: function(context) {

                return (
                  " " +
                  context.label +
                  ": " +
                  context.raw
                );

              }

            }

          }

        }

      }

    }
  );

}


/* =========================================================
   START
   ========================================================= */

load();

</script>

</body>
</html>
