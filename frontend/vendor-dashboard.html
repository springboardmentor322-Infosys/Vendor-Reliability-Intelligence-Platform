<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VendorIQ | My Dashboard</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* =========================================================
   VENDOR DASHBOARD
   ========================================================= */

:root {
    --vd-primary: #1e3a5f;
    --vd-primary-light: #2563eb;
    --vd-primary-soft: #eff6ff;

    --vd-success: #16a34a;
    --vd-warning: #d97706;
    --vd-danger: #dc2626;

    --vd-bg: #f5f7fb;
    --vd-card: #ffffff;
    --vd-border: #e2e8f0;

    --vd-text: #172033;
    --vd-muted: #64748b;

    --vd-shadow: 0 3px 12px rgba(15, 23, 42, 0.06);

    --vd-radius: 10px;
}

body {
    background: var(--vd-bg);
}

/* =========================================================
   PAGE
   ========================================================= */

#page-content {
    padding: 24px;
    background: var(--vd-bg);
}

/* =========================================================
   WELCOME HEADER
   ========================================================= */

.vendor-welcome {
    background: #ffffff;
    border: 1px solid var(--vd-border);
    border-radius: var(--vd-radius);

    padding: 20px 22px;
    margin-bottom: 20px;

    box-shadow: var(--vd-shadow);

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.vendor-welcome-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.vendor-avatar {
    width: 50px;
    height: 50px;

    border-radius: 10px;

    background: var(--vd-primary-soft);
    color: var(--vd-primary-light);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 21px;
    font-weight: 700;
}

.vendor-welcome h2 {
    margin: 0 0 5px;

    font-size: 21px;
    font-weight: 700;

    color: var(--vd-text);
}

.vendor-welcome p {
    margin: 0;

    color: var(--vd-muted);
    font-size: 13px;
}

.vendor-id-chip {
    padding: 8px 12px;

    background: #f8fafc;

    border: 1px solid var(--vd-border);
    border-radius: 8px;

    font-size: 12px;
    font-weight: 600;

    color: var(--vd-muted);

    white-space: nowrap;
}

/* =========================================================
   KPI CARDS
   ========================================================= */

.vendor-kpi-grid {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 15px;

    margin-bottom: 20px;
}

.vendor-kpi {
    background: #ffffff;

    border: 1px solid var(--vd-border);
    border-radius: var(--vd-radius);

    padding: 18px;

    min-height: 105px;

    box-shadow: var(--vd-shadow);
}

.vendor-kpi-label {
    color: var(--vd-muted);

    font-size: 11px;
    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 0.45px;

    margin-bottom: 9px;
}

.vendor-kpi-value {
    color: var(--vd-text);

    font-size: 25px;
    line-height: 1.2;

    font-weight: 700;

    margin-bottom: 7px;
}

.vendor-kpi-sub {
    color: var(--vd-muted);
    font-size: 12px;
}

/* =========================================================
   QUICK ACTIONS
   ========================================================= */

.vendor-quick-actions {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 12px;

    margin-bottom: 20px;
}

.vendor-action {
    background: #ffffff;

    border: 1px solid var(--vd-border);
    border-radius: 9px;

    padding: 13px 15px;

    text-decoration: none;

    display: flex;
    align-items: center;

    gap: 12px;

    box-shadow: var(--vd-shadow);

    transition:
        border-color 0.2s ease,
        transform 0.2s ease;
}

.vendor-action:hover {
    border-color: #93c5fd;
    transform: translateY(-1px);
}

.vendor-action-icon {
    width: 36px;
    height: 36px;

    border-radius: 8px;

    background: var(--vd-primary-soft);
    color: var(--vd-primary-light);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 14px;
    font-weight: 700;

    flex-shrink: 0;
}

.vendor-action strong {
    display: block;

    color: var(--vd-text);

    font-size: 12px;

    margin-bottom: 3px;
}

.vendor-action span {
    display: block;

    color: var(--vd-muted);

    font-size: 10px;
}

/* =========================================================
   CHART GRID
   ========================================================= */

.vendor-chart-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 17px;

    margin-bottom: 18px;
}

/* =========================================================
   CHART CARD
   ========================================================= */

.vendor-chart-card {
    background: #ffffff;

    border: 1px solid var(--vd-border);
    border-radius: var(--vd-radius);

    box-shadow: var(--vd-shadow);

    overflow: hidden;

    min-height: 315px;
}

.vendor-chart-header {
    padding: 15px 17px;

    border-bottom: 1px solid var(--vd-border);

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;
}

.vendor-chart-header h3 {
    margin: 0;

    color: var(--vd-text);

    font-size: 14px;
    font-weight: 700;
}

.vendor-chart-header span {
    color: var(--vd-muted);

    font-size: 10px;
}

.vendor-chart-body {
    height: 250px;

    padding: 12px 17px 17px;

    position: relative;

    box-sizing: border-box;
}

.vendor-chart-body canvas {
    width: 100% !important;
    height: 225px !important;
}

/* =========================================================
   PANELS
   ========================================================= */

.vendor-panel-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 17px;

    margin-bottom: 18px;
}

.vendor-panel {
    background: #ffffff;

    border: 1px solid var(--vd-border);
    border-radius: var(--vd-radius);

    box-shadow: var(--vd-shadow);

    overflow: hidden;
}

.vendor-panel-header {
    padding: 15px 17px;

    border-bottom: 1px solid var(--vd-border);
}

.vendor-panel-header h3 {
    margin: 0 0 3px;

    color: var(--vd-text);

    font-size: 14px;
    font-weight: 700;
}

.vendor-panel-header p {
    margin: 0;

    color: var(--vd-muted);

    font-size: 11px;
}

/* =========================================================
   TABLES
   ========================================================= */

.vendor-panel table {
    width: 100%;

    border-collapse: collapse;

    font-size: 12px;
}

.vendor-panel th {
    background: #f8fafc;

    color: #64748b;

    font-size: 10px;
    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 0.4px;

    padding: 10px 12px;

    text-align: left;

    border-bottom: 1px solid var(--vd-border);

    white-space: nowrap;
}

.vendor-panel td {
    padding: 11px 12px;

    color: #374151;

    border-bottom: 1px solid #f1f5f9;

    vertical-align: middle;
}

.vendor-panel tbody tr:last-child td {
    border-bottom: none;
}

.vendor-panel tbody tr:hover {
    background: #f8fbff;
}

.vendor-panel td:first-child {
    color: var(--vd-text);
    font-weight: 600;
}

/* =========================================================
   COMMUNICATION
   ========================================================= */

.communication-panel {
    min-height: 250px;
}

.communication-header {
    padding: 15px 17px;

    border-bottom: 1px solid var(--vd-border);

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;
}

.communication-header h3 {
    margin: 0;

    color: var(--vd-text);

    font-size: 14px;
    font-weight: 700;
}

.communication-header p {
    margin: 3px 0 0;

    color: var(--vd-muted);

    font-size: 11px;
}

.communication-button {
    padding: 7px 11px;

    background: var(--vd-primary-light);

    color: #ffffff;

    border-radius: 7px;

    text-decoration: none;

    font-size: 10px;
    font-weight: 600;
}

.communication-button:hover {
    background: var(--vd-primary);
}

#comm-activity {
    padding: 5px 17px 12px;
}

#comm-activity > div {
    padding: 12px 0;

    border-bottom: 1px solid #eef2f7;

    font-size: 12px;

    line-height: 1.5;
}

#comm-activity > div:last-child {
    border-bottom: none;
}

#comm-activity strong {
    color: var(--vd-text);
}

/* =========================================================
   ACCOUNT SUMMARY
   ========================================================= */

.account-summary {
    background: #ffffff;

    border: 1px solid var(--vd-border);
    border-radius: var(--vd-radius);

    box-shadow: var(--vd-shadow);

    margin-bottom: 18px;

    overflow: hidden;
}

.account-summary-header {
    padding: 15px 17px;

    border-bottom: 1px solid var(--vd-border);
}

.account-summary-header h3 {
    margin: 0;

    color: var(--vd-text);

    font-size: 14px;
    font-weight: 700;
}

.account-summary-grid {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 0;
}

.account-item {
    padding: 15px 17px;

    border-right: 1px solid var(--vd-border);
}

.account-item:last-child {
    border-right: none;
}

.account-label {
    color: var(--vd-muted);

    font-size: 10px;

    text-transform: uppercase;

    font-weight: 700;

    margin-bottom: 5px;
}

.account-value {
    color: var(--vd-text);

    font-size: 13px;

    font-weight: 600;
}

/* =========================================================
   EMPTY / ERROR
   ========================================================= */

.vendor-empty {
    padding: 22px;

    color: var(--vd-muted);

    font-size: 12px;

    text-align: center;
}

.vendor-error {
    max-width: 520px;

    margin: 40px auto;

    padding: 22px;

    background: #ffffff;

    border: 1px solid var(--vd-border);

    border-radius: var(--vd-radius);

    box-shadow: var(--vd-shadow);
}

.vendor-error h3 {
    margin: 0 0 10px;

    color: var(--vd-text);

    font-size: 16px;
}

.vendor-error p {
    color: var(--vd-muted);

    font-size: 13px;

    line-height: 1.6;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 1100px) {

    .vendor-kpi-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .vendor-quick-actions {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .vendor-chart-grid,
    .vendor-panel-grid {
        grid-template-columns: 1fr;
    }

    .account-summary-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .account-item:nth-child(2) {
        border-right: none;
    }

    .account-item {
        border-bottom: 1px solid var(--vd-border);
    }

    .account-item:nth-last-child(-n + 2) {
        border-bottom: none;
    }
}

@media (max-width: 700px) {

    #page-content {
        padding: 15px;
    }

    .vendor-kpi-grid {
        grid-template-columns: 1fr;
    }

    .vendor-quick-actions {
        grid-template-columns: 1fr;
    }

    .vendor-welcome {
        flex-direction: column;
        align-items: flex-start;
    }

    .vendor-id-chip {
        width: 100%;
        box-sizing: border-box;
    }

    .vendor-panel {
        overflow-x: auto;
    }

    .vendor-panel table {
        min-width: 600px;
    }

    .account-summary-grid {
        grid-template-columns: 1fr;
    }

    .account-item {
        border-right: none;
        border-bottom: 1px solid var(--vd-border);
    }

    .account-item:last-child {
        border-bottom: none;
    }
}

</style>
</head>

<body>

<div class="app-shell" id="app-shell"></div>

<script src="js/api.js"></script>
<script src="js/chart.umd.min.js"></script>

<script>

/* =========================================================
   AUTH + SHELL
   ========================================================= */

requireAuth();

renderShell(
    "vendor-dashboard.html",
    "My Vendor Dashboard"
);


/* =========================================================
   CHART INSTANCES
   ========================================================= */

let deliveryChart = null;
let orderChart = null;
let performanceTrendChart = null;
let deliveryTrendChart = null;


/* =========================================================
   MAIN LOAD FUNCTION
   ========================================================= */

async function load() {

    const content =
        document.getElementById("page-content");


    /* =====================================================
       LOAD VENDOR
       ===================================================== */

    let vendor;

    try {

        vendor = await api("/vendors/me");

    } catch (err) {

        content.innerHTML = `
            <div class="vendor-error">

                <h3>
                    No Vendor Profile Linked
                </h3>

                <p>
                    ${err.message}
                </p>

                <p>
                    Vendor accounts are matched automatically
                    at registration by email address.
                    If your company was already registered by
                    a procurement manager, make sure you sign up
                    using that exact same email.
                </p>

            </div>
        `;

        return;
    }


    /* =====================================================
       VENDOR INFORMATION
       ===================================================== */

    const vendorCode =
        `VDR-${String(vendor.id).padStart(4, "0")}`;

    const vendorInitial =
        (vendor.name || "V")
            .charAt(0)
            .toUpperCase();


    /* =====================================================
       DASHBOARD HTML
       ===================================================== */

    content.innerHTML = `

        <!-- =================================================
             WELCOME
             ================================================= -->

        <div class="vendor-welcome">

            <div class="vendor-welcome-left">

                <div class="vendor-avatar">
                    ${vendorInitial}
                </div>

                <div>

                    <h2>
                        ${vendor.name || "Vendor Dashboard"}
                    </h2>

                    <p>
                        Welcome back. Here's an overview of your
                        vendor performance and activity.
                    </p>

                </div>

            </div>

            <div class="vendor-id-chip">
                ${vendorCode}
            </div>

        </div>


        <!-- =================================================
             KPI CARDS
             These are informational only.
             ================================================= -->

        <div class="vendor-kpi-grid">

            <div class="vendor-kpi">

                <div class="vendor-kpi-label">
                    Reliability Score
                </div>

                <div class="vendor-kpi-value">
                    ${vendor.reliability_score ?? "N/A"}
                </div>

                <div class="vendor-kpi-sub">
                    ${statusBadge(vendor.risk_level)}
                </div>

            </div>


            <div class="vendor-kpi">

                <div class="vendor-kpi-label">
                    Account Status
                </div>

                <div class="vendor-kpi-value"
                     style="font-size:18px;">

                    ${statusBadge(vendor.status)}

                </div>

                <div class="vendor-kpi-sub">
                    Current vendor account
                </div>

            </div>


            <div class="vendor-kpi">

                <div class="vendor-kpi-label">
                    Vendor ID
                </div>

                <div class="vendor-kpi-value"
                     style="font-size:20px;">

                    ${vendorCode}

                </div>

                <div class="vendor-kpi-sub">
                    ${vendor.email || "No email available"}
                </div>

            </div>


            <div class="vendor-kpi">

                <div class="vendor-kpi-label">
                    Vendor Category
                </div>

                <div class="vendor-kpi-value"
                     style="font-size:17px;">

                    ${vendor.category || "N/A"}

                </div>

                <div class="vendor-kpi-sub">
                    Registered Vendor
                </div>

            </div>

        </div>


        <!-- =================================================
             QUICK ACTIONS
             ================================================= -->

        <div class="vendor-quick-actions">

            <a
                href="procurement.html"
                class="vendor-action"
            >

                <div class="vendor-action-icon">
                    PO
                </div>

                <div>
                    <strong>
                        Order History
                    </strong>

                    <span>
                        View purchase orders
                    </span>
                </div>

            </a>


            <a
                href="performance.html"
                class="vendor-action"
            >

                <div class="vendor-action-icon">
                    PF
                </div>

                <div>
                    <strong>
                        Performance
                    </strong>

                    <span>
                        View vendor performance
                    </span>
                </div>

            </a>


            <a
                href="contracts.html"
                class="vendor-action"
            >

                <div class="vendor-action-icon">
                    CT
                </div>

                <div>
                    <strong>
                        Contracts
                    </strong>

                    <span>
                        View contract information
                    </span>
                </div>

            </a>


            <a
                href="messages.html"
                class="vendor-action"
            >

                <div class="vendor-action-icon">
                    MS
                </div>

                <div>
                    <strong>
                        Communication
                    </strong>

                    <span>
                        Open vendor messages
                    </span>
                </div>

            </a>

        </div>


        <!-- =================================================
             CHARTS
             ================================================= -->

        <div class="vendor-chart-grid">


            <!-- DELIVERY DOUGHNUT -->

            <div class="vendor-chart-card">

                <div class="vendor-chart-header">

                    <h3>
                        Delivery Performance
                    </h3>

                    <span>
                        On-Time vs Delayed
                    </span>

                </div>

                <div class="vendor-chart-body">

                    <canvas
                        id="delivery-chart">
                    </canvas>

                </div>

            </div>


            <!-- ORDER STACKED BAR -->

            <div class="vendor-chart-card">

                <div class="vendor-chart-header">

                    <h3>
                        Order Status
                    </h3>

                    <span>
                        Purchase Order Overview
                    </span>

                </div>

                <div class="vendor-chart-body">

                    <canvas
                        id="order-chart">
                    </canvas>

                </div>

            </div>


            <!-- PERFORMANCE LINE -->

            <div class="vendor-chart-card">

                <div class="vendor-chart-header">

                    <h3>
                        Performance Trend
                    </h3>

                    <span>
                        Completion & Quality
                    </span>

                </div>

                <div class="vendor-chart-body">

                    <canvas
                        id="performance-trend-chart">
                    </canvas>

                </div>

            </div>


            <!-- STACKED LINE -->

            <div class="vendor-chart-card">

                <div class="vendor-chart-header">

                    <h3>
                        Delivery Trend
                    </h3>

                    <span>
                        On-Time & Delayed Deliveries
                    </span>

                </div>

                <div class="vendor-chart-body">

                    <canvas
                        id="delivery-trend-chart">
                    </canvas>

                </div>

            </div>

        </div>


        <!-- =================================================
             PERFORMANCE + CONTRACTS
             ================================================= -->

        <div class="vendor-panel-grid">


            <!-- PERFORMANCE HISTORY -->

            <div class="vendor-panel">

                <div class="vendor-panel-header">

                    <h3>
                        Performance History
                    </h3>

                    <p>
                        Recorded vendor performance
                    </p>

                </div>

                <table id="perf-table">

                    <thead>

                        <tr>
                            <th>Date</th>
                            <th>On-Time</th>
                            <th>Delayed</th>
                            <th>Quality</th>
                            <th>Completion</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr>
                            <td
                                colspan="5"
                                class="text-muted"
                            >
                                Loading...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>


            <!-- CONTRACTS -->

            <div class="vendor-panel">

                <div class="vendor-panel-header">

                    <h3>
                        Contract Status
                    </h3>

                    <p>
                        Current vendor contracts
                    </p>

                </div>

                <table id="contract-table">

                    <thead>

                        <tr>
                            <th>Title</th>
                            <th>End Date</th>
                            <th>Compliance</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr>
                            <td
                                colspan="3"
                                class="text-muted"
                            >
                                Loading...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


        <!-- =================================================
             ORDERS + COMMUNICATION
             ================================================= -->

        <div class="vendor-panel-grid">


            <!-- ORDER HISTORY -->

            <div class="vendor-panel">

                <div class="vendor-panel-header">

                    <h3>
                        Order History
                    </h3>

                    <p>
                        Recent purchase orders
                    </p>

                </div>

                <table id="order-table">

                    <thead>

                        <tr>
                            <th>PO Number</th>
                            <th>Item</th>
                            <th>Total</th>
                            <th>Status</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr>
                            <td
                                colspan="4"
                                class="text-muted"
                            >
                                Loading...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>


            <!-- COMMUNICATION -->

            <div class="vendor-panel communication-panel">

                <div class="communication-header">

                    <div>

                        <h3>
                            Communication Activity
                        </h3>

                        <p>
                            Recent messages
                        </p>

                    </div>

                    <a
                        href="messages.html"
                        class="communication-button"
                    >
                        Open Inbox
                    </a>

                </div>

                <div id="comm-activity">

                    <p class="text-muted">
                        Loading...
                    </p>

                </div>

            </div>

        </div>


        <!-- =================================================
             ACCOUNT SUMMARY
             ================================================= -->

        <div class="account-summary">

            <div class="account-summary-header">

                <h3>
                    Account Information
                </h3>

            </div>

            <div class="account-summary-grid">

                <div class="account-item">

                    <div class="account-label">
                        Vendor Name
                    </div>

                    <div class="account-value">
                        ${vendor.name || "N/A"}
                    </div>

                </div>


                <div class="account-item">

                    <div class="account-label">
                        Email
                    </div>

                    <div class="account-value">
                        ${vendor.email || "N/A"}
                    </div>

                </div>


                <div class="account-item">

                    <div class="account-label">
                        Category
                    </div>

                    <div class="account-value">
                        ${vendor.category || "N/A"}
                    </div>

                </div>


                <div class="account-item">

                    <div class="account-label">
                        Account Status
                    </div>

                    <div class="account-value">
                        ${vendor.status || "N/A"}
                    </div>

                </div>

            </div>

        </div>

    `;


    /* =====================================================
       LOAD ALL DATA
       ===================================================== */

    const [
        performance,
        contracts,
        orders,
        messages
    ] = await Promise.all([

        api(
            `/performance/vendor/${vendor.id}`
        ),

        api(
            `/contracts?vendor_id=${vendor.id}`
        ),

        api(
            `/procurement?vendor_id=${vendor.id}`
        ),

        api(
            `/messages/vendor/${vendor.id}`
        )

    ]);


    /* =====================================================
       PERFORMANCE TABLE
       ===================================================== */

    document.querySelector(
        "#perf-table tbody"
    ).innerHTML = performance.length

        ? performance.map(r => `

            <tr>

                <td>
                    ${fmtDate(r.recorded_at)}
                </td>

                <td>
                    ${r.on_time_deliveries ?? 0}
                </td>

                <td>
                    ${r.delayed_deliveries ?? 0}
                </td>

                <td>
                    ${r.quality_rating ?? 0} / 5
                </td>

                <td>
                    ${r.order_completion_rate ?? 0}%
                </td>

            </tr>

        `).join("")

        : `

            <tr>

                <td
                    colspan="5"
                    class="text-muted"
                >
                    No performance data logged yet.
                </td>

            </tr>

        `;


    /* =====================================================
       CONTRACT TABLE
       ===================================================== */

    document.querySelector(
        "#contract-table tbody"
    ).innerHTML = contracts.length

        ? contracts.map(c => `

            <tr>

                <td>
                    ${c.contract_title}
                </td>

                <td>
                    ${fmtDate(c.end_date)}
                </td>

                <td>
                    ${statusBadge(
                        c.compliance_status
                    )}
                </td>

            </tr>

        `).join("")

        : `

            <tr>

                <td
                    colspan="3"
                    class="text-muted"
                >
                    No contracts on file.
                </td>

            </tr>

        `;


    /* =====================================================
       ORDER TABLE
       ===================================================== */

    document.querySelector(
        "#order-table tbody"
    ).innerHTML = orders.length

        ? orders.map(po => `

            <tr>

                <td>
                    ${po.po_number}
                </td>

                <td>
                    ${po.item_description}
                </td>

                <td>
                    ${fmtMoney(
                        po.total_amount
                    )}
                </td>

                <td>
                    ${statusBadge(po.status)}
                </td>

            </tr>

        `).join("")

        : `

            <tr>

                <td
                    colspan="4"
                    class="text-muted"
                >
                    No purchase orders yet.
                </td>

            </tr>

        `;


    /* =====================================================
       COMMUNICATION
       ===================================================== */

    const recentMessages =
        messages.slice(-4).reverse();


    document.getElementById(
        "comm-activity"
    ).innerHTML = recentMessages.length

        ? recentMessages.map(m => `

            <div>

                <strong>
                    ${m.sender}
                </strong>

                <span class="text-muted">
                    · ${fmtDate(m.sent_at)}
                </span>

                <br>

                <span class="text-muted">
                    ${m.content}
                </span>

            </div>

        `).join("")

        : `

            <p class="text-muted">
                No messages yet.
            </p>

        `;


    /* =====================================================
       DRAW ALL CHARTS
       ===================================================== */

    drawDeliveryChart(performance);

    drawOrderChart(orders);

    drawPerformanceTrendChart(performance);

    drawDeliveryTrendChart(performance);

}


/* =========================================================
   DELIVERY DOUGHNUT CHART
   ========================================================= */

function drawDeliveryChart(performance) {

    const canvas =
        document.getElementById(
            "delivery-chart"
        );

    if (!canvas) {
        return;
    }

    if (deliveryChart) {
        deliveryChart.destroy();
    }

    let onTime = 0;
    let delayed = 0;

    performance.forEach(record => {

        onTime += Number(
            record.on_time_deliveries || 0
        );

        delayed += Number(
            record.delayed_deliveries || 0
        );

    });

    if (onTime === 0 && delayed === 0) {

        onTime = 1;
        delayed = 0;

    }

    deliveryChart = new Chart(
        canvas,
        {
            type: "doughnut",

            data: {

                labels: [
                    "On-Time",
                    "Delayed"
                ],

                datasets: [

                    {
                        data: [
                            onTime,
                            delayed
                        ],

                        backgroundColor: [
                            "#16a34a",
                            "#dc2626"
                        ],

                        borderWidth: 0
                    }

                ]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                cutout: "68%",

                plugins: {

                    legend: {

                        position: "bottom",

                        labels: {

                            usePointStyle: true,

                            padding: 16,

                            font: {
                                size: 10
                            }

                        }

                    }

                }

            }

        }
    );

}


/* =========================================================
   ORDER STATUS STACKED BAR CHART
   ========================================================= */

function drawOrderChart(orders) {

    const canvas =
        document.getElementById(
            "order-chart"
        );

    if (!canvas) {
        return;
    }

    if (orderChart) {
        orderChart.destroy();
    }

    const statusCounts = {};

    orders.forEach(order => {

        const status =
            order.status || "Unknown";

        statusCounts[status] =
            (statusCounts[status] || 0) + 1;

    });

    let labels =
        Object.keys(statusCounts);

    let values =
        Object.values(statusCounts);

    if (!labels.length) {

        labels = ["No Orders"];
        values = [0];

    }

    orderChart = new Chart(
        canvas,
        {
            type: "bar",

            data: {

                labels: ["Orders"],

                datasets: labels.map(
                    (status, index) => ({

                        label: status,

                        data: [
                            values[index]
                        ],

                        backgroundColor:
                            [
                                "#2563eb",
                                "#16a34a",
                                "#d97706",
                                "#dc2626",
                                "#7c3aed",
                                "#64748b"
                            ][index % 6],

                        borderWidth: 0

                    })
                )

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                scales: {

                    x: {
                        stacked: true
                    },

                    y: {

                        stacked: true,

                        beginAtZero: true,

                        ticks: {
                            precision: 0
                        }

                    }

                },

                plugins: {

                    legend: {

                        position: "bottom",

                        labels: {

                            usePointStyle: true,

                            padding: 12,

                            font: {
                                size: 9
                            }

                        }

                    }

                }

            }

        }
    );

}


/* =========================================================
   PERFORMANCE LINE CHART
   ========================================================= */

function drawPerformanceTrendChart(
    performance
) {

    const canvas =
        document.getElementById(
            "performance-trend-chart"
        );

    if (!canvas) {
        return;
    }

    if (performanceTrendChart) {
        performanceTrendChart.destroy();
    }

    const records =
        performance.slice(-8);

    const labels =
        records.map(
            r => fmtDate(r.recorded_at)
        );

    const completion =
        records.map(
            r => Number(
                r.order_completion_rate || 0
            )
        );

    const quality =
        records.map(
            r => Number(
                r.quality_rating || 0
            ) * 20
        );

    if (!labels.length) {

        labels.push("No Data");
        completion.push(0);
        quality.push(0);

    }

    performanceTrendChart =
        new Chart(
            canvas,
            {

                type: "line",

                data: {

                    labels: labels,

                    datasets: [

                        {
                            label:
                                "Completion Rate (%)",

                            data:
                                completion,

                            borderColor:
                                "#2563eb",

                            backgroundColor:
                                "rgba(37, 99, 235, 0.08)",

                            fill: true,

                            tension: 0.35,

                            pointRadius: 3,

                            borderWidth: 2
                        },

                        {
                            label:
                                "Quality Rating (%)",

                            data:
                                quality,

                            borderColor:
                                "#16a34a",

                            backgroundColor:
                                "transparent",

                            fill: false,

                            tension: 0.35,

                            pointRadius: 3,

                            borderWidth: 2
                        }

                    ]

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    scales: {

                        y: {

                            beginAtZero: true,

                            max: 100

                        }

                    },

                    plugins: {

                        legend: {

                            position: "bottom",

                            labels: {

                                usePointStyle: true,

                                padding: 12,

                                font: {
                                    size: 9
                                }

                            }

                        }

                    }

                }

            }
        );

}


/* =========================================================
   STACKED DELIVERY LINE CHART
   ========================================================= */

function drawDeliveryTrendChart(
    performance
) {

    const canvas =
        document.getElementById(
            "delivery-trend-chart"
        );

    if (!canvas) {
        return;
    }

    if (deliveryTrendChart) {
        deliveryTrendChart.destroy();
    }

    const records =
        performance.slice(-8);

    const labels =
        records.map(
            r => fmtDate(r.recorded_at)
        );

    const onTime =
        records.map(
            r => Number(
                r.on_time_deliveries || 0
            )
        );

    const delayed =
        records.map(
            r => Number(
                r.delayed_deliveries || 0
            )
        );

    if (!labels.length) {

        labels.push("No Data");
        onTime.push(0);
        delayed.push(0);

    }

    deliveryTrendChart =
        new Chart(
            canvas,
            {

                type: "line",

                data: {

                    labels: labels,

                    datasets: [

                        {
                            label:
                                "On-Time",

                            data:
                                onTime,

                            borderColor:
                                "#16a34a",

                            backgroundColor:
                                "rgba(22, 163, 74, 0.12)",

                            fill: true,

                            tension: 0.35,

                            pointRadius: 3,

                            borderWidth: 2
                        },

                        {
                            label:
                                "Delayed",

                            data:
                                delayed,

                            borderColor:
                                "#dc2626",

                            backgroundColor:
                                "rgba(220, 38, 38, 0.10)",

                            fill: true,

                            tension: 0.35,

                            pointRadius: 3,

                            borderWidth: 2
                        }

                    ]

                },

                options: {

                    responsive: true,

                    maintainAspectRatio: false,

                    scales: {

                        x: {
                            stacked: true
                        },

                        y: {

                            stacked: true,

                            beginAtZero: true,

                            ticks: {
                                precision: 0
                            }

                        }

                    },

                    plugins: {

                        legend: {

                            position: "bottom",

                            labels: {

                                usePointStyle: true,

                                padding: 12,

                                font: {
                                    size: 9
                                }

                            }

                        }

                    }

                }

            }
        );

}


/* =========================================================
   START DASHBOARD
   ========================================================= */

load();

</script>
