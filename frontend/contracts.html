<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<title>VendorIQ | Contracts & Compliance</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="app-shell" id="app-shell"></div>


<script src="js/api.js"></script>


<script>

requireAuth();

renderShell(
  "contracts.html",
  "Contracts & Compliance"
);


/* Document types available for vendor documents */
const DOC_TYPES = [
  "Business License",
  "Tax Certificate",
  "Insurance Certificate",
  "ISO Certification",
  "Other"
];


let vendorsCache = [];

let selectedDocVendorId = null;


/* Get the logged-in user */
const user = getUser();


/*
 * These roles can create contracts.
 */
const canCreateContract =
  user &&
  [
    "Administrator",
    "Procurement Manager",
    "Supply Chain Manager"
  ].includes(user.role);


/*
 * These roles can change contract compliance.
 */
const canUpdateCompliance =
  user &&
  [
    "Administrator",
    "Procurement Manager",
    "Supply Chain Manager"
  ].includes(user.role);


/*
 * These roles can upload and manage documents.
 */
const canManageDocuments =
  user &&
  [
    "Administrator",
    "Procurement Manager",
    "Supply Chain Manager"
  ].includes(user.role);



async function load() {

  const content =
    document.getElementById("page-content");


  try {

    /*
     * Load vendors so we can show their names
     * in the contract and document sections.
     */
    vendorsCache =
      await api("/vendors");


    if (user && user.role === "Vendor") {

  selectedDocVendorId =
    user.vendor_id;

} else if (
  !selectedDocVendorId &&
  vendorsCache.length
) {

  selectedDocVendorId =
    vendorsCache[0].id;

}


    content.innerHTML = `

      <!-- Contract toolbar -->

      <div class="table-toolbar">

        <div></div>


        ${
          canCreateContract
            ? `
              <button
                class="btn"
                onclick="openModal()">

                + Add Contract

              </button>
            `
            : ""
        }

      </div>


      <!-- Contracts table -->

      <table>

        <thead>

          <tr>

            <th>Title</th>

            <th>Vendor</th>

            <th>Start</th>

            <th>End</th>

            <th>Compliance</th>

            <th>Document</th>

            <th>Actions</th>

          </tr>

        </thead>


        <tbody id="contract-rows">

          <tr>

            <td
              colspan="7"
              class="text-muted">

              Loading...

            </td>

          </tr>

        </tbody>

      </table>


      <!-- Vendor documents -->

      <div
        class="panel"
        style="margin-top:28px;">

        <div
          class="flex-between mb-16">

          <h3 style="margin:0;">

            Documents &amp; Certifications

          </h3>


          <select
            id="doc-vendor-select"
            onchange="selectDocVendor(this.value)">

            ${
              vendorsCache
                .map(
                  vendor => `

                    <option
                      value="${vendor.id}"
                      ${
                        vendor.id === selectedDocVendorId
                          ? "selected"
                          : ""
                      }>

                      ${vendor.name}

                    </option>

                  `
                )
                .join("")
            }

          </select>

        </div>


        ${
          canManageDocuments
            ? `

              <!-- Upload vendor document -->

              <div
                style="
                  display:flex;
                  gap:10px;
                  align-items:flex-end;
                  flex-wrap:wrap;
                  margin-bottom:18px;
                  padding-bottom:18px;
                  border-bottom:1px solid var(--border);
                ">

                <div
                  class="field"
                  style="margin-bottom:0;">

                  <label>
                    Document Type
                  </label>

                  <select id="doc-type">

                    ${
                      DOC_TYPES
                        .map(
                          type =>
                            `<option>${type}</option>`
                        )
                        .join("")
                    }

                  </select>

                </div>


                <div
                  class="field"
                  style="margin-bottom:0;">

                  <label>
                    Expiry Date (optional)
                  </label>

                  <input
                    id="doc-expiry"
                    type="date">

                </div>


                <div
                  class="field"
                  style="margin-bottom:0;">

                  <label>
                    File (PDF/JPG/PNG/DOC, max 10MB)
                  </label>

                  <input
                    id="doc-file"
                    type="file"
                    accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">

                </div>


                <button
                  class="btn small"
                  onclick="uploadDocument()">

                  Upload

                </button>

              </div>


              <div
                class="error-msg"
                id="doc-error">
              </div>

            `
            : ""
        }


        <!-- Existing vendor documents -->

        <table>

          <thead>

            <tr>

              <th>Type</th>

              <th>File</th>

              <th>Expiry</th>

              <th>Uploaded</th>

              <th>
              </th>

            </tr>

          </thead>


          <tbody id="doc-rows">

            <tr>

              <td
                colspan="5"
                class="text-muted">

                Loading...

              </td>

            </tr>

          </tbody>

        </table>

      </div>


      ${
        canCreateContract
          ? `

            <!-- Add contract popup -->

            <div
              class="modal-backdrop hidden"
              id="modal">

              <div class="modal">

                <h3>
                  Add Contract
                </h3>


                <div class="field">

                  <label>
                    Vendor
                  </label>

                  <select id="c-vendor">

                    ${
                      vendorsCache
                        .map(
                          vendor => `

                            <option
                              value="${vendor.id}">

                              ${vendor.name}

                            </option>

                          `
                        )
                        .join("")
                    }

                  </select>

                </div>


                <div class="field">

                  <label>
                    Contract Title
                  </label>

                  <input
                    id="c-title"
                    type="text">

                </div>


                <div class="field">

                  <label>
                    Start Date
                  </label>

                  <input
                    id="c-start"
                    type="date">

                </div>


                <div class="field">

                  <label>
                    End Date
                  </label>

                  <input
                    id="c-end"
                    type="date">

                </div>


                <div class="field">

                  <label>
                    Notes
                  </label>

                  <textarea
                    id="c-notes"
                    rows="2">
                  </textarea>

                </div>


                <div
                  class="error-msg"
                  id="c-error">
                </div>


                <div class="modal-actions">

                  <button
                    class="btn secondary"
                    onclick="closeModal()">

                    Cancel

                  </button>


                  <button
                    class="btn"
                    onclick="submitContract()">

                    Save

                  </button>

                </div>

              </div>

            </div>

          `
          : ""
      }

    `;


    await loadContracts();

    await loadDocuments();


  } catch (err) {

    console.error(
      "CONTRACT PAGE ERROR:",
      err
    );


    content.innerHTML = `

      <p class="error-msg">

        ${err.message}

      </p>

    `;

  }

}



/*
 * Load all contracts and display them.
 */
async function loadContracts() {

  try {

    const contracts =
      await api("/contracts");


    const vendorMap = {};


    vendorsCache.forEach(vendor => {

      vendorMap[vendor.id] =
        vendor.name;

    });


    const rows =
      document.getElementById(
        "contract-rows"
      );


    if (!contracts.length) {

      rows.innerHTML = `

        <tr>

          <td
            colspan="7"
            class="text-muted">

            No contracts on file.

          </td>

        </tr>

      `;

      return;

    }


    rows.innerHTML =
      contracts
        .map(contract => `

          <tr>

            <td>
              ${contract.contract_title}
            </td>


            <td>
              ${
                vendorMap[contract.vendor_id]
                || contract.vendor_id
              }
            </td>


            <td>
              ${fmtDate(contract.start_date)}
            </td>


            <td>
              ${fmtDate(contract.end_date)}
            </td>


            <td>
              ${statusBadge(
                contract.compliance_status
              )}
            </td>


            <td>

              ${
                contract.document_name

                  ? `

                    <a
                      href="#"
                      onclick="
                        downloadFile(
                          '/contracts/${contract.id}/document',
                          '${contract.document_name}'
                        );
                        return false;
                      ">

                      📄
                      ${contract.document_name}

                    </a>

                  `

                  : canManageDocuments

                    ? `

                      <label
                        class="btn small secondary"
                        style="cursor:pointer;">

                        Upload

                        <input
                          type="file"
                          style="display:none;"
                          accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"
                          onchange="
                            uploadContractDoc(
                              ${contract.id},
                              this
                            )
                          ">

                      </label>

                    `

                    : `

                      <span class="text-muted">
                        No document
                      </span>

                    `
              }

            </td>


            <td>

              ${
                canUpdateCompliance

                  ? `

                    <select
                      onchange="
                        updateCompliance(
                          ${contract.id},
                          this.value
                        )
                      ">

                      <option value="">
                        Update...
                      </option>

                      <option>
                        Compliant
                      </option>

                      <option>
                        At Risk
                      </option>

                      <option>
                        Non-Compliant
                      </option>

                    </select>

                  `

                  : `

                    <span class="text-muted">
                      View only
                    </span>

                  `
              }

            </td>

          </tr>

        `)
        .join("");


  } catch (err) {

    const rows =
      document.getElementById(
        "contract-rows"
      );


    rows.innerHTML = `

      <tr>

        <td
          colspan="7"
          class="error-msg">

          ${err.message}

        </td>

      </tr>

    `;

  }

}



/*
 * Change the vendor whose documents we are viewing.
 */
function selectDocVendor(id) {

  selectedDocVendorId =
    Number(id);


  loadDocuments();

}



/*
 * Load documents for the selected vendor.
 */
async function loadDocuments() {

  const rows =
    document.getElementById(
      "doc-rows"
    );


  if (!rows) return;


  try {

    if (!selectedDocVendorId) {

      rows.innerHTML = `

        <tr>

          <td
            colspan="5"
            class="text-muted">

            No vendor selected.

          </td>

        </tr>

      `;

      return;

    }


    const docs =
      await api(
        `/vendors/${selectedDocVendorId}/documents`
      );


    const now =
      new Date();


    if (!docs.length) {

      rows.innerHTML = `

        <tr>

          <td
            colspan="5"
            class="text-muted">

            No documents uploaded
            for this vendor yet.

          </td>

        </tr>

      `;

      return;

    }


    rows.innerHTML =
      docs
        .map(document => {

          let expiryLabel = "-";


          if (document.expiry_date) {

            const expiry =
              new Date(
                document.expiry_date
              );


            const daysLeft =
              Math.round(
                (
                  expiry - now
                ) /
                (
                  1000 *
                  60 *
                  60 *
                  24
                )
              );


            const cls =
              daysLeft < 0
                ? "red"
                : daysLeft <= 30
                  ? "orange"
                  : "green";


            expiryLabel = `

              <span
                class="badge ${cls}">

                ${fmtDate(
                  document.expiry_date
                )}

              </span>

            `;

          }


          return `

            <tr>

              <td>
                ${document.document_type}
              </td>


              <td>

                <a
                  href="#"
                  onclick="
                    downloadFile(
                      '/vendors/documents/${document.id}/download',
                      '${document.file_name}'
                    );
                    return false;
                  ">

                  📄
                  ${document.file_name}

                </a>

              </td>


              <td>
                ${expiryLabel}
              </td>


              <td>
                ${fmtDate(
                  document.uploaded_at
                )}
              </td>


              <td>

                ${
                  canManageDocuments

                    ? `

                      <button
                        class="btn small danger"
                        onclick="
                          deleteDocument(
                            ${document.id}
                          )
                        ">

                        Delete

                      </button>

                    `

                    : ""

                }

              </td>

            </tr>

          `;

        })
        .join("");


  } catch (err) {

    rows.innerHTML = `

      <tr>

        <td
          colspan="5"
          class="error-msg">

          ${err.message}

        </td>

      </tr>

    `;

  }

}



/*
 * Upload a vendor certification/document.
 */
async function uploadDocument() {

  if (!canManageDocuments) {

    alert(
      "You do not have permission to upload documents."
    );

    return;

  }


  const errorEl =
    document.getElementById(
      "doc-error"
    );


  errorEl.textContent = "";


  const fileInput =
    document.getElementById(
      "doc-file"
    );


  if (
    !fileInput ||
    !fileInput.files.length
  ) {

    errorEl.textContent =
      "Choose a file first.";

    return;

  }


  const formData =
    new FormData();


  formData.append(
    "document_type",
    document.getElementById(
      "doc-type"
    ).value
  );


  const expiry =
    document.getElementById(
      "doc-expiry"
    ).value;


  if (expiry) {

    formData.append(
      "expiry_date",
      new Date(
        expiry
      ).toISOString()
    );

  }


  formData.append(
    "file",
    fileInput.files[0]
  );


  try {

    await api(
      `/vendors/${selectedDocVendorId}/documents`,
      {
        method: "POST",
        body: formData,
        isForm: true
      }
    );


    fileInput.value = "";

    document.getElementById(
      "doc-expiry"
    ).value = "";


    await loadDocuments();


  } catch (err) {

    errorEl.textContent =
      err.message;

  }

}



/*
 * Delete a vendor document.
 */
async function deleteDocument(id) {

  if (!canManageDocuments) {

    alert(
      "You do not have permission to delete documents."
    );

    return;

  }


  if (
    !confirm(
      "Delete this document?"
    )
  ) {

    return;

  }


  try {

    await api(
      `/vendors/documents/${id}`,
      {
        method: "DELETE"
      }
    );


    await loadDocuments();


  } catch (err) {

    alert(err.message);

  }

}



/*
 * Upload a document directly to a contract.
 */
async function uploadContractDoc(
  contractId,
  inputEl
) {

  if (!canManageDocuments) {

    alert(
      "You do not have permission to upload contract documents."
    );

    inputEl.value = "";

    return;

  }


  if (
    !inputEl.files.length
  ) {

    return;

  }


  const formData =
    new FormData();


  formData.append(
    "file",
    inputEl.files[0]
  );


  try {

    await api(
      `/contracts/${contractId}/document`,
      {
        method: "POST",
        body: formData,
        isForm: true
      }
    );


    await loadContracts();


  } catch (err) {

    alert(err.message);

  }

}



/*
 * Download an existing file.
 */
async function downloadFile(
  path,
  filename
) {

  try {

    const res =
      await api(
        path,
        {
          raw: true
        }
      );


    const blob =
      await res.blob();


    const link =
      document.createElement(
        "a"
      );


    link.href =
      URL.createObjectURL(
        blob
      );


    link.download =
      filename;


    link.click();


    URL.revokeObjectURL(
      link.href
    );


  } catch (err) {

    alert(
      "Download failed: " +
      err.message
    );

  }

}



/*
 * Open the Add Contract popup.
 */
function openModal() {

  if (!canCreateContract) {

    alert(
      "You do not have permission to add contracts."
    );

    return;

  }


  const modal =
    document.getElementById(
      "modal"
    );


  if (modal) {

    modal.classList.remove(
      "hidden"
    );

  }

}



/*
 * Close the Add Contract popup.
 */
function closeModal() {

  const modal =
    document.getElementById(
      "modal"
    );


  if (modal) {

    modal.classList.add(
      "hidden"
    );

  }

}



/*
 * Create a new contract.
 */
async function submitContract() {

  if (!canCreateContract) {

    alert(
      "You do not have permission to add contracts."
    );

    return;

  }


  const errorEl =
    document.getElementById(
      "c-error"
    );


  errorEl.textContent = "";


  try {

    const startDate =
      document.getElementById(
        "c-start"
      ).value;


    const endDate =
      document.getElementById(
        "c-end"
      ).value;


    if (!startDate || !endDate) {

      errorEl.textContent =
        "Please select both start and end dates.";

      return;

    }


    await api(
      "/contracts",
      {
        method: "POST",

        body: {

          vendor_id:
            Number(
              document.getElementById(
                "c-vendor"
              ).value
            ),

          contract_title:
            document.getElementById(
              "c-title"
            ).value,

          start_date:
            new Date(
              startDate
            ).toISOString(),

          end_date:
            new Date(
              endDate
            ).toISOString(),

          notes:
            document.getElementById(
              "c-notes"
            ).value

        }

      }
    );


    closeModal();

    await loadContracts();


  } catch (err) {

    errorEl.textContent =
      err.message;

  }

}



/*
 * Change the compliance status of a contract.
 */
async function updateCompliance(
  id,
  status
) {

  if (!status) return;


  if (!canUpdateCompliance) {

    alert(
      "You do not have permission to update contract compliance."
    );

    return;

  }


  try {

    await api(
      `/contracts/${id}/compliance?status=${encodeURIComponent(status)}`,
      {
        method: "PUT"
      }
    );


    await loadContracts();


  } catch (err) {

    alert(err.message);

  }

}


/* Load the page */
load();

</script>

</body>
</html>
