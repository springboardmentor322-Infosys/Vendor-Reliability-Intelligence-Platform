version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vendoriq
      POSTGRES_PASSWORD: vendoriq
      POSTGRES_DB: vendoriq
    volumes:
      - vendoriq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendoriq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://vendoriq:vendoriq@postgres:5432/vendoriq
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Copy .env.example to .env and set SECRET_KEY}
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5500","http://127.0.0.1:5500"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./frontend-web:/usr/share/nginx/html:ro

volumes:
  vendoriq_pgdata:
