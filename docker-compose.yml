name: vendoriq-complete

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vendoriq
      POSTGRES_PASSWORD: vendoriq
      POSTGRES_DB: vendoriq
    volumes:
      - vendoriq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendoriq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://vendoriq:vendoriq@postgres:5432/vendoriq
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Copy .env.example to .env and set SECRET_KEY}
      CORS_ORIGINS: '["http://localhost:18080","http://127.0.0.1:18080"]'
      SEED_DEMO_ACCOUNTS: "true"
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-VendorIQ}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:18080}
    ports:
      - "18081:8000"
    volumes:
      - ./backend:/app
      - vendoriq_uploads:/app/uploads

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "18080:80"
    volumes:
      - ./frontend-web:/usr/share/nginx/html:ro

volumes:
  vendoriq_pgdata:
  vendoriq_uploads:
