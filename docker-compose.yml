version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vendoriq_postgres
    restart: always
    environment:
      POSTGRES_DB: vendor_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_db_password_here
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    container_name: vendoriq_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=vendor_platform
      - DB_USER=postgres
      - DB_PASSWORD=your_db_password_here
      - SECRET_KEY=your_jwt_secret_key_here
    depends_on:
      - db

volumes:
  pgdata:
