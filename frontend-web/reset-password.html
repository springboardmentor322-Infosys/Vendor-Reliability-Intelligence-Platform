<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VendorIQ - Set New Password</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head>
<body><div class="auth-shell"><div class="auth-hero"><div class="brand"><span class="brand-mark"></span> VendorIQ</div><div><h1 class="headline">Set a new password for your workspace.</h1><p class="sub">This reset link expires after 30 minutes and cannot be used as a sign-in session.</p></div><div class="stat-row"><div class="stat"><b>30 min</b><span>reset-link expiry</span></div><div class="stat"><b>6+</b><span>password characters</span></div></div></div><div class="auth-form-wrap"><div class="auth-card"><h1>Choose a new password</h1><p class="lead">Enter and confirm a new password for your account.</p><div id="banner" class="banner banner-error"></div><form id="reset-confirm-form"><div class="field"><label for="new-password">New password</label><input id="new-password" type="password" minlength="6" autocomplete="new-password" required placeholder="At least 6 characters"></div><div class="field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required placeholder="Repeat your new password"></div><button class="btn btn-primary btn-block" id="reset-confirm-button">Reset password</button></form><div class="auth-switch"><a href="index.html">Return to sign in</a></div></div></div></div><script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/auth.js"></script></body></html>
